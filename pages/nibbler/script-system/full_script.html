  <script>
    const markdown = "# The Nibbler: Shadows of Deception — Full Script\n\n*Compiled on 7/1/2026, 5:56:31 PM*\n\n---\n\n\n## EPISODE 1 — The Trail\n\n---\n\n\n### Scene 1: Crime Scene & Voiceover\n\n*EPISODE 1 — The Trail | ID: e1-crime-scene-voiceover | File: e1_01_crime_scene_voiceover.md*\n\n---\n\n<!-- summary: Dustin works a strange robbery scene, finds a weevil figurine, and introduces the Weevil case in voiceover. -->\n\nINT. PAWN SHOP - WHALLEY AVENUE - NIGHT\n\nRed and blue light sweeps through a broken storefront window. Uniformed officers stand around drinking coffee. Nothing about them is urgent.\n\nAt the back wall: DUSTIN MEGLIO, 40s, trench coat, a face that has practiced looking haunted in the mirror. He studies the wall through an enormous magnifying glass. Slow. Deliberate. Much closer to the wall than any human needs to be.\n\nDUSTIN\n\n(V.O.)\n\nThe city has changed. It used to have character. Now it only has mischief.\n\nHe snaps on a dusting glove. With tweezers, he lifts a single hair off the counter and drops it into his coat pocket. Not an evidence bag. His pocket.\n\nDUSTIN\n\n(V.O.)\n\nI used to walk in the bright streets. Now I lurk in the shadows — waiting for a chance to catch a break.\n\nA young OFFICER approaches, holding out an evidence bag.\n\nOFFICER\n\nDetective. We found another one.\n\nInside the bag: a small metal WEEVIL FIGURINE. Intricate. Polished. Beautiful, if you didn't know better.\n\nDustin takes the bag. Looks at it a long moment. Something crosses his face and he puts it away before it can be named.\n\nDUSTIN\n\nRegister emptied. Safe untouched. Nothing broken but the window they came in through. And this.\n\nOFFICER\n\nWhat does it mean?\n\nDUSTIN\n\nIt means somebody's saying hello.\n\nINT. DUSTIN'S OFFICE - POLICE STATION - NIGHT\n\nA dim private office. Flickering fluorescent light. Case files fanned across a cluttered desk. A corkboard with photographs: storefronts, warehouses, a marina. Six weevil figurines in six evidence bags, pinned in a neat row.\n\nDustin sits with the newest figurine, turning the bag in the light.\n\nDUSTIN\n\n(V.O.)\n\nEleven robberies in four months. High-profile. Clean. No prints, no witnesses, no pattern anyone downtown could see. Just the calling card — a little metal weevil, left behind at every scene. The papers gave him the name. The Weevil. It stuck.\n\nHe holds the bag closer. His voiceover drops, quieter.\n\nDUSTIN\n\n(V.O.)\n\nThe figurines bothered me more than they should have. Not because of what they were. Because of the way they were placed. Careful. At a height. Like they were left for someone specific.\n\nHe sets the bag down. Doesn't finish the thought.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 2: Trail of Glasses\n\n*EPISODE 1 — The Trail | ID: e1-trail-of-glasses | File: e1_02_trail_of_glasses.md*\n\n---\n\n<!-- summary: Outside the station, Dustin spits out chewing tobacco, spots a trail of eyeglasses on the sidewalk, and follows it across New Haven to Rudie's Bar. -->\n\nEXT. POLICE STATION - NEW HAVEN - DAY\n\nDustin stands on the station steps. He produces a pouch of chewing tobacco, packs a wad into his cheek with the gravity of a ritual.\n\nHe hates it immediately. He spits it out.\n\nDUSTIN\n\n(V.O.)\n\nI'd been trying to pick up chewing tobacco for six months. Every detective needs a vice. Mine didn't agree with me.\n\nAs he spits, his eyes land on something on the sidewalk.\n\nA PAIR OF EYEGLASSES. Folded. Sitting on the pavement like they were set down by a careful hand.\n\nDustin looks up the block. Ten yards on: ANOTHER PAIR.\n\nBeyond that, catching the light: ANOTHER.\n\nDUSTIN\n\n(V.O.)\n\nLife wasn't always this easy. There were years when nothing connected. One was two, two was three — none of it made sense. And then some mornings the city just hands you a trail.\n\nEXT. NEW HAVEN STREETS - CONTINUOUS\n\nDustin follows the glasses down the block. He passes pedestrians who step around the glasses without seeing them. He kneels at a pair, picks it up, holds it to the light. Thick lenses. Scratched.\n\nDUSTIN\n\n(V.O.)\n\nOne thing was certain. Whoever these belonged to had a serious problem with their vision.\n\nHe pockets the pair and keeps walking.\n\nDUSTIN\n\n(V.O.)\n\nAnd in a way — so did I.\n\nThe trail turns a corner. Dustin turns with it.\n\nEXT. RUDIE'S BAR - DAY\n\nThe trail ends at the door of a low brick bar. A hand-painted sign: RUDIE'S. The last pair of glasses sits on the doormat, folded, facing out. Like it was waiting for him.\n\nDustin looks at the glasses. Looks at the door.\n\nHe goes in.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 3: Rudie's Bar\n\n*EPISODE 1 — The Trail | ID: e1-rudies-bar | File: e1_03_rudies_bar.md*\n\n---\n\n<!-- summary: At Rudie's, the regulars greet the Nibbler; Dustin reads the headline about the Mayor's Japan scandal and feels the Weevil behind it. -->\n\nINT. RUDIE'S BAR - DAY\n\nDim. Wood. The murmur of conversation and the clink of glasses. A neighborhood bar that has outlived every neighbor.\n\nDustin enters. The room registers him the way a room registers weather. A woman at the end of the bar smiles into her drink. Two men by the pool table nod without pausing their game.\n\nDUSTIN\n\n(V.O.)\n\nRudie's. The one fixed point in a changing city. They know me here. The women smile. The men nod. I'd be lying if I said I hated it.\n\nBehind the bar: LANCE, 60s, a bartender built like a filing cabinet. He has a whiskey poured before Dustin reaches the stool.\n\nLANCE\n\nDetective.\n\nDUSTIN\n\nLance.\n\nDustin sits. Drinks. He sets the folded pair of eyeglasses from the trail on the bar next to his glass, positions it, studies it.\n\nLance looks at the eyeglasses. Decides not to ask.\n\nDustin pulls a tattered NEWSPAPER across the bar. The headline, huge:\n\n\"MAYOR'S JAPAN SCANDAL RESURFACES: A DARK SECRET THREATENS NEW HAVEN'S FUTURE.\"\n\nHis eyes narrow. He reads.\n\nDUSTIN\n\n(V.O.)\n\nThe Mayor's scandal with Japan. Thirty years buried and now it's front page again. Somebody dug it up. Somebody wanted it on this bar, in this light, in front of these eyes.\n\nHe turns the page. A grainy photo of MAYOR ANDERSON at a ribbon-cutting, smiling the smile of a man who practices.\n\nDUSTIN\n\n(V.O.)\n\nThe Weevil is in this. I can feel it. He doesn't rob a city like ours for the money. He's pulling strings. The scandal is just another pawn in his game.\n\nA beat. Dustin looks at his own reflection behind the bottles.\n\nDUSTIN\n\n(V.O.)\n\nThe Weevil. I keep calling him that. Like he's a stranger.\n\nHe folds the paper. Doesn't finish the thought.\n\nLANCE\n\nYou want to talk about it?\n\nDUSTIN\n\nNo.\n\nLANCE\n\nOkay.\n\nDustin drinks. The pool game clicks on behind him.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 4: Shipyard Flashback\n\n*EPISODE 1 — The Trail | ID: e1-shipyard-flashback | File: e1_04_shipyard_flashback.md*\n\n---\n\n<!-- summary: Flashback — Dustin cornered a man he took for the Weevil at the abandoned shipyard; a flicker of recognition, a puff of smoke, and the man was gone. -->\n\nINT. RUDIE'S BAR - CONTINUOUS\n\nDustin stares into his whiskey. The bar sounds fade under the score.\n\nDUSTIN\n\n(V.O.)\n\nThree weeks ago I had him. That's the part nobody knows. I had him, and I stood there like a man reading a menu.\n\nEXT. ABANDONED SHIPYARD - DUSK [FLASHBACK]\n\nCold filter. Wind. Rust. Gulls somewhere, unimpressed.\n\nDustin moves between hulls of dry-docked boats, following a scatter of BROKEN EYEGLASSES — frames, lenses, shards of glass catching the last light. The trail thickens.\n\nIt leads to the center of the yard, where — impossibly — a MAN sits behind a wooden desk. Just a desk, in the open air, papers weighted with a coffee cup. The man writes something. Small, black coffee. No hurry in him at all.\n\nHe is in a suit. Well cut. Clean shoes in a filthy yard.\n\nDustin draws his pistol with one hand and handcuffs with the other, a gesture he has clearly rehearsed.\n\nDUSTIN\n\nFreeze!\n\nThe man looks up.\n\nA half-second. That's all it is. The man's eyes find Dustin's, and something passes between them — a flicker of recognition, going both directions. The man does not look afraid. He looks, if anything, glad.\n\nDUSTIN\n\n(quieter, almost a question)\n\n...Freeze.\n\nThe man reaches — unhurried — for something under the desk.\n\nA PUFF OF SMOKE erupts. Thick, theatrical, absurd.\n\nWhen it clears: an empty desk. A cooling cup of coffee. Dustin alone in a shipyard, holding handcuffs and a pistol, arresting no one.\n\nHe stands there a long moment.\n\nINT. RUDIE'S BAR - DAY [PRESENT]\n\nDustin, at the bar, still looking at his whiskey.\n\nDUSTIN\n\nI let him get away, Lance. He was in front of my eyes and I let him get away.\n\nLANCE\n\nThat's okay, Dustin.\n\nDUSTIN\n\nIs it?\n\nLANCE\n\nYou're the best there is.\n\nDUSTIN\n\nOh, stop it. You're just saying that.\n\nLANCE\n\nMaybe so.\n\nLance moves off to another customer. Dustin turns the whiskey glass a quarter turn. His voiceover, low:\n\nDUSTIN\n\n(V.O.)\n\nI told Lance I let him get away. What I didn't tell him was the half-second before the smoke. The way he looked at me.\n\nA beat.\n\nDUSTIN\n\n(V.O.)\n\nLike we'd met.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 5: The Ghost Walks In\n\n*EPISODE 1 — The Trail | ID: e1-ghost-enters | File: e1_05_ghost_enters.md*\n\n---\n\n<!-- summary: Max, the Ghost, walks into Rudie's; Dustin describes the shipyard man's eyes and almost says more. -->\n\nINT. RUDIE'S BAR - LATER\n\nThe door opens. Nobody announces anything, and yet the room shifts.\n\nMAX — known on the street as THE GHOST — stands in the doorway. 40s. Long coat. He has the stillness of a man who has already checked the exits. The pool game pauses. A woman at the bar sits up a little straighter.\n\nThe Ghost crosses to Dustin and sits. He does not order. Lance brings him a beer anyway.\n\nDUSTIN\n\n(V.O.)\n\nMax. The Ghost. My trusted partner — elusive, mysterious, loyal past the point of reason. He lost everything once for telling the truth. I've never been entirely sure why he chose this life after what it cost him. I've never asked. That's the arrangement.\n\nThey drink in silence for a moment. It is a comfortable silence, or at least a well-worn one.\n\nGHOST\n\nThe pawn shop on Whalley.\n\nDUSTIN\n\nEleven now.\n\nGHOST\n\nFigurine?\n\nDUSTIN\n\nFigurine.\n\nThe Ghost nods slowly. Drinks.\n\nGHOST\n\nTell me about the shipyard.\n\nDustin's hand stops halfway to his glass.\n\nDUSTIN\n\nWho told you about the shipyard?\n\nGHOST\n\nYou did. Just now.\n\nDustin exhales. Puts the glass down.\n\nDUSTIN\n\nHe was sitting at a desk, Max. A desk. In the middle of the yard, like it was a Tuesday at the bank. Broken glasses all over the ground — his little trail, his little joke. I had the drop on him. Gun out, cuffs out.\n\nGHOST\n\nAnd?\n\nDUSTIN\n\nSmoke. A magician's exit. Gone.\n\nGHOST\n\nYou saw his face.\n\nA pause. Dustin looks at the bottles behind the bar.\n\nDUSTIN\n\nI saw his eyes. Calm. Not the calm of a man who doesn't care. The calm of a man who's already planned the next four moves.\n\nDustin opens his mouth to say something more — something specific — and closes it again.\n\nGHOST\n\n(watching him)\n\nWhat.\n\nDUSTIN\n\nNothing. Finish your beer.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 6: Back Alley Conversation\n\n*EPISODE 1 — The Trail | ID: e1-back-alley | File: e1_06_back_alley.md*\n\n---\n\n<!-- summary: In the alley behind Rudie's, Dustin lays out the whole case; the Ghost produces surveillance gear and they agree to go after the Weevil. -->\n\nEXT. BACK ALLEY - BEHIND RUDIE'S - NIGHT\n\nA single bulb over the service door. Dumpster. Wet brick. Dustin and the Ghost stand in the little cone of light like two men who have chosen the least comfortable place in New Haven to talk.\n\nDUSTIN\n\nEleven robberies. Every one of them clean. Register cash, small valuables, nothing traceable — but never the safe. You understand? He leaves the safe. The money isn't the point.\n\nGHOST\n\nThen what's the point?\n\nDUSTIN\n\nThe figurines. The trail of glasses. The desk in the shipyard. He's not hiding, Max. He's performing. Every scene is staged for an audience.\n\nGHOST\n\nWhat audience?\n\nDustin doesn't answer that.\n\nDUSTIN\n\nAnd now the Mayor's Japan scandal crawls out of its grave and onto the front page — the same month the Weevil's jobs start circling City Hall contracts. That's not weather. That's somebody seeding clouds.\n\nThe Ghost considers this. He is quiet long enough that a normal person would fill the silence. Dustin, to his credit, waits.\n\nGHOST\n\nThe department?\n\nDUSTIN\n\nThe department thinks I've been chasing shadows too long. The department thinks a man can't disappear in a puff of smoke.\n\nGHOST\n\nA man can't.\n\nDUSTIN\n\nI was there.\n\nGHOST\n\nI know.\n\nThe Ghost reaches into his coat. From an interior lining that should not hold this much, he produces, one item at a time: a DIRECTIONAL MICROPHONE. A SIGNAL SCANNER. A COMPACT MONITOR wrapped in a dish towel.\n\nHe lays them on the closed dumpster lid like a surgeon's tray.\n\nDUSTIN\n\nWhere do you get these things?\n\nGHOST\n\nI know a guy.\n\nDUSTIN\n\nYou are the guy.\n\nGHOST\n\nI know.\n\nDustin picks up the scanner. Weighs it in his hand. Something in him settles — the self-pity draining out, the other thing coming back in.\n\nDUSTIN\n\nThe robberies track the water. Warehouses, the marina, the boatyard twice. If he's moving product — or people — it's through the docks.\n\nGHOST\n\nThen we watch the docks.\n\nDUSTIN\n\nWe watch the docks.\n\nThey look at each other. A silent vow passes between them, and both men would deny it was a vow.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 7: Detective Office — Doubters\n\n*EPISODE 1 — The Trail | ID: e1-detective-office-doubters | File: e1_07_detective_office_doubters.md*\n\n---\n\n<!-- summary: Dustin presents the Weevil case to a room of doubters; Jones and Miller mock him; the Boss gives him a leash — go find him, don't embarrass us. -->\n\nINT. DETECTIVE OFFICE - POLICE STATION - MORNING\n\nBullpen. Bad coffee. Dustin stands at a corkboard he has wheeled in from his office — photographs, newspaper clippings, six figurines in evidence bags, all of it connected by RED STRING. There is a great deal of red string.\n\nFacing him: DETECTIVE JONES and DETECTIVE MILLER, feet up, already enjoying themselves. A few other detectives orbit with coffee. The Ghost leans against the far wall, arms crossed, watching everything and saying nothing.\n\nDUSTIN\n\n(pointing along the string)\n\nThe robberies. The city contracts. The Mayor's scandal resurfacing. There's a pattern here. Every job circles City Hall and touches the waterfront. He's building toward something.\n\nDETECTIVE JONES\n\n(laughing)\n\nCome on, Dustin. Disappearing into thin air? You've been chasing shadows too long.\n\nDETECTIVE MILLER\n\n(smirking)\n\nMaybe the little bug statues are leaving themselves. You check for tiny fingerprints?\n\nScattered laughter. Dustin's fists clench at his sides. He looks around the room for one ally and finds only the Ghost, who gives him nothing except the fact of still being there — which, from the Ghost, is a great deal.\n\nThe laughter dies because the DETECTIVE BOSS has entered. 60s. A man whose patience retired before he did.\n\nDETECTIVE BOSS\n\nEnough.\n\nHe studies the corkboard. Then Dustin.\n\nDETECTIVE BOSS\n\nLet's have some respect for the Nibbler, boys. Town's hero.\n\n(beat)\n\nBut for what, lately? Eleven scenes and what do you actually have? A theory made of string.\n\nDUSTIN\n\nWe know how he moves. The waterfront. We know where to watch.\n\nThe Boss looks at him for a long moment. It is the look of a man doing math he doesn't enjoy.\n\nDETECTIVE BOSS\n\nYou know what your problem is, Meglio? You're the only man in this building who still thinks this job is a calling.\n\nDUSTIN\n\nIs that a no, sir?\n\nDETECTIVE BOSS\n\n(already walking away)\n\nGo find him. Don't embarrass us.\n\nDustin gathers his string.\n\nMILLER\n\n(under his breath)\n\nHappy hunting, Nibbler.\n\nThe Ghost peels off the wall and follows Dustin out.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 8: Outside the Station\n\n*EPISODE 1 — The Trail | ID: e1-outside-station | File: e1_08_outside_station.md*\n\n---\n\n<!-- summary: Dustin doubts himself outside the station; the Ghost reminds him who he is. -->\n\nEXT. POLICE STATION - DAY\n\nDustin stands on the steps with the corkboard under one arm. He packs a fresh wad of chewing tobacco into his cheek.\n\nHe holds it a full three seconds this time. Progress. Then he spits it out.\n\nDUSTIN\n\nMaybe they're right, Max. No prints. No face I can put a name to. The chances of us catching the Weevil—\n\nGHOST\n\nAre you kidding me?\n\nDustin looks over. The Ghost is not looking at him; he is looking out at the street, which somehow makes it worse.\n\nGHOST\n\nYou're the Nibbler. You're the reason I got into this.\n\nDUSTIN\n\nYou got into this because you had nothing left.\n\nGHOST\n\nI had nothing left, and then I read about a detective who followed a trail of pistachio shells for two miles and closed the Hartley case. Everyone has a reason. You're mine.\n\n(beat)\n\nBesides. We have all this gear. Might as well give it a spin.\n\nDustin looks down at the duffel of surveillance equipment at the Ghost's feet. Then out at the street. Somewhere out there, the water. The docks.\n\nHe nods.\n\nDUSTIN\n\n(V.O.)\n\nThat's the thing about a partner. On the days you don't believe your own legend, they believe it for you. It's an inefficient system. It works.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 9: Boatyard Surveillance\n\n*EPISODE 1 — The Trail | ID: e1-boatyard-surveillance | File: e1_09_boatyard_surveillance.md*\n\n---\n\n<!-- summary: Night surveillance at the boatyard; a scrambled signal resolves into two words — MAYOR GRAND BALLROOM. -->\n\nEXT. BOATYARD - NIGHT\n\nDark water. Masts creak. Halyards ting against aluminum in the wind. Dustin and the Ghost are wedged into a corner between two dry-docked hulls, surrounded by the Ghost's equipment: the scanner, the monitor, a thermos.\n\nThe rig hums. Nothing happens. It is the kind of stakeout where nothing has been happening for hours.\n\nDUSTIN\n\n(adjusting the camera a quarter-inch)\n\nAlright, Ghost. Let's hope this leads us to the Weevil.\n\nGHOST\n\nTrust your instincts. You're the Nibbler.\n\nDUSTIN\n\nYou can't just say that every time.\n\nGHOST\n\nIt works every time.\n\nDustin pours coffee from the thermos. On the monitor: gray boats, gray water, gray night.\n\nThen — the scanner CHIRPS.\n\nA waveform jumps across the screen. Pulses. Rhythmic. Deliberate. Not harbor traffic.\n\nDUSTIN\n\n(sitting up)\n\nThat's it. That's a message, Ghost. Somebody's transmitting from inside the yard.\n\nGHOST\n\nScrambled.\n\nDUSTIN\n\nCan you unscramble it?\n\nThe Ghost produces a small device from his coat and connects it to the rig with the serenity of a man plugging in a toaster. Taps the screen. Taps it again.\n\nThe waveform shudders — resolves — and the monitor goes black.\n\nThen, in clean white letters, two words:\n\nMAYOR GRAND BALLROOM\n\nNeither man moves. The masts creak. The water laps.\n\nGHOST\n\nThe gala. City Hall. Friday.\n\nDUSTIN\n\nEvery suit in New Haven under one roof, and the Weevil just circled the date.\n\nThey look at each other in the glow of the monitor.\n\nDUSTIN\n\nI've got an idea.\n\nGHOST\n\nI was afraid of that.\n\nFADE OUT.\n\nEND OF EPISODE 1.\n\n\n---\n\n\n## EPISODE 2 — The Party\n\n---\n\n\n### Scene 10: Find Lucy\n\n*EPISODE 2 — The Party | ID: e2-find-lucy | File: e2_01_find_lucy.md*\n\n---\n\n<!-- summary: Dustin and the Ghost need a way inside the Mayor's gala; they head for the seaside pub to find Lucy. -->\n\nINT. DUSTIN'S OFFICE - POLICE STATION - DAY\n\nThe corkboard again. A new item pinned dead center: an engraved INVITATION — \"THE CITY OF NEW HAVEN CORDIALLY INVITES YOU — MAYORAL GALA — GRAND BALLROOM, CITY HALL.\" It is a photograph of an invitation. They do not have one.\n\nDUSTIN\n\n(V.O.)\n\nThe gala. Friday night. Four hundred guests, a guest list with a waiting list, and security that actually checks. The Weevil had a way in. We didn't.\n\nThe Ghost studies the photo.\n\nGHOST\n\nI can get us blueprints.\n\nDUSTIN\n\nBlueprints don't pour champagne. We need the service side. Staff rotations, catering contacts, which back doors get propped open when the kitchen overheats. We need somebody who's worked a hundred of these and knows where a room keeps its secrets.\n\nGHOST\n\nYou know somebody.\n\nDUSTIN\n\nI know somebody.\n\nThe Ghost waits.\n\nDUSTIN\n\nShe's not going to be excited to see me.\n\nGHOST\n\nThey rarely are.\n\nEXT. NEW HAVEN WATERFRONT - DUSK\n\nDustin and the Ghost walk the harbor road, coats snapping in the wind. Ahead, at the end of a pier: a low pub with steamed windows and light spilling out. Even from here, the sound of singing.\n\nDUSTIN\n\n(V.O.)\n\nLucy. Sharpest pair of eyes in the New Haven service industry. She's worked every ballroom, back kitchen, and cocktail hour in this city. People say things around waitresses they'd never say around cops. Lucy remembers all of it.\n\nGHOST\n\nWhat's the singing?\n\nDUSTIN\n\nShanties. It's shanty night.\n\nGHOST\n\n(beat)\n\nThere's a shanty night?\n\nDUSTIN\n\nEvery Thursday. Try to blend in.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 11: Seaside Pub\n\n*EPISODE 2 — The Party | ID: e2-seaside-pub | File: e2_02_seaside_pub.md*\n\n---\n\n<!-- summary: At the seaside pub, over sea shanties, Dustin and the Ghost recruit Lucy; she cuts through the speech and joins the team. -->\n\nINT. SEASIDE PUB - NIGHT\n\nChaos, but warm chaos. A crew of SAILORS pounds the tables through a sea shanty. Glasses slosh. Somebody has a concertina and, worse, knows how to use it.\n\nBehind the bar, working the taps through all of it, completely unbothered: LUCY, 30s. She pours four beers with one hand and cuts off a drunk with the other, without breaking rhythm.\n\nDustin and the Ghost push through the crowd. The Ghost looks around the room like it might need to be defused.\n\nDUSTIN\n\n(shouting over the shanty)\n\nLucy!\n\nLucy clocks him. Her expression does not change one degree.\n\nLUCY\n\n(to the other bartender)\n\nCover me. The law's here and it wants something.\n\nINT. SEASIDE PUB - CORNER BOOTH - CONTINUOUS\n\nA booth away from the noise, but not away enough. The shanty rolls on behind them. Lucy sits across from Dustin and the Ghost, arms folded.\n\nLUCY\n\nYou've got until the end of this song.\n\nDUSTIN\n\nThe Mayor's gala. Friday. We need in — quiet, through the service side. Someone hit the boatyard signal traffic and City Hall is the target. We think something's going to happen in that ballroom, and we think nobody in that ballroom knows it.\n\nLUCY\n\n(to the Ghost)\n\nWho's this?\n\nGHOST\n\nThe Ghost.\n\nLUCY\n\nOf course you are.\n\nDUSTIN\n\nLucy — you've worked the Grand Ballroom. You know the catering captains. You know the rotations. You could put us inside without a single suit noticing.\n\nLUCY\n\n(flat)\n\nYou want me to smuggle two grown detectives into the biggest event of the year, past City Hall security, during whatever it is you think is going to happen.\n\nDUSTIN\n\nYes.\n\nLucy looks at them both. The shanty behind them hits its final chorus.\n\nLUCY\n\nAlright. Enough of that. What do I have to do?\n\nDustin blinks — he had a speech prepared. He hesitates.\n\nDUSTIN\n\nLucy, I have to be straight with you. This could get dangerous. I can't ask you to—\n\nLUCY\n\n(hand on his arm)\n\nDustin. I've worked ten years of these parties. I've seen the shady dealings behind every closed door in this city — I just never had anybody worth telling. This is my chance to make a difference. Trust me. I can handle it.\n\nA beat. The Ghost nods once — which, from the Ghost, is a standing ovation.\n\nGHOST\n\nFriday, then.\n\nLUCY\n\nFriday. You two are dishwashers.\n\nDUSTIN\n\nDishwashers?\n\nLUCY\n\nYou wanted invisible. Nobody in the history of City Hall has ever looked at a dishwasher.\n\nThe three of them clasp hands over the table — a small, absurd, entirely sincere ceremony. Behind them the sailors hit the last note and the pub roars.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 12: City Hall Gala\n\n*EPISODE 2 — The Party | ID: e2-city-hall-gala | File: e2_03_city_hall_gala.md*\n\n---\n\n<!-- summary: The night of the gala — Lucy plants Dustin inside, the Ghost watches the feeds, Mayor Anderson takes the stage, and Gael moves through the room toward backstage. -->\n\nINT. CITY HALL - GRAND BALLROOM - NIGHT\n\nChandeliers. Banners with the Mayor's name. Four hundred of New Haven's finest suits drinking champagne under a ceiling that cost more than a school.\n\nMAYOR ANDERSON, 60s, silver-haired, charismatic in the way of a man who has been forgiven often, works the room toward the stage.\n\nAt the service door, in a white catering jacket, carrying a tray of empty glasses with visible discomfort: DUSTIN. Lucy passes him, balancing three trays effortlessly.\n\nLUCY\n\n(under her breath)\n\nStop scanning the room like a detective. Scan it like a dishwasher.\n\nDUSTIN\n\nHow does a dishwasher scan a room?\n\nLUCY\n\nHe doesn't. That's the point.\n\nShe flows on into the crowd.\n\nINT. DETECTIVE OFFICE - NIGHT\n\nDark bullpen. The Ghost sits alone before a bank of monitors — the ballroom feeds, the corridors, the loading dock. A radio at his lips.\n\nGHOST\n\n(into radio)\n\nTwo feeds on the ballroom, one on the dock. You're covered.\n\nINT. CITY HALL - GRAND BALLROOM - CONTINUOUS\n\nThe lights dim. A spotlight finds the podium. Applause as MAYOR ANDERSON takes the stage.\n\nMAYOR ANDERSON\n\nLadies and gentlemen — thank you. We gather tonight to celebrate the progress this city has made...\n\nThe speech rolls on, polished and empty. The crowd applauds on schedule.\n\nAnd through the crowd — against its grain, smooth as water finding a drain — moves A MAN IN A SUIT. Not flashy. Quality that doesn't announce itself. Clean shoes. He carries a champagne flute he never drinks from.\n\nGAEL. Though no one in this room knows the name.\n\nHe passes a KNOT OF GUESTS and they part for him without noticing they did it. He nods at a security guard; the guard nods back for no reason the guard could explain.\n\nINT. BACKSTAGE - CITY HALL - CONTINUOUS\n\nCables, road cases, a lighting board. A TECHNICIAN in headphones watches the stage feed.\n\nGael appears beside him — simply there, like he'd always been.\n\nGAEL\n\n(quietly)\n\nThe screens. When I signal.\n\nHe places something in the technician's hand. We don't see what. The technician looks at it, looks at Gael, and nods obediently.\n\nGael turns to the stage feed. On the little monitor, the Mayor beams at his city.\n\nGael checks his watch. Unhurried.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 13: The Screens Go Live\n\n*EPISODE 2 — The Party | ID: e2-screens-go-live | File: e2_04_screens_go_live.md*\n\n---\n\n<!-- summary: The ballroom screens go live with secret footage of the Mayor; Gael steps out, composed, and delivers the Weevil's message. -->\n\nINT. CITY HALL - GRAND BALLROOM - NIGHT\n\nMayor Anderson, mid-sentence at the podium—\n\nMAYOR ANDERSON\n\n—because this city's best days are not behind it, they are—\n\nThe sound system CRACKLES. The two giant SCREENS flanking the stage flicker.\n\nAnd go live.\n\nGRAINY FOOTAGE fills them: Mayor Anderson in a private room, accepting an envelope. Another angle, another night: a handshake with a man the papers would recognize. A hotel bar. Cash on a table. Timestamps in the corner like little verdicts.\n\nThe ballroom goes silent — that specific silence of four hundred people simultaneously deciding not to be the one who gasps.\n\nMAYOR ANDERSON\n\n(gripping the podium)\n\nNo — this is — this is a setup. I would never—\n\nThe footage keeps rolling. Somewhere a champagne glass breaks.\n\nAnd then GAEL walks onto the stage.\n\nComposed. Almost serene. He does not take the podium — he stands beside it, hands loose at his sides, and waits until the room's attention arrives on its own.\n\nGAEL\n\nLadies and gentlemen. It seems your Mayor's true nature has been exposed.\n\n(a beat, gently)\n\nThe Weevil sends his regards. He asks you to remember, in the days ahead — none of this footage was taken by us. It was only found. Your city filmed itself.\n\nHe surveys the room the way a man checks work he is satisfied with — the frozen guests, the stammering Mayor, the security detail moving too late toward the stage.\n\nThe ballroom ERUPTS — shouts, camera flashes, chairs scraping, a hundred phones rising like periscopes.\n\nSecurity reaches the stage. Gael is no longer on it.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 14: Dustin Sees Gael\n\n*EPISODE 2 — The Party | ID: e2-dustin-sees-gael | File: e2_05_dustin_sees_gael.md*\n\n---\n\n<!-- summary: In the chaos, Dustin sees Gael's face clearly across the ballroom — and freezes, because he knows him. -->\n\nINT. CITY HALL - GRAND BALLROOM - CONTINUOUS\n\nChaos in full flower. Guests surge toward the exits. Security wades against the current. Lucy shepherds a cluster of panicking caterers toward the kitchen.\n\nDustin fights through the crowd toward the stage, tray long gone, catering jacket half off—\n\n—and stops.\n\nAcross the ballroom, at the mouth of a service corridor, moving against the crowd with no more urgency than a man leaving a dull party: the man in the suit.\n\nFor one clean second the crowd opens between them. Full light. Full face.\n\nGAEL.\n\nDustin freezes. Completely. A rock in a river of fleeing tuxedos.\n\nDUSTIN\n\n(V.O.)\n\n(very quiet)\n\nThere he was.\n\nGael does not stop. But his eyes find Dustin's across the whole width of the room — the same half-second as the shipyard, going both directions.\n\nAnd then, barely, almost kindly: Gael inclines his head. A greeting. Unmistakable. Meant for one person.\n\nHe turns into the corridor and is gone.\n\nDUSTIN\n\n(V.O.)\n\nAnd I knew him. I had always known him.\n\nLUCY\n\n(arriving, breathless)\n\nDustin — the stage — did you see him? Did you get a look at his face?\n\nDustin doesn't answer. He is still looking at the empty corridor.\n\nLUCY\n\nDustin.\n\nDUSTIN\n\n(coming back)\n\nYeah. I got a look.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 15: Detective Office — Reaction\n\n*EPISODE 2 — The Party | ID: e2-detective-office-reaction | File: e2_06_detective_office_reaction.md*\n\n---\n\n<!-- summary: The team regroups at the detective office; Lucy names the Weevil's true motive — humiliation, not robbery; Dustin is already standing. -->\n\nINT. DETECTIVE OFFICE - NIGHT\n\nThe monitor bank replays the ballroom footage on a loop: the screens going live, the Mayor stammering, the man in the suit beside the podium.\n\nDustin, the Ghost, and Lucy — Dustin and Lucy still half in catering whites. The Ghost freezes the frame on the man in the suit.\n\nGHOST\n\nNo mask. No costume. He showed four hundred people his face.\n\nLUCY\n\nBecause his face isn't in anything. I'd bet my tips on it. No record, no file, no name in any system you can reach with a badge.\n\nShe leans toward the screen, reading the frozen frame like a difficult customer.\n\nLUCY\n\nLook at the room. He owned it before he walked on stage. The footage, the timing, the screens — weeks of work. You don't do weeks of work to steal from a coat check.\n\n(turning to them)\n\nThis was never about the robberies. The robberies were rehearsal. He wants to humiliate the Mayor — take him apart in public, in front of everyone who ever shook his hand.\n\nGHOST\n\n\"The Weevil sends his regards.\"\n\nLUCY\n\nRight. So he's not the Weevil. He's the delivery.\n\nThe Ghost looks at Dustin — who has been silent this whole time, staring at the frozen frame.\n\nGHOST\n\nYou're quiet.\n\nDUSTIN\n\nI'm thinking.\n\nGHOST\n\nYou're standing.\n\nDustin is, in fact, already standing, coat half on.\n\nDUSTIN\n\nThe Mayor's about to be the most radioactive man in Connecticut. Every friend he has is deleting his number right now. Which makes tonight the one night he'll talk to people like us.\n\nLUCY\n\nPeople like us being?\n\nDUSTIN\n\nThe only ones still in the building.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 16: Backstage With the Mayor\n\n*EPISODE 2 — The Party | ID: e2-backstage-mayor | File: e2_07_backstage_mayor.md*\n\n---\n\n<!-- summary: Backstage, the shaken Mayor accepts the team's help — then tells Dustin there's one more thing, and asks him to come to his office. -->\n\nINT. CITY HALL - BACKSTAGE - NIGHT\n\nThe party is a crime scene now. Overturned chairs through the doorway, abandoned champagne, someone's single shoe. Backstage, among the road cases, MAYOR ANDERSON sits alone on a folding chair — tie undone, face gray. A man watching thirty years of handshakes catch fire.\n\nDustin, the Ghost, and Lucy approach. The Mayor's security detail moves to block; the Mayor waves them off with a tired hand.\n\nMAYOR ANDERSON\n\nDetectives. Come to arrest me? You'd have to take a number.\n\nDUSTIN\n\nWe're not here for that, Mayor.\n\nLUCY\n\nYou were set up. The footage was cut to bleed — real pieces arranged into the worst possible shape. Whoever built that reel spent weeks on it. This wasn't news. It was a production.\n\nMAYOR ANDERSON\n\n(a hollow laugh)\n\nA production. Yes. He always did like a production.\n\nThe word \"he\" sits there. Dustin catches it. Files it.\n\nDUSTIN\n\nThe man on the stage. You saw him?\n\nMAYOR ANDERSON\n\nI saw him.\n\nDUSTIN\n\nDo you know him?\n\nA pause that is one beat too long.\n\nMAYOR ANDERSON\n\nNo.\n\nThe Mayor looks up at Dustin then — really looks, searching his face for something. Whatever he finds, it decides him.\n\nMAYOR ANDERSON\n\nI've always trusted your team, Detective. Even when the department didn't. Especially then. And now I need you more than ever.\n\nDUSTIN\n\nWe'll find who did this.\n\nMAYOR ANDERSON\n\nI know you will. That's rather what I'm afraid of.\n\nHe stands, straightens his ruined tie out of pure muscle memory.\n\nMAYOR ANDERSON\n\nDustin. There's one more thing. Not here.\n\n(beat)\n\nCome to my office.\n\nHe walks off between the road cases, security falling in around him. The team watches him go.\n\nLUCY\n\nWhat's in his office?\n\nDUSTIN\n\n(V.O.)\n\nI didn't know yet. But I knew the sound of a man about to stop lying. It's quieter than you'd think.\n\nFADE OUT.\n\nEND OF EPISODE 2.\n\n\n---\n\n\n## EPISODE 3 — Blood and Weevils\n\n---\n\n\n### Scene 17: Mayor's Office — Revelation\n\n*EPISODE 3 — Blood and Weevils | ID: e3-mayors-office-revelation | File: e3_01_mayors_office_revelation.md*\n\n---\n\n<!-- summary: The Mayor tells Dustin the truth — the Weevil is his brother, Mark Anderson; the man on stage, Gael, runs Mark's operation. -->\n\nINT. CITY HALL - MAYOR'S OFFICE - DAY\n\nQuiet. Dark wood. Framed photographs of ribbon-cuttings and handshakes — a wall of achievements that reads, this morning, like a wall of evidence.\n\nDustin sits across the desk from Mayor Anderson. Between them, a bottle of good scotch, unopened. The Mayor has clearly considered it.\n\nMAYOR ANDERSON\n\nDustin. I need to tell you the truth about the Weevil.\n\nDUSTIN\n\nI'm listening.\n\nMAYOR ANDERSON\n\nHe's my brother. Mark. Mark Anderson.\n\nSilence. Dustin absorbs this without moving. Behind his eyes, red string reconnecting.\n\nMAYOR ANDERSON\n\nHe was always the smarter one. I was just the one people liked. You know what that does to a family — one boy gets the handshakes, the other gets the report cards, and everybody pretends it evens out.\n\nHe rises, moves to the window. The Green below, the city going about its morning.\n\nMAYOR ANDERSON\n\nMark struggled. His mind — it went to dark rooms and stayed there. When it got bad enough, the family sent him to a facility in Maine. We told ourselves it was for his own good. We told ourselves that for eleven years.\n\nDUSTIN\n\nHe got out.\n\nMAYOR ANDERSON\n\nHe walked out. Took the family fortune with him — every account, cleaned with a patience that should have warned us. And then he built something. A following. Cash only, loyalty only. People with real grievances, and God knows this city manufactures those. He tells them he'll tear New Haven down and build it honest. He calls it a new city. They believe him.\n\nDUSTIN\n\nAnd the man on your stage last night? That's not Mark.\n\nMAYOR ANDERSON\n\nNo. Mark doesn't step into rooms. Mark is the architect — you'll never see him holding the pen.\n\n(turning from the window)\n\nThe man on the stage runs Mark's operation on the ground. Every job, every crew, every one of those little figurines. My people got one photograph and no name. He's a ghost.\n\nDUSTIN\n\nWe have one of those too.\n\nThe Mayor doesn't hear it. His voice breaks — quietly, the way it does in men who are practiced at not letting it.\n\nMAYOR ANDERSON\n\nI failed him, Dustin. Whatever he's become, it started the day we put him in a car to Maine and I waved. I failed as a brother.\n\nDustin is quiet for a long moment. Then:\n\nDUSTIN\n\nMayor. What's done is done. What's now — is now.\n\nThe Mayor looks at him. It is not absolution, but it is something a man can stand on.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 18: Dustin Hints at the Past\n\n*EPISODE 3 — Blood and Weevils | ID: e3-dustin-hints-history | File: e3_02_dustin_hints_history.md*\n\n---\n\n<!-- summary: Dustin admits, almost to himself, that he knew someone connected to Mark a long time ago — and refuses to explain. -->\n\nINT. CITY HALL - MAYOR'S OFFICE - CONTINUOUS\n\nThe Mayor pours two glasses of the scotch after all. Slides one across. Dustin doesn't touch it.\n\nMAYOR ANDERSON\n\nYou understand what I'm asking you to carry. If it gets out that the Weevil is an Anderson—\n\nDUSTIN\n\nIt won't get out from me.\n\nMAYOR ANDERSON\n\nWhy do I believe you?\n\nDUSTIN\n\nBecause I'm the only man in this city with less to gain from talking than you.\n\nThe Mayor almost smiles. He drinks. Dustin looks past him, at the wall of photographs — and something in his face changes. The detective going somewhere else.\n\nDUSTIN\n\n(almost to himself)\n\nI knew someone connected to Mark. A long time ago. Before any of this.\n\nThe Mayor lowers his glass.\n\nMAYOR ANDERSON\n\nConnected how?\n\nDustin doesn't answer.\n\nMAYOR ANDERSON\n\nDustin. Connected how?\n\nDUSTIN\n\n(standing)\n\nIt was a long time ago.\n\nHe buttons his coat. The subject is closed — visibly, deliberately, with the finality of a man locking a door from the inside.\n\nThe Mayor searches his face the way he did backstage. This time he finds the locked door, and he is politician enough to know one when he sees it.\n\nMAYOR ANDERSON\n\nWe all have our Maines, Detective.\n\nDUSTIN\n\n(V.O.)\n\nHe was right. And mine didn't have a facility or a family fortune. Mine had a name I hadn't said out loud in years — and I wasn't going to start in the Mayor's office.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 19: The Alliance Forms\n\n*EPISODE 3 — Blood and Weevils | ID: e3-alliance-forms | File: e3_03_alliance_forms.md*\n\n---\n\n<!-- summary: The Mayor, Dustin, the Ghost, and Lucy form a working alliance to take down the Weevil's network. -->\n\nINT. CITY HALL - MAYOR'S OFFICE - LATER\n\nThe office, fuller now: Dustin, the Ghost by the window where he can see the door, Lucy in the good chair because she took it first.\n\nMAYOR ANDERSON\n\nWhat I'm proposing is simple. A team. Off the books until it can't be — my resources, your skills. Everything Mark's network touches: the robberies, the blackmail, the intimidation on the waterfront, the people he's swallowed. We take it apart, piece by piece.\n\nHe looks around the room.\n\nMAYOR ANDERSON\n\nI can't use the department. Half of them want my job and the other half think I'm guilty. What I have is the four people in this room.\n\nLUCY\n\nThree of whom aren't getting paid.\n\nMAYOR ANDERSON\n\nThat can be discussed.\n\nLUCY\n\nGood. Because I quit shanty night for this.\n\nGHOST\n\nWhat's our exposure? When this goes wrong — and it will go wrong — who takes the fall?\n\nMAYOR ANDERSON\n\nI do. That's the arrangement, and I'll put it in writing. I'm done letting other people carry what's mine.\n\nThe Ghost studies him a moment. Then gives his single nod.\n\nThe Mayor turns to Dustin.\n\nMAYOR ANDERSON\n\nDetective? It's your call. It was always going to be your call.\n\nDUSTIN\n\nI'm in.\n\nHe said it before the Mayor finished the sentence. Everyone notices.\n\nDUSTIN\n\n(V.O.)\n\nFifteen years I'd worked this city alone — one man, one magnifying glass, one bar that poured before I asked. Now I had a crew. A ghost, a bartender, and the most hated man in New Haven.\n\n(beat)\n\nIn this town, that's practically an army.\n\nThe Ghost unrolls a chart on the desk: the boatyard, marked in grease pencil.\n\nGHOST\n\nSignal traffic spiked again last night. Same source. The boatyard.\n\nDUSTIN\n\nThen that's where we start.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 20: Boatyard Trap\n\n*EPISODE 3 — Blood and Weevils | ID: e3-boatyard-trap | File: e3_04_boatyard_trap.md*\n\n---\n\n<!-- summary: The team moves through the night boatyard and walks into the Weevil's trap — henchmen in weevil costumes close a ring around them. -->\n\nEXT. BOATYARD - NIGHT\n\nSalt air. Creaking docks. The team moves between the dry-docked hulls in a loose diamond — Dustin on point, the Ghost drifting at the flank, Lucy and the Mayor in the middle. Flashlights low. The Mayor wears a bulletproof vest over a dress shirt, which is somehow worse than either alone.\n\nMAYOR ANDERSON\n\n(whispering)\n\nIs it always this quiet?\n\nLUCY\n\n(whispering)\n\nNo.\n\nThey round a hull into the open center of the yard. And stop.\n\nA wooden DESK stands in the middle of the gravel, lit by a work lamp. On the desk, arranged in a neat row facing them: FOUR WEEVIL FIGURINES.\n\nOne for each of them.\n\nDUSTIN\n\n(low)\n\nWe've walked right into a trap.\n\nGHOST\n\n(undaunted)\n\nStay focused. We can handle this.\n\nMovement. From behind the boats, out of the container shadows, from everywhere at once: HENCHMEN. A dozen of them, in matching WEEVIL COSTUMES — bulbous insect heads, segmented padding, each holding a baseball bat. The effect is absurd and, somehow, much worse for it. A ring closes around the team, unhurried, drilled.\n\nNobody speaks. The costumes make no sound. The lamp hums.\n\nLUCY\n\n(deadpan, terrified)\n\nOh good. There's a theme.\n\nAnd then the ring opens at the far side, and a man steps through it.\n\nNo costume. A suit. Clean shoes on filthy gravel.\n\nGAEL.\n\nHe stops beside the desk, in the lamplight, and looks at them each in turn — the Mayor, Lucy, the Ghost — and last, and longest, Dustin.\n\nHe looks at Dustin with something that isn't quite satisfaction and isn't quite regret.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 21: The Magnet / First-Name Moment\n\n*EPISODE 3 — Blood and Weevils | ID: e3-magnet-first-name | File: e3_05_magnet_first_name.md*\n\n---\n\n<!-- summary: Gael triggers the magnet, disarming the team — and calls Dustin by his first name in front of everyone. The Ghost notices. -->\n\nEXT. BOATYARD - CONTINUOUS\n\nGael reaches into his jacket and takes out a small DEVICE — matte, no lights, the size of a cigarette case. He handles it like a light switch.\n\nHe presses it.\n\nA deep electromagnetic THUMP. Every gun in the team's possession WRENCHES free — Dustin's pistol, the Ghost's sidearm, the Mayor's borrowed revolver — and streaks through the air to SLAM against a rusted crane column behind Gael. Lucy's earrings tug toward it hopefully. The guns hang on the steel, pinned, quivering.\n\nLUCY\n\nOur guns! He's—\n\n(recalibrating)\n\n—okay. Yes. Clearly.\n\nMAYOR ANDERSON\n\nWe may have lost our weapons. But we still have each other.\n\nLUCY\n\n(staring at him)\n\nWho talks like that?\n\nGael pockets the device. It was not a dramatic gesture. It was housekeeping.\n\nGAEL\n\n(to the Mayor, courteous)\n\nMister Mayor. He watches your press conferences. He wants you to know that.\n\nThe Mayor goes pale. Gael turns, finally, fully, to Dustin. The yard is silent. Twelve weevil masks watching, blank as dinner plates.\n\nGAEL\n\nYou should have stayed out of this, Dustin.\n\nNot Detective. Not Meglio. Not Nibbler.\n\nDustin. First name. Steady. Unhurried. Like he has been waiting a long time to say it out loud, and saying it no longer feels like anything at all.\n\nThe Ghost's head turns — a slow, precise degree — from Gael to Dustin.\n\nDustin doesn't look back at him. Doesn't look at anyone but Gael.\n\nDUSTIN\n\n(quietly)\n\nYou know I couldn't.\n\nGAEL\n\n(a breath; almost a smile)\n\nYes. I know.\n\nGael lifts two fingers. The ring of weevils raises its bats in one motion.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 22: The Fight\n\n*EPISODE 3 — Blood and Weevils | ID: e3-fight | File: e3_06_fight.md*\n\n---\n\n<!-- summary: The team fights the weevil henchmen as a unit for the first time; Gael slips away, unhurried, gone. -->\n\nEXT. BOATYARD - CONTINUOUS\n\nThe ring collapses inward and the fight begins.\n\nIt is not graceful. It is a real fight in a real boatyard — grabbed collars, swung bats, gravel. But something happens in it: the team works.\n\nThe Ghost moves like his name — never where the bat lands, guiding henchmen into each other with small economical redirections. He puts one into a stack of lobster traps.\n\nLucy fights like ten years of last call — a serving tray from the desk becomes a shield, then an argument-ender. A henchman goes down rubbing his bulbous mask.\n\nThe Mayor, to everyone's surprise including his own, tackles a henchman into a rack of oars. Buried in weevil, he throws punches with thirty years of suppressed press conferences behind them.\n\nDustin puts one henchman down, spins, drops under a bat—\n\n—and comes up looking at Gael.\n\nGael has not moved. He stands outside the brawl, watching it the way a man watches rain — and watching Dustin most of all. Cataloguing. Almost fond.\n\nDustin starts toward him. A henchman intercepts; Dustin fights through him, shoves clear—\n\nGael is farther away. He hasn't run. He is simply, somehow, always farther away — through a gap between containers that was not visible until he used it. No scrambling. No panic. The exit of a man who planned it before he arrived.\n\nAt the gap, he pauses. Looks back at Dustin across the chaos. Then he is gone.\n\nDUSTIN\n\n(hoarse)\n\nHe slipped away again!\n\nGHOST\n\n(putting down the last henchman)\n\nWe'll get him next time.\n\nThe remaining henchmen break and retreat toward the dock exit — and as they go, they drag with them THREE BOUND CIVILIANS, hooded, stumbling. Hostages.\n\nThe team freezes.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 23: Hostages\n\n*EPISODE 3 — Blood and Weevils | ID: e3-hostages | File: e3_07_hostages.md*\n\n---\n\n<!-- summary: The team pivots from pursuit to rescue and frees the hostages; the henchmen scatter into the night. -->\n\nEXT. BOATYARD - DOCKS - CONTINUOUS\n\nThe henchmen haul the hostages down the long dock toward a waiting boat, the whole procession absurd and terrible in the moonlight — giant weevils dragging hooded prisoners past sleeping sailboats.\n\nLUCY\n\nWe can't let them get away with innocent lives!\n\nDUSTIN\n\nWe won't. Hostages first. The Weevil can wait.\n\nThey run. The Ghost cuts left, vanishing between boat cradles — gone, the way he goes.\n\nON THE DOCK: the lead henchman hears footsteps, turns—\n\n—and the Ghost is already in front of him, having arrived from nowhere and, apparently, earlier. The henchman freezes mid-step, bat raised.\n\nGHOST\n\nPut it down. You look ridiculous.\n\nThe henchman looks down at his own segmented costume. Some deep truth lands on him. He puts the bat down.\n\nThe others don't. Dustin and Lucy hit the dock at a run — Dustin low-tackles one henchman off the edge into the water. Lucy hooks a boat gaff into another's costume padding and swings him, with great force and impressive leverage, into a piling.\n\nThe Mayor, wheezing far behind:\n\nMAYOR ANDERSON\n\n(shouting)\n\nI am ORDERING you to surrender! I'm still technically the Mayor!\n\nRemarkably, one henchman hesitates — long enough for the Ghost to relieve him of consciousness.\n\nDustin cuts the hostages free — a DOCKWORKER, a NIGHT WATCHMAN, a TEENAGER who was fishing in the wrong place. The remaining henchmen abandon the boat and scatter into the dark, shedding costume parts as they run — a bulbous insect head bobbing away between the hulls, then nothing.\n\nLucy pulls the hood off the last hostage. Checks him with bartender efficiency.\n\nLUCY\n\nYou're okay. Breathe. You're okay.\n\nDustin stands at the end of the dock, looking out at the black water. No boat. No suit. No Gael.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 24: Aftermath\n\n*EPISODE 3 — Blood and Weevils | ID: e3-aftermath | File: e3_08_aftermath.md*\n\n---\n\n<!-- summary: The quiet boatyard after — hostages safe, Gael gone; the Ghost says what he noticed: \"He called you by your first name.\" -->\n\nEXT. BOATYARD - LATER\n\nQuiet again. Ambulance lights at the gate, distant. The hostages wrapped in blankets. Two henchmen zip-tied to the crane column, next to the guns still magnetized to it — someone will have to figure that out.\n\nThe team stands together in the gravel, catching their breath. The Mayor looks out at the dark water.\n\nMAYOR ANDERSON\n\nWe may not have captured him tonight. But we saved innocent lives.\n\n(beat)\n\nOur fight continues.\n\nLUCY\n\n(exhausted)\n\nYou really do talk like that.\n\nMAYOR ANDERSON\n\nThirty years of ribbon-cuttings. It gets in the blood.\n\nLucy walks the desk in the center of the yard. The four figurines still sit in their neat row. She picks one up, turns it in the light.\n\nLUCY\n\nFour of them. He knew exactly who was coming.\n\nShe sets it back down — then notices Dustin isn't listening. He is looking at the gap between the containers where Gael vanished.\n\nThe Ghost appears at Dustin's shoulder, quiet as ever.\n\nGHOST\n\nHe called you by your first name.\n\nDustin doesn't answer.\n\nGHOST\n\nIn front of everyone. Like it was normal.\n\nDustin doesn't answer.\n\nThe Ghost studies his partner's profile a moment longer. Then he nods — not agreement, just a receipt. The question has been filed. It will be asked again.\n\nGHOST\n\nOkay.\n\nHe walks off toward the ambulances. Dustin stays, looking at the gap in the containers, alone in the lamplight with a desk full of figurines.\n\nFADE OUT.\n\n\n---\n\n\n### Scene 25: Final Handshake / Dustin Alone\n\n*EPISODE 3 — Blood and Weevils | ID: e3-final-handshake | File: e3_09_final_handshake.md*\n\n---\n\n<!-- summary: The alliance is sealed with a handshake in the Mayor's office; Dustin walks out alone, and the closing voiceover carries the series' open wound — Gael knows his name. -->\n\nINT. CITY HALL - MAYOR'S OFFICE - DAY\n\nDaylight, for once. The team assembled — the Ghost by the window, Lucy in the good chair, Dustin standing. On the Mayor's desk, in an evidence bag: one weevil figurine.\n\nMAYOR ANDERSON\n\nThe press will spend a month on the gala. The department will spend a year on the boatyard. Mark is counting on both. Which means the four of us are the only people in New Haven working on what actually matters.\n\nHe comes around the desk and extends his hand to Dustin.\n\nMAYOR ANDERSON\n\nTogether, we'll be unstoppable.\n\nDustin takes it. The handshake is firm, formal, a little ridiculous, and entirely sincere — which is, by now, the house style.\n\nLucy shakes next. Then the Ghost, who shakes hands like he's returning something.\n\nLUCY\n\nSo what do we call it? A team needs a name.\n\nGHOST\n\nNo it doesn't.\n\nLUCY\n\nIt absolutely does.\n\nThey file out, arguing quietly. Dustin lingers a moment — one last look at the figurine on the desk — then follows.\n\nEXT. CITY HALL - DAY\n\nDustin comes down the steps alone, onto the street. New Haven going about its business: buses, students, a man selling flowers, the ordinary city that has no idea.\n\nHe puts in a wad of chewing tobacco. Holds it. Spits it out.\n\nDUSTIN\n\n(V.O.)\n\nThe city still has shadows. Mark Anderson is still out there, building his new city inside the old one. And Gael is still out there too.\n\nHe walks. The camera holds on him, small against the block.\n\nDUSTIN\n\n(V.O.)\n\nHe called me by my name. That means he's been watching. That means whatever this is, it didn't start at the shipyard. It started long before that — and I'm the only one on the team who knows how long.\n\n(beat)\n\nI don't know what he wants from me yet. But I know this. The Nibbler has a crew now. And whatever Gael is building for the Weevil — we're going to find it before he finishes.\n\nHe stops at the corner. For a moment, in a shop window's reflection, he checks the street behind him.\n\nNothing. Just the city.\n\nHe keeps walking.\n\nFADE TO BLACK.\n\nEND OF EPISODE 3.\n\nEND OF SERIES ONE.\n\n\n---\n\n";
    const container = document.getElementById('scriptContent');
    marked.setOptions({ breaks: true });
    container.innerHTML = marked.parse(markdown);
    formatScreenplay(document.querySelector('.screenplay-container'));

    (function initScriptStatsAndProgress() {
      const WORDS_PER_PAGE = 250;
      const content = document.getElementById('scriptContent');
      const progressFill = document.getElementById('scriptProgressFill');
      const progressLabel = document.getElementById('scriptProgressLabel');
      const progressBar = document.querySelector('.script-progress-bar');
      if (!progressFill) return;
      const wordCount = (typeof markdown === 'string' ? markdown : (content && content.textContent) || '').split(/\s+/).filter(Boolean).length;
      const MIN_PAGES = 90;
      const rawPages = Math.round((wordCount / WORDS_PER_PAGE) * 10) / 10;
      const estimatedPages = Math.max(MIN_PAGES, rawPages);
      const estimatedMinutes = Math.max(MIN_PAGES, Math.round(estimatedPages));
      function updateProgress() {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        if (scrollHeight <= 0) {
          progressFill.style.width = '0%';
          progressLabel.textContent = 'Minute 0 of ' + estimatedMinutes;
          if (progressBar) progressBar.setAttribute('aria-valuenow', 0);
          return;
        }
        const pct = Math.min(1, Math.max(0, scrollTop / scrollHeight));
        const currentMinute = Math.min(estimatedMinutes, Math.floor(pct * estimatedMinutes));
        progressFill.style.width = (pct * 100) + '%';
        progressLabel.textContent = 'Minute ' + currentMinute + ' of ' + estimatedMinutes;
        if (progressBar) progressBar.setAttribute('aria-valuenow', Math.round(pct * 100));
      }
      updateProgress();
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
    })();

    (function initSceneNav() {
      const content = document.getElementById('scriptContent');
      const selectEl = document.getElementById('scriptSceneSelect');
      if (!content || !selectEl) return;
      const sceneHeadings = content.querySelectorAll('h3');
      const sceneHeadingRe = /^Scene \d+:/i;
      sceneHeadings.forEach((h3, i) => {
        const text = (h3.textContent || '').trim();
        if (sceneHeadingRe.test(text)) h3.id = 'scene-' + (i + 1);
      });
      selectEl.addEventListener('change', function() {
        const value = this.value;
        if (!value) return;
        const el = document.getElementById(value);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        this.value = '';
      });
    })();

    (function initStatusBar() {
      const content = document.getElementById('scriptContent');
      const sceneEl = document.getElementById('scriptStatusScene');
      const charsEl = document.getElementById('scriptStatusCharacters');
      const prodEl = document.getElementById('scriptStatusProduction');
      if (!content || !sceneEl) return;
      function getSceneHeadingsInOrder() {
        const h3s = content.querySelectorAll('h3[id^="scene-"]');
        return Array.from(h3s).sort((a, b) => {
          const nA = parseInt(a.id.replace('scene-', ''), 10);
          const nB = parseInt(b.id.replace('scene-', ''), 10);
          return nA - nB;
        });
      }
      function getSceneBlock(sceneH3, nextSceneH3) {
        const chars = new Set();
        let firstSlug = '';
        let node = sceneH3.nextSibling;
        while (node) {
          if (node === nextSceneH3) break;
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains('character-name')) {
              const name = (node.textContent || '').trim();
              if (name) chars.add(name);
            }
            if (!firstSlug && node.classList && node.classList.contains('scene-heading')) firstSlug = (node.textContent || '').trim();
          }
          node = node.nextSibling;
        }
        return { characters: Array.from(chars), production: firstSlug };
      }
      function updateStatusBar() {
        const sceneHeadings = getSceneHeadingsInOrder();
        if (sceneHeadings.length === 0) return;
        const viewportThreshold = 160;
        let current = sceneHeadings[0];
        for (let i = 0; i < sceneHeadings.length; i++) {
          const top = sceneHeadings[i].getBoundingClientRect().top;
          if (top <= viewportThreshold) current = sceneHeadings[i];
        }
        const title = (current.textContent || '').trim();
        const nextId = current.id.replace('scene-', '');
        const nextNum = parseInt(nextId, 10) + 1;
        const nextScene = document.getElementById('scene-' + nextNum);
        const block = getSceneBlock(current, nextScene || null);
        sceneEl.textContent = title || '—';
        charsEl.textContent = block.characters.length ? block.characters.join(', ') : '—';
        prodEl.textContent = block.production || '—';
      }
      updateStatusBar();
      window.addEventListener('scroll', updateStatusBar, { passive: true });
      window.addEventListener('resize', updateStatusBar);
    })();

    function formatScreenplay(container) {
      const content = container.querySelector('.screenplay-content');
      if (!content) return;
      function normalizeParagraphBreaks(content) {
        const paragraphs = Array.from(content.querySelectorAll('p'));
        paragraphs.forEach((p) => {
          if (!p.querySelector('br')) return;
          const parts = p.innerHTML.split(/<br\s*\/?\s*>/i).map((s) => s.replace(/&nbsp;/g, ' ').trim()).filter(Boolean);
          if (parts.length <= 1) return;
          const frag = document.createDocumentFragment();
          parts.forEach((html) => {
            const np = document.createElement('p');
            np.innerHTML = html;
            frag.appendChild(np);
          });
          p.replaceWith(frag);
        });
      }
      normalizeParagraphBreaks(content);
      const paragraphs = content.querySelectorAll('p');
      let inDialogueBlock = false;
      paragraphs.forEach((p, index) => {
        const text = p.textContent.trim();
        const nextP = paragraphs[index + 1];
        const prevP = paragraphs[index - 1];
        if (!text) return;
        if (p.classList.length > 0 && !p.classList.contains('line-split')) return;
        if (/^(INT\.|EXT\.)/i.test(text)) { p.className = 'scene-heading'; p.textContent = text.toUpperCase(); inDialogueBlock = false; return; }
        if (/^(FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text)) { p.className = 'transition'; p.textContent = text.toUpperCase(); inDialogueBlock = false; return; }
        if (/^\(.+\)$/.test(text)) { p.className = 'parenthetical'; inDialogueBlock = true; return; }
        const isAllCaps = /^[A-Z][A-Z\s\.'-]+$/.test(text) && text === text.toUpperCase();
        const isReasonableLength = text.length > 2 && text.length < 35;
        const isNotSceneHeading = !/^(INT\\.|EXT\\.|FADE|CUT|DISSOLVE)/i.test(text);
        if (isAllCaps && isReasonableLength && isNotSceneHeading) {
          const nextText = nextP ? nextP.textContent.trim() : '';
          const looksLikeDialogue = nextText && (/^\(.+\)$/.test(nextText) || (!/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(nextText) && !/^[A-Z][A-Z\s\.'-]+$/.test(nextText)));
          if (looksLikeDialogue || !prevP || prevP.classList.contains('action-line') || prevP.classList.contains('scene-heading')) {
            p.className = 'character-name';
            inDialogueBlock = true;
            return;
          }
        }
        const looksLikeNewBlock = /^(INT\.|EXT\.|FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text);
        const looksLikeCharacter = isAllCaps && isReasonableLength && isNotSceneHeading;
        if (!looksLikeNewBlock && inDialogueBlock && prevP && (prevP.classList.contains('character-name') || prevP.classList.contains('parenthetical') || prevP.classList.contains('dialogue'))) {
          p.className = 'dialogue';
          inDialogueBlock = true;
          return;
        }
        if (looksLikeCharacter || looksLikeNewBlock) inDialogueBlock = false;
        p.className = 'action-line';
        inDialogueBlock = false;
      });
      const ps = content.querySelectorAll('p');
      ps.forEach((p, i) => {
        if (!p.classList.contains('dialogue') && !p.classList.contains('parenthetical')) return;
        const next = ps[i + 1];
        if (!next || (!next.classList.contains('dialogue') && !next.classList.contains('parenthetical'))) {
          if (p.classList.contains('dialogue')) p.classList.add('dialogue-last');
          if (p.classList.contains('parenthetical')) p.classList.add('parenthetical-last');
        }
      });
    }
  </script>
