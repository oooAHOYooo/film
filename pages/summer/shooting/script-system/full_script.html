  <script>
    const markdown = "# Creatures in the Tall Grass Script — Full Script\n\n*Compiled on 6/9/2026, 2:50:32 PM*\n\n---\n\n\n## ACT I — Arrival & Discovery\n\n---\n\n\n### Scene 0A: Opening Montage\n\n*ACT I — Arrival & Discovery | ID: opening-montage | File: s00a.md*\n\n---\n\n<!-- scene: 0A file: s00a.md nickname: opening-montage -->\n\n## OPENING MONTAGE\n\nEXT. BRANFORD TRAIN STATION - EARLY MORNING (s00a.1)\n\nAn empty platform. The Long Island Sound visible beyond the station house — gray water, distant shoreline. A single train pulls away, its last car disappearing around the curve.\n\nDallas stands alone on the platform. Mid-30s, worn canvas jacket, a single suitcase beside him. Not lost. Displaced. He's been displaced a lot. He picks up the suitcase and walks toward the station exit without looking back.\n\nEXT. BRANFORD STREETS - CONTINUOUS (s00a.2)\n\nSalt air. Low houses with white trim and weathered fences. Dallas walks through the neighborhood, suitcase in hand. His eyes take in the scale of the place — smaller than he expected. Quieter.\n\nHe passes a street sign: Harbor View Lane.\n\nEXT. BRANFORD - MARSH FENCE - CONTINUOUS (s00a.3)\n\nWide shot. Dallas approaches the rental house from the far side of the property. The house is visible through a gap in the tall grass. He stops at the fence line. His eye catches on the tall reeds that mark the edge of the yard.\n\nSomething pulls his attention there. He doesn't know why yet.\n\n---\n\nINT. MARSH EDGE - CONTINUOUS (s00a.4)\n\nTight close-up. Fingers pressing a trail camera into the bark of a dead oak. The fingers are careful, deliberate. Practiced.\n\nPull back. MAKAYLA, 22, kneels at the base of the tree. Her eyes are focused on the camera placement. No wasted movement.\n\nASHER, 14, stands a few feet away with his hands on a boom pole. He is assembling it piece by piece. Each segment seats with a small click. His movements are methodical. He has done this a hundred times.\n\nINT. MARSH EDGE - LATER (s00a.5)\n\nMakayla's hand traces a pattern through the soft ground. She is outlining a perimeter for a small hole. Asher crouches nearby with a folding trowel — small, military-issue, designed for digging in tight spaces.\n\nHe hands it to her without being asked.\n\nShe begins to dig. The blade cuts into the marsh soil. Asher watches the tree line.\n\n---\n\nEXT. BRANFORD STREETS - CONTINUOUS (s00a.6)\n\nWide shot. Dallas walks through the residential streets. A parked car. A mailbox with the address he's been looking for. The house is getting closer.\n\nHe is not thinking about the house yet.\n\nINT. MARSH EDGE - CONTINUOUS (s00a.7)\n\nClose-up. Makayla's hands work a piece of equipment into the hole she has dug. It is small, circular, with a microphone array. An acoustic trap. She covers it with damp soil, then with a thin layer of leaf litter and moss, troweled so carefully that the ground looks undisturbed.\n\nShe sits back. Her hands are still.\n\nA beat.\n\nShe stops. Her hand hovers over the next piece of equipment. Her head tilts.\n\nShe is listening to something.\n\n---\n\nINT. MARSH EDGE - CONTINUOUS (s00a.8)\n\nAsher has frozen. His finger is mid-trace on his other palm. He is not looking at Makayla, but he knows she has stopped.\n\nA beat longer. He was listening first.\n\nThey look at each other.\n\nNo words. No names. No explanation.\n\nThey have heard it before. Their bodies remember the sound without needing to hear it again.\n\nIt is back.\n\n---\n\nEXT. RENTAL HOUSE - BACK YARD - CONTINUOUS (s00a.9)\n\nWide shot. Dallas has arrived. He stands at the far edge of the property, looking at the front of the house. Taking in the scale, the condition, the fact of it.\n\nHe sets down his suitcase.\n\nHis eye drifts to the tall grass at the edge of the property. The reeds that border the marsh. The line where the yard ends.\n\nSomething in the movement of the grass. Or the stillness of it.\n\nHe watches for a moment without moving.\n\nThen he picks up his suitcase again and walks toward the front door.\n\nEND SCENE 0a\n\n---\n\n\n### Scene 0B: Property Manager\n\n*ACT I — Arrival & Discovery | ID: property-manager | File: s00b.md*\n\n---\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\nINT. RENTAL HOUSE - FRONT DOOR - DAY (s00b.1)\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe front door opens inward. A small foyer with scuffed hardwood. To the left, a living room where cheap furniture sits pushed against the walls in no particular order. A futon frame without a mattress leans in a corner. Empty beer cans on the floor by the baseboard.\n\nThe PROPERTY MANAGER, early 40s, stands in the doorway, holding a clipboard and keys. He is already talking before Dallas has fully stepped inside.\n\nPROPERTY MANAGER\nOkay Branford rental unit #72 let's see what you got. Right, so— front door sticks a little in the winter, not enough to replace it. Heat works. Water works. Hot water takes, I don’t know, twenty seconds upstairs, thirty seconds down? Pressure’s good. Pipes are old but they work.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas enters.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager nods, moving before Dallas has entered fully. \n\nPROPERTY MANAGER\nKitchen’s through here. Stove runs a little hot, refrigerator’s electric, older unit, holds temperature. Dishwasher works but I wouldn’t load it like a restaurant. Sink goes hot cold - cold hot - you know the deal. Previous tenant all of that in the corner I asked him to take it out before you came. I apologize for that.\n\nINT. RENTAL HOUSE - KITCHEN / BACK WINDOW - CONTINUOUS (s00b.2)\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThey enter the kitchen. Dallas stops at a window that faces the backyard. Through the glass, tall reeds and grass. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager notices Dallas looking.\n\nPROPERTY MANAGER\nBackyard’s small but there’s grass. You can see it from here, but there’s no direct access from the kitchen. You have to go around and down.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nHe points toward a narrow back stairway.\n\nPROPERTY MANAGERDown and around. \n\nEXT. BACKYARD\n\nPROPERTY MANAGER\nCareful on the steps. They get slick when it rains.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager and Dallas walk through the backyard up to the porch that doesn't connect to the kitchen. They look out to the distance for a beat. \n\nPROPERTY MANAGER\nBranford’s got a little bit of everything. Water, woods, old houses. New Haven’s close when you need it... There’s water beyond the brush. Tidal stuff, mostly. Salt marsh, drainage, edge of the river, depends who’s asking. Egrets, herons, osprey. Herons sound terrible at night, but that’s normal. We get a couple of big storms in the season and we might have one on the way - but I think we’ll be okay. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager flips through his clipboard.\n\nPROPERTY MANAGER\nRoof’s not new-new, but it’s not a problem. Electrical should be okay. Upstairs has the three main bedrooms — one is yours. Other tenants are out of town, back home, I think. Should be back in September or October. You’d like these guys. Post-docs at Yale. Quiet. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nA beat. The property manager lowers the clipboard slightly.\n\nINT. RENTAL HOUSE - UPSTAIRS HALLWAY - CONTINUOUS\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe hallway is narrow. Doors on either side. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager points as they pass.\n\nPROPERTY MANAGER\nBathroom there. Your room at the end. Other two are theirs. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas stops walking and looks at one door in particular.  \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager notices.\n\nPROPERTY MANAGEROh. Right. Attic.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nHe checks the clipboard.\n\nPROPERTY MANAGER\nNot finished currently. Storage, only. Landlord approves use. I don't think the other tenants use it much. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas moves toward the door and up the stairs.\n\nPROPERTY MANAGER\nOkay. Yeah. There it is.\n\nINT. RENTAL HOUSE - ATTIC - CONTINUOUS\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nLow wood joists. Bare plywood floor. A small window at one end throws gray light across the space. The ceiling is higher than expected. Quiet. \n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas steps into the center of the attic.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager stays below.\n\nPROPERTY MANAGER\nI’m not sure if there’s insulation or — are you seeing anything up there? We can get you the landlord’s contact. I told him to let me know.\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas doesn’t answer.\n\n---\n\n\n### Scene 1: Arrival & Discovery\n\n*ACT I — Arrival & Discovery | ID: arrival | File: s01.md*\n\n---\n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n<!-- nickname: arrival -->\n\n##s01 - Arrival \n<!-- FILMING ON \n6.7.26 -->\nEXT. DALLAS NEW HOUSE - DAY (s01.1)\n\nDallas stares at the Tall Grass outside his house as he unloads boxes from a big pile. Dallas scans the new backyard, there are some old rusty lawn furtniture and a picnic table that seems to be adjacent to a fence of grass \n\nDallas goes into the grass a little bit. He stops. At the edge of the reeds is a jagged, dead patch of earth—a circle of black, oily rot where nothing grows. In the center of the rot, a single wooden stake has been driven into the ground, but it’s been snapped off, the top half gone. \n\nAs Dallas examines the broken wood, he hears a distinct bicycle ring.\n\nMAKAYLA\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nMakayla, 22, and Asher, 14 — approach on bikes. They watch Dallas for a while.\n\nASHER\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nThey approach Dallas slowly as one of the boxes draws their curiosity. Makayla watches Dallas pull out a military grade Oscillator.\n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nAsher nods with his headphones on. Makayla approaches Dallas. \n\nMAKAYLA\nHello there.\n\nDALLAS\nHello.\n\nMAKAYLA\nI'm Makayla.\n\nDALLAS\nDallas. \n\nMAKAYLA\nNice to meet you.\n\nDALLAS\nYou too.\n\nMAKAYLA\nDid you just move here?\n\nDALLAS\nYes\n\nMAKAYLA\nIs that an Oscillator?\n\nDALLAS\nYes. \n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nMakayla looks at Asher and whispers something in his ear. He nods. She returns glances to Dallas and inches her bike closer. \n\nMAKAYLA\nDo you think my brother Asher could borrow it some time? \n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nDallas looks at the Oscillator and then at Asher.\n\nMAKAYLA\nHe'll need it. \n\nDALLAS\nWhat will he need it for?\n\nMAKAYLA\nAsher? \n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nAsher stands silent, still tracing a pattern on his palm. He doesn't look up.\n\nMAKAYLA\nDoes it work?\n\nDALLAS\nIt does.\n\nMAKAYLA\nCan we borrow it?\n\nDALLAS\nFor what?\n\nMAKAYLA\nTo track.\n\nDALLAS\nTrack what?\n\nMAKAYLA\nNever mind. \n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nMakayla, disappointed, walks away slowly and Asher peddle their bikes away.\n\nDallas looks down at a box of old equipment and stretches down to pick it up. \n\nEND S01\n\n---\n\n\n### Scene 2: Sierra's Box\n\n*ACT I — Arrival & Discovery | ID: dallas-night | File: s02.md*\n\n---\n\n<!-- scene: 2 file: s02.md nickname: dallas-night -->\n\n# Scene 2: Sierra's Box\n<!-- summary: Can't sleep. Golden flicker in the grass. He opens Sierra's box; the hum starts; the battery dies. -->\n\n<!-- Filming On  6.9.26 @ Jerry's House  -->\n\nINT. DALLAS KITCHEN - SUNSET (s02.1)\nDallas looks at his new surroundings. He peers through the window outside. As he does a faint hum is heard - he takes out the oscillator and marks down the frequency - and then the hum stops. He stares for a while.\n\nDallas hasiltly brings forth a frozen pizza. As Dallas eats, as the TV glares in the background - a weatherman on screen talks about the upcoming tropical storm season in Branford. \n\nA noise is heard off screen. \n\nEXT. DALLAS DRIVEWAY (s02.2)\nDallas goes outside and stares for a while at the edge of his property. After this he walks down the street and stares for a good while - almost at an invisible spector - and then - faintly - the hum merges. \n\nDallas slowly walks backwards towards his house and then stops when the humm grows louder. Dallas takes out his portable audio recorder. \n\nINT. DALLAS NEW HOUSE - ATTIC - NIGHT (s02.4)\nDallas walks in again and looks again at his new place. He looks at the windows, he looks at the doors, he looks at the cielings. He walks towards a group of large moving boxes scaterred in the center of the living room. \n\nDallas opens up the box labelled \"Field Notes - Branford\" to find sketches of butterflies and caterpillars and scattered drawings of curious insects. As he turns the pages, the butterflies seem to morph into creatures with wings.  Angels.  He flips through some of the pages, some containing sketches of the grass and a golden creature. And a bunch of math. Dallas closes it.\n\nDallas reaches again for the bottom of the box, covered in dust, sumberged by cables, Dallas finds a pair of retro, ruby-red headphones. Next to the headphones is a small casette player. On the back of the player, Dallas peels back a piece of duct tape to reveal a photo sticker. A photo of Dallas and a woman, both sporting heavy audio headsets, laughing as they capture noise in a field of grass. Dalla's thumb rushes over her face. \n\nDallas walks over to the ruby red casette player - he thumbs over the play button fails to do so. \n\nDallas gently closes the box of headphones and gear. He takes a deep breath and opens up another box laying adjacent. He carefully pulls out a heavy military-grade desktop audio recorder, another portable audio recorder, and a small portable Oscillator on his desk. \n\nINT. DALLAS BATHROOM - NIGHT (s02.5)\n<!-- ANOTHER DAY than june 9th -->\n\nDallas takes a shower - and as he zones out from the sounds of the hot water, a faint hum interrupts from the far outside. \n\nAs he takes a shower the audio tape of the ruby red cassette player fills the room. It is of a woman and her field notes and also her song.  As it plays and as Dallas continues to mourn in the shower, he begins to hear a faint hum interrupt from the far outside. \n\nDallas dries off, stops the tape, and peers through the steam of the bathroom window. The hum grows louder. \n\nINT. DALLAS DOWNSTAIRS - NIGHT (s02.6)\nDallas rushes downstairs as the hum grows louder. Dallas, recorder in hand, scrambles toward the window and brings to record. The needle spikes. \n\nDallas  begins to adjust the dial - and begins to hear a whimpering faint, pure, harmonic tone. The sound abrutly stops. And then it starts up again. The sound abrutly stops. And then starts up again. This time in a pulsing pattern. Dallas looks at his watch and begins to time it. One Second. Stop. One second - top. Five seconds. Three seconds. \n\nSuddenly hum sounds like it is moving away and its loudness begins to grow faint. Looking down at the his recording, Dallas notes a spike in the waveform on the low frequency range. \n\nThe battery dies on the recorder. Dallas smacks the back in fustration. Scrambling, he tears through a box of equipment for but none of them have batteries. \n\nFrustrated, Dallas abandones the equipment and heads for the door. \n\nEXT. DALLAS HOUSE - NIGHT (s02.7)\n\nDallas stands alone watching the tall grass sway agaisnt the salt breeze. Coyotes howl in the distance and the hum decreases in scale and size as the starry night disappears into the distance of the tall marsh grass. He sees a faint golden glow pulse once, twice, five times, three times. \n\nIn the distance a thunderstorm brews.\n\n---\n\n\n### Scene 2: Branford at Night Montages\n\n*ACT I — Arrival & Discovery | ID: branford-night-discovery | File: s02.3.md*\n\n---\n\n<!-- scene: 2 file: s02.3.md nickname: branford-night-discovery -->\n\n# Scene 2.3: Branford at Night Montages\n<!-- summary: Dallas walks around Branford at night with a recorder, discovering the weirdness of the neighborhood and tall grass. -->\n\n<!-- Filming On  6.7.26 @ Branford  -->\n\nEXT. BRANFORD AT NIGHT MONTAGES (s02.3)\n\nDallas walks around at night with a recorder in his hand. As he walks along the different coastal neighborhoods - as he stops by a particular puzzling patch of tall grass - he takes big deep breath and pulls out his recorder. He records the sounds of the ocean. \n\nOn the way home - he records the breeze of the tall grass.\n\n---\n\n\n### Scene 3: The Hum\n\n*ACT I — Arrival & Discovery | ID: the-hum | File: s03.md*\n\n---\n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n<!-- nickname: Meet the Neighbors -->\n<!-- FILMING ON - DAY 9 = 6.20.26 -->\nEXT. DALLAS HOUSE - NEXT DAY MORNING (s03.1)\nDallas walks outside his house, towards the edge of the property. As he approaches the edge of his yard he watches the tall grass sway in the wind. He looks at the grass for a beat too long, as he nurses the audio recorder in his hand. As he does so, he becomes dazed.\n\nAs Dallas dazes onward, a man approaches him from the sidewalk near his house. \n\nDOMINIC AMARANTO, early 40s, wearing a bright salmon covered short sleeve button walks up to Dallas with vigor. \n\nDOMINIC\nMy neighbor!\n\nDALLAS\nWhat's that?\n\nDOMINIC\nMy beighbor, neighbor - you're my neighbor - I think we're neighbors - right? You just moved yeah? Dominic - I live nextdoor. Where you coming from?\n\nDALLAS\nOh yeah - nice to meet you. Dallas.   \n\nDOMINIC\nYou here on some university position? Last guy who was here was here for 3 years and then moved on to better things up in Guilford. How is the house? Do they furnish it?  They gave you a house nice man. \n\nDALLAS\nYeah. \n\nDOMINIC\nYou said your name was Dallas, Dallas? Dallas, what a name - where you from? \n\nDALLAS\nIndiana.\n\nDOMINIC\nIndyANNA - far from Branford. \n\nDALLAS\nYeah.\n\nDOMINIC\nWhat you know about Branford?\n\nDALLAS\nNot much. \n\nDOMINIC\nSo what brings you to here?\n\nDALLAS\nWork.\n\nDOMINIC\nOh yeah? What kind of work?\n\nDALLAS\nResearch mostly. \n\nDOMINIC\nOoo - big guy - Yale? \n\nDALLAS\nQuinnipiac \n\nDOMINIC\nOooo - right on - nice. What kind of research?  \n\nDALLAS\nBioacoustics. \n\nDOMINIC\nBio-acoustics. That's the study of sound - yeah? Yeah. Right on. Alright listen - I'm about to head to the green right now - you up for a walk? My car is parked down in the center of town and I need to go get it... What's that in your hand?\n\nDALLAS\nAn audio recorder. I was going to go into town to get some new batteries.  \n\nDOMINIC\nInto town? Where you headed? Rudy's got that. Let's go - I'll buy you a coffee.\n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDallas nods and Dominic leads the way as the two begin their trek towards Brandford town green. \n\nEXT. BRANFORD NEIGHBORHOOD - MOMENTS LATER (s03.2)\n\nDallas and Dominic begin to walk down the sidewalks towards town. \n\nDOMINIC\nYou don't have a car?\n\nDALLAS\nNo - no car.\n\nDOMINIC\nYeah. Me neither - well I drive - for sure, but yeah, I share one with my sister.\n\nEXT. TOWN BRANFORD MONTAGE (s03.3)\n\nDallas and Dominic through coastal sidewalks, neighborhoods, and natural marsh fences. As they approach one patch of tall marsh grass in particular, Dallas stops.\n\nDallas, checks if Dominic is looking and when he isn't - he takes records a bit with the audio recorder and points it's microphone toward the grass. \n\nDOMINIC\n(spotting Dallas)\nBe careful - I heard some coyotes up in that the other night when I was out walking. Some people say the noises are from owls - but I know its coyotes. \n\nEXT. TOWN CENTER - DAY (s03.4)\nDallas and Dominic walk toward a small hardware store. \n\nINT. HARDWARE STORE (s03.5)\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDominic waves to the unfriendly man at the counter and brings Dallas to the battery section. Dallas also buys some audio cassettes. \n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDallas finds the correct batteries and grabs it off the shelf. The two exit the shop.\n\nDOMINIC\nCassetes? What are we doing here. \n\nEXT. BRANFORD GREEN (s03.6)\n\nDallas and Dominic walk past the town green. The building looks closed. Dominic stops dead. A neon orange ticket flutters under his windshield wiper.\n\nDOMINIC\nOh, this is great. Cool. \n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nHe rips the ticket off and walks around to see if anyone is looking, he crumbles it up and puts it in his pocket. He exhales slow, shakes his head, and lets it go. \n\nHe bends downs and grabs a key from the bottom of the car and starts it up. \n\nINT. DOMINIC'S CAR (s03.7)\n\nDominic opens the car and gestures Dallas to get in - non-chantanly the parking ticket in the glove box. \n\nDOMINIC\nYou hungry?\n\nDALLAS\n(still in a daze)\nYeah\n\nDOMINIC\nGood -  my church is doing a fellowship lunch - little picnic - I'm on cleanup duty and got to lock up when they are done. I could drop you off home first but it would be out of the way - You want to come for the ride? \n\nDALLAS\nSure. \n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDominic drives towards the church. \n\nDOMINIC\nNice - yeah - it's nice to be the new guy in town - good old Branford.\n\n---\n\n\n### Scene 4: The Fellowship\n\n*ACT I — Arrival & Discovery | ID: fellowship | File: s04.md*\n\n---\n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n<!-- nickname: fellowship -->\nEXT. CHURCH FELLOWSHIP LAWN - LATE AFTERNOON (s04.1)\n\n<!-- FILMING ON\n7.5.26 -->\n\nDallas and Dominic arrive at CPC and find themselves in heat of a picnic. Children are running, friends down light summerwear as they play spike ball, and church goers find themselvees are on a long line for food. \n\nDallas looks around at all of the new faces but does not make great eye contact. Dominic takes a deep breath and approaches the long line. \n\nDominic carries a package of water and puts it under one of the fold up tables. As he does so, people look at Dallas and begin to greet him. \n\nDOMINIC\nLine is long today - they must got Nicas. Everyone's downing what they can before the storm. \n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAs they wait in line, people begin to turn around and talk to them. One lady, MARY, 55 turns around and shakes Dallas' hand enthusiastically.\n\nMARY\nWell hey there sunshine - what's your name?\n\nDALLAS\nDallas\n\nMARY\nDallas... Dallas, Dominic where did you get this Califorina boy from? My name is Mary - do you like chicken primevera?\n\nDALLAS\nNever really had it.\n\nMARY\nWell you should, its great.... So you ready for some proper New England weather?\n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAnother turns around and greets Dallas. An older gentleman PAUL WILDLY, 72, approaches. \n\nPAUL\nThey claim it'll be historic. Apparently, we haven't had a storm like this since 1971 when Nixon took the US off the gold standard. Paul, nice to meet you. \n\nDALLAS\nDallas. \n\nPAUL\nNow, where are you from?\n\nDALLAS\nIndiana\n\nPAUL\nOo - then you must know of William Henry Harrison - our 9th president, served as Indiana's governor back when it was just a terriority. \n\nMARY\nPaul, stop that. Honey - if you need I can make you some chicken primevera tonight. \n\nDOMINIC\nHe's okay, Ms. Mary thank you. \n\nDALLAS\nThank you. \n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nDallas and Dominic sit in a circle of folded pull up chairs. \n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nMakayla and Asher approach from afar to the line. \n\nDOMINIC\nDallas, these are my sister and brother - Makayla and Asher.\n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nMakayla and Asher don't make direct eye contact with Dallas but fake a polite smile. Makayla taps Asher's headphones and nods toward the far end of the church lawn. Between the bushes and garden. \n\nThe two leave the line walk over to a corner spot by the end of the church yard and huddle over a pile of brush.\n\nMakayla takes out some cables out of Asher's backpack - and begins to assemble, what looks like an audio recorder on a boom pole. \n\nAsher begins to point in the direction of the bushes and Makayla nods. \n\nDallas takes a bite of his chicken but doesn't eat much. He's distracted by what Makayla and Asher are pointing at the distance.\n\n---\n\n\n### Scene 5: The Merlin App\n\n*ACT I — Arrival & Discovery | ID: marsh-walk-later | File: s05.md*\n\n---\n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n# Scene 5: The Merlin App\n<!-- summary: Boardwalk through the reeds. They hear birds andSomething moving in the marsh. -->\n\n<!-- FILMING ON - DAY 4 = 6.13.26 -->\n\nEXT. MARSH TRAIL - LATER (s05.1)\nThe sun is dipping. Dallas and Dominic walk back home - along a wooden boardwalk that cuts through the tall, golden-yellow reeds.\n\nDominic and Dallas walk quietly for a while. Dominic looks out to the tall grass.\n\nDOMINIC\nThe kids are always out here planting down cameras. Makayla says that they are geotagging or something. I don't know. \n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nThe two hear a distant cry - that could be a bird. Dallas looks at Dominic.\n\nDOMINIC\n(to himself)\nYeah.\n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDominic pulls out his phone, tapping an app.\n\nDOMINIC\nHey check this - It listens to the chirps and tells you the species. Some nice sounds here - Egret, those little Piping Plovers, the mighty offspree, I love them - I love them all. it if you're working at Quinnipiac you should get this. \n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDominic struggles to get the app to work and begins to pace a bit. \n\nDOMINIC\nYeah - I like the birds - I like the sounds they make - I thought about how to write them down. And then I never thought much past it. I'm 'writing now - but something else - I don't got much time. ' one day I'll tell a story of these marlins.\n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nHe takes a slow, deep breath, collecting himself.\n\nDOMINIC\n(in anger)\nSometimes I wonder if this all is just make believe.\n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDallas looks onward empathically. \n\nDALLAS\nWhat do you mean?\n\nDOMINIC\nThis whole existence - being alive - its so overwhelming and then boom - you are gone. \n\nDALLAS\nYeah.\n\nDOMINIC\n(to himself)\nBoom - Gone. \n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDallas and Dominic walk slowly and Dallas looks out to the tall grass for a while.\n\n---\n\n\n### Scene 6: News Vans\n\n*ACT I — Arrival & Discovery | ID: news-vans | File: s06.md*\n\n---\n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n# Scene 6: News Vans\n<!-- summary: News vans in the street. Pat on camera. Marks on Dominic's driveway. Dallas strays and stays. -->\n\n<!-- FILMING ON = DAY 9 = 6.20.26 -->\n\nEXT. BRANFORD NEIGHBORHOOD - CONTINUOUS (s06.1)\n\nDallas and Dominic reach back to their neighborhood. Outside, nestled between their house, three news vans are parked haphazardly. \n\nDominic parks the car and the two get out to see. \n\nPAT CLENDENEN, MID 50s, is outside their house in front of news cameras. \n\nPAT CLENDENEN\n(to camera)\nThanks Micky, Out here today in my hometown of Branford, CT. Pretty excited to be back home. So if you are in anywhere in costal connecticut, all the way up to Rhode Island today, some parts of southern mass all the way towards Boston. This is New England weather for you, always unpredictable - always on the bleeding edge....So in that spirit, today we'll see sun to clouds, breezy, warm with a late day shower possible. But the real attention - and the reason we are here - is to bring attention to a possible development along the shores.... We are staying on top of a trend through the rest of this week - as any shift could dramatically impose a threat - this costasl community. act the entire state. The european models are showing signings that we might be in for a big one and while we're all hoping the Nor'easter stays out at sea, the current models suggest a wild weekend for the shoreline. \n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic scoffs as they walk past.\n\nDOMINIC\nPat's been predicting the end of the world every Tuesday for ten years.\n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nThe camera cuts. Pat notices Dominic and waves at him from afar. \n\nPAT CLENDENEN\nDominic! See you Thursday! \n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic waves back at Pat. He looks at Dallas and shrugs. The two continue past the news vans.\n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nThe wind gusts, catching a news umbrella and nearly toppling it. The hum in Dallas's pocket recorder spikes for a split second.\n\nEXT. DOMINIC'S HOUSE (s06.2)\n\nThey arrive back at Dominic's. Two large plastic trash bins are sprawled across the driveway, trash strewn everywhere.\n\nDOMINIC\nLook at this. Those raccoons! \n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic takes a slow breath.\n\nDOMINIC\nI try to do the right thing and I keep getting kicked. \n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic kicks a stray milk carton. He looks at the garbage cans around his house, then at Dallas.\n\nDOMINIC\nListen, I got to get the furniture before life group tonight. I got to go check on Mike and bring in another fan from the basement. You good? \n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDallas notices that there are some weird burn marks on the ground. He gazes at them for a bit of time. The burn marks are like black sands, not disimmilar to veins on the ground. \n\nDallas walks over to the burn marks and touches them. He looks at his skin reacts a bit to the marks and he takes a little nearby leaf with the mark and puts it in his pocket. \n\nDALLAS\n(hesitates)\nYeah\n\nDOMINIC\nDo you want to stay for a bit?\n\nDALLAS\nSure.\n\n---\n\n\n### Scene 7: The Coordinates\n\n*ACT I — Arrival & Discovery | ID: the-coordinates | File: s07.md*\n\n---\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n<!-- nickname: the-coordinates -->\n<!-- FILMING ON = Sun June 28 - Day 12 -->\n\nINT. JACE'S BASEMENT (s07.1)\nDallas looks around in amazement. The basement is covered with normal basement things - but as his eyes scan the room he notices that there are two beds, room, and clutter. Around the corner there is a workstation filled with old CRT machines and what not.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas looks at all of the different audio and acoustic devices scattered across the room. On the cieling there are tiny beeds hung from strings - tiny with different colors. \n\nDOMINIC\nThis was formerly our shared basement - but, now, my brother and sister live here have occupied. They just love this basement... Here, help me grab the fan. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas looks at all of the different audio and acoustic devices scattered across the room. Dallas walks over to one and sees the similar trail cam that he found on his property - but, this one is different. It has a small antenna attached to it. \n\nDominic taps Dallas on the shoulder, breaking him out of his gaze and together they slowly move the AC unit upstairs. \n\nINT. DOMINIC'S BASEMENT (s07.2)\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic helps Dallas shove a heavy oak table against the wall. As they move - Dominic knocks over a photo frame - and Dallas grabs it. On the ground is a small, framed photo of a woman and a young boy on Dominic's shoulders.\n\nDominic bends down to grab the photo for a bit. \n\nDOMINIC\nDo you have kids?\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic hands Dallas the photo. \n\nDALLAS\nNo. \n\nDOMINIC\n(looking at the photo)\nI had a family once. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas falls mute. \n\nDOMINIC\nNo kid now, no wife now. Just my brother and sister. And Mr. Mike. My lot in life. I'll take it.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic reaches out for a handshake. \n\nDOMINIC\nIt has been nice hanging out with you Dallas - thanks for coming and helping today. \n\nDALLAS\nOh you're welcome. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic scans the room and finds his gaze upon the corner. MR. MIKE (mid 70s) begins to wake up from his  rocking chair, staring fixedly at the floor. Mr. Mike scans the room and then outside and then takes a deep breath before he begins to violintely scratch the wood of the table using a jagged nail. \n\nDOMINIC \nMr. Mike! Mr. Mike, what are you doing?! \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike suddenly looks up, his eyes milky but sharp. He points a finger at the window.\n\nMR. MIKE\nSorry, I had to write something down. It was important that I wrote something down. Dominic. Dominic! \n\nDOMINIC\nYes? \n\nMR. MIKE\nShe's here!\n\nDOMINIC\nWhose here? Could you not scratch the table anymore? Whose here? \n\nMR. MIKE\nDominic. Makayla. Asher\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic dashes for the door and opens it. In pop Makayla and Asher. \n\nAsher runs straight towards Mr. Mike and kneels down before him. Makayla side eyes Dallas. \n\nMR. MIKE \nOne one five three. One one five three. They're here - Dominic - Makayla's here - ASHER! Is that you? Come here. Five five five five.  \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike points to the window. \n\nMR. MIKE\nDo you see? \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher's eyes widen when he sees what Mr. Mike has been writing. He already has his sticky note out; he copies the numbers, taps the page twice, then runs to Makayla and shows her. She puts the note in her pocket. \n\nMakayla walks over and sets two bags of groceries on the counter and hands Asher a set of keys. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic moves toward the kitchen and stumbles upon Dallas's heavy audio recorder.\n\nDOMINIC \nWhat is this? A boat anchor?\n\nDALLAS\nIt's a recorder. \n\nDOMINIC\nA recorder? You taping this conversation? I'm kidding, you could, la la la la laaaa. Dallas do you want to have some dinner with us? \n\nDALLAS\nUm, no - I should be going back. Thank you though.  \n\nDOMINIC\nYou sure? \n\nDALLAS\nYeah, I got some food back at home, so, I'll be okay.  \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike in the distance begins to get agitated. He rocks slowly in his rocking chair and taps his fingers. \n\nMR. MIKE\nThey are being hunted. Javerias told me. They are being hunted.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMakayla walks over to Asher, who is still kneeling besides Mr. Mike, listening intently.\n\nMAKAYLA\nWho is Javerias?\n\nMR. MIKE\nJaverias, Javerias, he told me. I haven't seen them since the big blow in '71. The Red Eyes. They come when the pressure drops and the sky turns that bruised color. Back then, they took the whole center marsh—swallowed it whole. Javerias said if you hurt one—even if it was by mistake—they transform. They turn into the shadow ones. The predators. And when the wind picks up tonight, the Nidus will open, just like it did for the gold standard. They're coming back to finish the harvest.\n\nDOMINIC\n(from the Kitchen)\nMr. Mike, calm down my friend - dinner will be ready soon. \n\nMR. MIKE\nAre you making the sprouts?\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMakayla walks over and places the portable Oscillator from Dallas' hand. \n\nMAKAYLA\nIt didn't work.\n\nDALLAS\nNo?\n\nMAKAYLA\n(thinking)\nWill it actually record the frequencies? Or does it just display? How do you record?\n\nDALLAS\nThere's a memory card in there. But it writes in an old format. \n\nMAKAYLA\nWhat format? \n\nDALLAS\nB24FF\n\nMAKAYLA\nOkay, I've already copied them and don't think it worked. Thank you though. \n\nDOMINIC\nMakayla whats that - give it back. \n\nDALLAS\nIt's fine. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas looks at Makayla and back at Asher who is still kneeling by Mr. Mike. \n\nDOMINIC\nMakayla, I showed Dallas your little basement dwelling.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMakayla looks over to Dallas with sus looks.  \n\nMAKAYLA\nOkay great.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike from the living rooms gets agitated. He begins rocking back and forth in his chair. \n\n\nMR MIKE\nThe numbers are off. Asher knows. The numbers are off.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike continues to rock - he looks over - ignores Makayala's gaze and locks eye contact with Asher.\n\nMR. MIKE\nThe numbers are wrong. \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMakayla walks over to Dallas.\n\nMAKAYLA\nDoes it pick up frequencies below the human range? \n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas nods. His eyes drift up to the strings of tiny colored beads hung across the ceiling — a hanging model of something, dozens of nodes on threads.\n\nMAKAYLA\nAsher's map. Every bead's a spot out in the grass we've tagged. He keeps the whole field up there — none of us can.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher, meanwhile, ignores the conversation, eyes fixed on the distant bushes at the edge of the property. The leaves flutter, though there is no wind. His finger traces a ripple on his hand.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic begins to light the gas to start boiling the brussels but the lighter doesnt work. \nHe throws up his hands and steps outside to the patio to get it going. Dallas follows him out.\n\nEXT. DOMINIC'S PATIO (s07.3)\n\nDOMINIC\nThank you again Dallas.\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas begins to walk across the street to his house.\n\n---\n\n\n### Scene 7B: Mr. Mike's Warning\n\n*ACT I — Arrival & Discovery | ID: mr-mikes-warning | File: s07b.md*\n\n---\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n<!-- FILMING ON = Sun June 28 - Day 12 -->\n\ns07B — INT. DOMINIC'S BASEMENT — CONTINUOUS\n(Slots in between Scene 7.2 and the end of Scene 7. After Mr. Mike has rambled about Javerias. Dominic is in the kitchen, out of frame. Dallas is alone with Mr. Mike.)\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stands near the table, holding the frame with the photo of Dominic's family. He sets it down gently.\nMr. Mike rocks in his chair. He has stopped muttering. His eyes are on Dallas now. Focused. Different.\n    \nMR. MIKE\nCome here.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas glances toward the kitchen. Dominic is out of earshot. He walks over.\n\nMR. MIKE\nCome closer I can't hear you. \n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas crouches beside the rocking chair. Mr. Mike reaches out and takes Dallas's wrist. His grip is stronger than it should be.\n\nMR. MIKE\nYou listen to me.   \n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas doesn't move.\n\nMR. MIKE\nJaverias told me this when I was seven. My father's age. I'm telling you now. You're going to need it.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nA beat. Mr. Mike's eyes are clear. No fog. No wandering.\n\nMR. MIKE\nIf you find one of the bright ones. Hurt. Bleeding. Anything.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nHe tightens his grip on Dallas's wrist.\n\nMR. MIKE\nYou leave it.\n\nDALLAS\n(quiet)\nWhat?\n\nMR. MIKE\nYou don't touch it. You don't take it. You don't try to help. You leave it. \n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nMr. Mike looks at him for a long moment. His lip trembles.\n\nMR. MIKE\nIf you touch the hurt one, you make the dark one. And then you become the dark one. \n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stares at him.\n\nMR. MIKE\nEvery time. Every single time.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nHe lets go of Dallas's wrist.\n\nMR. MIKE\nI touched one. When I was a boy. I didn't know. Javerias came the next week. Told me what I did.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nA pause. The rocker creaks once.\n\nMR. MIKE\nThe dark one is still out there.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stares out the window and on the floor. \n\nFrom the kitchen:\nDOMINIC (O.S.)\nDallas — you want water?\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nThe spell breaks. Mr. Mike blinks. His eyes cloud over again. He looks at Dallas like he's not sure who he is.\n\nMR. MIKE\n(confused, gentle)\nWho are you?\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stands slowly. His hand goes to his own wrist — rubbing where Mr. Mike gripped it.\n\nDALLAS\n(calling back)\nNo, I'm okay.\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nMr. Mike starts humming. \n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas looks at his wrist one more time, then at the rocking chair. Then at the window, toward the tall grass.\n\n---\n\n\n### Scene 8: The Trailcam\n\n*ACT I — Arrival & Discovery | ID: dallas-marsh-walk | File: s08.md*\n\n---\n\n<!-- scene: 8 file: s08.md nickname: dallas-marsh-walk -->\n\n# Scene 8: The Trailcam\n\n<!-- FILMING ON = \nDAY 3 - EVENING - 6.12.26 -->\n\nEXT. DALLAS HOUSE - MOMENTS LATER (s08.1)\n\nDallas grabs his portable Oscillator and heads toward the marsh, following a spike in the readings.\n\nEXT. BRANFORD ROCKS - EVENING (s08.2)\nThe Long Island Sound roars, the waves crashing violently against the Branford rocks. Dallas walks along the edge of his neighborhood.\n\nDallas steps off the boardwalk onto a narrow dirt path that runs behind the houses, where lawns thin into reeds and the creek bends toward the marsh.\n\nDallas holds his portable Oscillator out. The needle begins to flutter with increasing intensity. \n\nIn the far distance, a single coyote barks. Then another. A chain reaction of domestic fear starts in the neighborhood, followed by the high, thin yip of coyotes further inland.\n\nThe winds pick up. Dallas marches forward. \n\nEXT. EDGE OF THE MARSH (s08.3)\n\nDallas pauses at the edge. The Hum is louder here, a dense vibration that makes his vision vibrate.\n\nDallas walks into the marsh.\n\ns08.4 — EXT. INTO THE MARSH (s08.4)\n\nHe finds the spot. A makeshift wooden trap, but it's been... compromised. A thick ring of oily black rot circles the wood, the grass within the circle dead and brittle.\n\nDallas finds the trailcam. The lens is cracked, but the \"Record\" light is still blinking a faint, dying red. \n\nSuddenly, a heavy thud hits the mud thirty feet away like something landing from a big height. \n\nThe Hum stops. Dallas freezes. He rips the trailcam from its mounting, his fingers fumbling with the nylon straps.\n\nA low, guttural chittering sound rises from the grass behind him.\n\nDallas walks faster. He scrambles back toward the boardwalk.\n\n---\n\n\n### Scene 8C: The Threshold\n\n*ACT I — Arrival & Discovery | ID: the-threshold | File: s08c.md*\n\n---\n\n<!-- scene: 8C file: s08c.md nickname: the-threshold -->\n\n# SCENE 8C: THE THRESHOLD\n\ns08c.1 — EXT. DALLAS HOUSE - PORCH - NIGHT\n\nDallas stands on the porch, holding the audio recorder in his hand like a weapon.\n\nThe sky is beginning to fade - and the sounds that he is hearing are getting more and more violent. \n\nDallas - on a\n\n---\n\n\n### Scene 8D: The Return\n\n*ACT I — Arrival & Discovery | ID: the-return | File: s08d.md*\n\n---\n\n<!-- scene: 8D file: s08d.md nickname: the-return -->\n\n# SCENE 8D: THE RETURN\n\ns08d.1 — EXT. EDGE OF THE MARSH - NIGHT\n\nDallas walks along the edge of the Long Island Sound. He takes a deep breath and looks at the coast for a while - as he does so - he hears a hum.\n\nThe needle on the Oscillator spikes back and forth. Dallas takes out his bag and reveals his wife's recorder that he has been avoiding. He puts in a new tape. \n\nDallas records the hum. \n\nINT. DALLAS HOUSE - NIGHT\n\nDallas plays back the recording. It's the sound of the marsh at night - birds, bugs, the waves - but underneath it all, there's the faint sound of the hum. \n\nHe goes into the computer and begins to put ear marks on all of the certain peaks. \n\nA ring at the door. \n\nDallas walks downstairs.\n\nThe phone rings. It is Dominc\n\nDOMINIC (voiceover)\nDallas, I am so sorry to call so late - Asher is not doing so well and we have to bring him to the hospital tonight. Keep an eye on the place for us.\n\nDALLAS\nSure, of course.\n\nDOMINIC\nThank you - I'll be back later. \n\nDallas heads back up and continues his work. \n\nDallas goes to sleep.\n\n---\n\n\n### Scene 9: The Injured One\n\n*ACT I — Arrival & Discovery | ID: dallas-night-work | File: s09.md*\n\n---\n\n<!-- scene: 9 file: s09.md nickname: dallas-night-work -->\n\n# Scene 9: The Injured One\n<!-- summary: Dallas, as he ventures deeper and deeper into the marsh - finds a bioluminest creature -->\n\n<!-- FILMING ON - DAY 3 = 6.12.26 -->\n\nEXT. DALLAS HOUSE - NEXT DAY\n\nDallas heads back toward the marsh, driven by last night's discovery.\n\nEXT. EDGE OF THE MARSH\n\nDallas enters an interesting field of tall bamboo like grass. \n\nDallas looks at his portable Oscillator - it is acting crazy. \n\nEXT. DEEP INSIDE THE TALL MARSH (s09.1)\n\nDallas stands slowly, scanning the reeds around him. Nothing much seems out there - just the gentle sway of grass.\n\nDallas pushes through a dense curtain of reeds. Dust motes dance in a whirlwind of color refracting the sunset into jagged prisms on his face. \n\nDallas steps deeper, following the fading glow. \n\nAll around him is light reeeds blowing in a whirlwind of light and color. \n\nAs Dallas' eyes adjust to this new brightness - the world around him slowly blurs. \n\nThere in the distance Dallas sees a gnarled tree that stands alone among the reeds.  \n\nDallas approaches the tall grass and the gnarly tree and as he does - he notices that inside of the gnarl, curled up, tucked away,  lives a small orb shaped creature - slightly bioluminest - and clearly injured. \n\nThe creature is a cloudlike - cottonball, powder-puff animal with feathers all around it's body. \n\nDallas reaches out. His hand trembles. He touches the creature's back. The creature flinches but doesn't move away. \n\nThe creature inch by inch begins to uncoil a tentacle from inside its body and wraps around Dallas' finger, and then hand.\n\nAs the creature connects Dallas closes his eyes and appears to be having a vision. \n\nHe opens his eyes and gazes longingly at the creature. It has the body a bit like a turtle - but the face of a dove - and the tentacle of an octopus. \n\nDallas hears his equipment beep louder and louder.\n\nThe creature reaches out its tiny octupus arm and gently wraps itself around Dalla's hand. Dallas picks it up and nestles it into his chest. \n\nSuddenly, the wind returns. A violent gust. Shadows in the distance start to fill the sky and hover over Dallas and the creature. Dallas in a daze, slowly grabs the creature and gently places it in his jacket and begins to walk without looking back.\n\n---\n\n\n### Scene 10: The Chase\n\n*ACT I — Arrival & Discovery | ID: shadows-in-wind | File: s10.md*\n\n---\n\n<!-- scene: 10 file: s10.md nickname: shadows-in-wind -->\n\n# Scene 10: The Chase\n<!-- nickname: Creature discovery -->\n<!-- FILMING ON \nDAY 3 6.12.26 -->\n\nEXT. TALL GRASS - MOMENTS LATER (s10.1)\n\nAs Dallas walks out of the tall grass, he gets the sense that something is following him.\n\nThe air changes and the hum faintly comes back. Then in the distant, more coyotes begin to howl. \n\nA heavy, crushing sound slices through the reeds—something massive rocketing toward him like an arrow. \n\nRed eye's begin to circulate around him - pulsing as they inch closer as if Dallas' vision is on a blurry carpret ride. \n\nDallas breaks into a sprint. He doesn't stop running until the marsh is far behind him.\n\nEXT. BRANFORD MONTAGE (s10.2)\n\nDallas walks briskly past the same neighborhood route he took before. \n\nEXT. DALLAS DRIVEWAY (s10.3)\n\nAt the edge of his driveway, he finally stops—gasping. The creature is motionless in his coat, but its neck glow pulses weak, fading amber.\n\n---\n\n\n### Scene 11: Kitchen Triage\n\n*ACT I — Arrival & Discovery | ID: kitchen-triage | File: s11.md*\n\n---\n\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n# Scene 11: Kitchen Triage\n<!-- nickname: kitchen-triage -->\n<!-- summary: Dallas at home with the creature. Kitchen triage—parchment, macro lens. The creature cries; the equipment flares gold. -->\n\n<!-- FILMING ON DAY 6 -- 6.16.26>\n\n<!-- SCENE NOTES: - MAYBE KILL ASHER HERE -->\n\nINT. DALLAS KITCHEN - DUSK (s11.1)\nDallas rushes to bring the creature inside. He grabs an aluminion pan and lines it with parchment paper. The creature seems to be asleep. \n\nDallas hears a sound from the other room.\n\nINT. DALLAS ATTIC - MOMENTS LATER (s11.2)\nDallas finds himself alone with the creature trying to understand it as he observes its features with thick macro monoculars. \n\nAs Dallas peers closer, he notices that it has marks underneath its eye. As Dallas touches the marks the creature suddenly wakes up and lets out a cry.\n\nAs the creature cries - Dallas notices that all of the screens on his equipment transform a sudden burst of golden static. The hue gets so vibrant and bright that permant golden marks are left scattered across all of his equipment near the creature. \n\nThe creature lets out a final whimper and slowly falls back to sleep. Dallas - looks at the mark again, as its sparkles and then fades. \n\nINT. DALLAS WORKSHOP (s11.3)\n\nDallas enters the workshop and grabs a bunch of things. \n\nDallas begins to construct a livable habit that the creature could live in. He grabs spare objects around his workbench and constructs. \n\nHe peers over at the creature and notices that it is breathing heavily. He covers it with a blanket - and a makeshift box - as he notices that the light hurts it. \n\nDallas flicks the switch and the box turns into a redlight. \n\n\nINT. DALLAS DESK - NIGHT (s11.3)\n\nThe day has turned to night and Dallas is still tinkering with this habitat creation. From it - a bunch of wires are hooked up haphazardly to his makeshift computer. \n\nDallas is peered over his computer and begins to scan a program between different spectrums. \n\nDallas tries dials different frequiences to broadcast - but nothing. Dallas look at the recordings of the day that captured and finds that there is a peak on the GHz frequency 115.2GHZ. \n\nHe listens to the recording. At first, nothing but the usual low-grade rumble of the marsh. Then—a pulse. \n\nIn the distance Dallas hears the hum again.\n\nDallas goes over and tends to the creature - but this time it is visually shaken. Dallas sits next to it on a chair and waits for it to calm down. \n\nDallas puts the creature in his new makeshift box. \n\nAs Dallas sits - his eyes get heavy - and he suddenly catches himself snoozing. He gets up - and sees Sierra's tape recorder on the desk. He stumbles over for a bit and presses play. A small little melody of Sierra playing piano and singing gently engulfs the air.  \n\nAs he does, he notices that the creatures' cry begins to cease - but as it does - so does the recording. \n\nHe replays the clip. But nothing, it is blank. Dallas plays it again, distraught.\n\nHis elbow brushes the stack of Sierra's folders. One slides open—a corner of a sketch visible. Something golden. He pushes it closed without looking. \n\nAs he is listening another burst hits the ongoing recording. Dallas looks up from his desk and peers outside. Another faint hum.  \n\nA doorbell is heard off screen breaking Dallas out of his trance.\n\nINT. DALLAS' HOUSE - HALLWAY - NIGHT (s11.4)\nDallas opens the door to find Dominic.\n\nDOMINIC\nHey - we're doing a lifegroup tomorrow night at our place - you should come. \n\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n(action)\nDallas peers toward the kitchen.\n\nDALLAS\nYeah, should be good. \n\nDOMINIC\nOkay... Hey - everything okay?\n\nDALLAS\nYeah - sorry - I'm just a little tired. \n\nDOMINIC\nAlright well rest well big guy. \n\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n(action)\nDominic and Asher leave and walk into the next side door. Dallas watches them - and then watches the tall grass sway in the wind. \n\nDallas rushes to the workstation and finds that the creature sleeping peacefully.\n\n---\n\n\n## ACT II — The Creature\n\n---\n\n\n### Scene 12: The Burn Mark\n\n*ACT II — The Creature | ID: the-burn-mark | File: s12.md*\n\n---\n\n<!-- scene: 12 file: s12.md nickname: the-burn-mark -->\n\n<!-- nickname: ALONE WITH THE CREATURE  -->\n\n<!-- Filming on = Day 4 = 6.13.26 -->\n<!-- LOCATION: Jerry's Attic - Shoot somewhere where Dallas is also alone -->\n\nINT. DALLAS'S ATTIC - NEXT MORNING  (s12.1)\n\nMorning dawns and Dallas takes a deep breath as he awakes from a cot near the desk. \n\nHe stares at the wall for a while and then at his bed post and the journal with the picture of the woman next to it. \n\nHe hears a chirp and looks over at the creature.\n\nCUT TO:\nThe creature is sound asleep in the makeshift aquarium that Dallas built for it. \n\n\nDallas looks at his computer and begins to scan the records. \n\nOutside he hears a loud bang and someone yelling in the distance. \n\nDominic's car idles in the driveway. Dominic gets out and checks the pressure on one of its tires.\n\n---\n\n\n### Scene 13: The Confrontation\n\n*ACT II — The Creature | ID: entering-grass | File: s13.md*\n\n---\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n# Scene 13: The Confrontation\n\n<!-- FILMING ON \nDAY 5 = 6.14.26 -->\n\nEXT. DALLAS BACKYARD - NEXT MORNING (s13.1)\n\nDominic takes a deep breath and bends over to check the tire pressure.\n\nHe finds a patch of grass and touches it. \n\nMakayla and Asher wander toward the edge of Dallas's property, kneeling over when they get to the edge. \n\n\nMAKAYLA\nAsher, look.\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla points to a trailcam that seems to be behind Dallas' backyard gate . It is blinking. Asher unties it and gives Makayla the SD card, which she puts in her pocket. Meanwhile Dominc walks right up to Dallas' doorway and kocks.\n\nDallas emerges. \n\nMakayla kneels and touches it. Her hair flutters, static electricity pulling the strands toward the stone. She quickly pockets it.\n\nMakayla notices a trail leading from the edge of the grass toward Dallas. Asher grabs beads from his pocket and begins to dangle them nervously. \n\nCut to. \n\nEXT. DALLAS DOORWAY\nDallas walks outside and Dominic bangs his hand on the door. \n\nDallas answers. \n\nDOMINIC\nDallas! Gosh what a whirlwind. Listen, our church has a bible study tonight - you should come. That okay?\n\nDALLAS\nYeah that's fine. \n\nDOMINIC\nGood. \n\nMAKAYLA\nDominic, no worries Mr. Dallas we'll hang with you and show you around. \n\nDOMINIC\nOh Yeah? You trying to get out an errand? \n\nMAKAYLA\nOf course.  \n\nDOMINIC\nAlright fine - it's settled - but hey, you owe me one Makayla. If your mother comes back before I do tell her I am at the store. \n\nMAKAYLA\nOkay Dom.\n\nDOMINIC\nOkay. \n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDominic drives away. \n\nEXT. DALLAS's HOUSE -  DOORWAY (s13.2)\nMakayla stares at Dallas for a good while - and reads his eyes.\n\nMAKAYLA\nI think we shoud talk.\n\nDALLAS\nYeah?\n\nMAKAYLA\nYeah\n\nDALLAS\nOkay.\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla turns and points to the burn marks. \n\nMAKAYLA\nWhat is that outside your house?\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDallas looks outside, towards the burn marks on the edge of \nthe tall grass. His eyes widen. \n\nDALLAS\nI don't know. \n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla points to the trailcam. \n\nMAKAYLA\nWhat is that outside your house? \n\nDALLAS\nIt looks like a trailcam. \n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nA whimper is heard from the kitchen. \n\nMAKAYLA\nWhat is that?\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla rushes past Dallas and runs to the kitchen.  She takes out her portable oscillator and sees that it is spiking as she points it to the cieling. \n\nAsher and Dallas stand silent looking at each other for a beat too long.\n\nMakayla ignores everyone and rushes out of the room, up the stares, towards the attic. \n\nINT. DALLAS ATTIC - MOMENTS LATER (s13.3)\n\nDallas and Makayla hover around the table at the makeshift aquarium Dallas constructed.\n\nAsher walks arounds and takes his headphones off and grabs the ruby red headphones on the kitchen table. He puts them on and listens to the recording. \n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla pulls out her portable viewfinder and begins to inspect the creature further. \n\nMAKAYLA\nHow long has it been here?\n\nDALLAS\nSince last night. \n\nMAKAYLA\nLook at this, look how it breathes.\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nThe pair look closer at the creature - it seems to breath through its back. \nMakayla touches the creature gently - which causes the screen Oscillator around \nit to spark.\n\nMAKAYLA\nWe can't tell anyone about this.\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nMakayla turns to Dallas who nods in agreement. \n\nEXT. DALLAS HOUSE - PICNIC BENCH (s13.4)\nDallas adjusts his position on the picnic bench and gently walks towards the \nedge of the tall grass. \n\nMAKAYLA\nMr. Dallas, where did you find it?\n\nDALLAS\nA couple of miles away. I am not sure exactly. I was out walking. \n\nMAKAYLA\nWas anyone with you?\n\nDALLAS\nNo - I was alone. I ventured off the trail. \n\nMAKAYLA\nWhy did you take it?\n\nDALLAS\nIt looked like it was injured.\n\nMAKAYLA\nAnd you could fix it? \n\nDALLAS\nI think so. \n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDallas grabs a heat lamp and begins to examine the creature. Asher in the \ndistance stands off, afraid to look at the creature.\n\n---\n\n\n### Scene 14: The Connection\n\n*ACT II — The Creature | ID: creature-rescue | File: s14.md*\n\n---\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n# Scene 14: The Connection\n\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\nEXT. DALLAS BACKYARD - OLD PORCH TABLE (s14.1)\n\nMakayla and Dallas look on the ground for a while as they sit outside the patio. \n\nAsher sits alone a few feet away—he begins to tap on his fingers, and then nods in approval. He takes some string from his pocket and begins to quietly thread various quanity of beads. \n\nMAKAYLA\nWhat do you do when you are sad? \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks at the ground and then at Makayla.\n\nDALLAS\nI don't know.\n\nMAKAYLA\nYour wife was an Epistemologist? \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks at the sky and then at the ground and then at the burn marks at the edge of the property. \n\nMAKAYLA\nShe studied how fish communicate underwater?\n\nDALLAS\nShe did.\n\nMAKAYLA\nSounds like a smart lady.\n\nDALLAS\nShe was (long beat) How did you know that?\n\nMAKAYLA\nHow did I know what?\n\nDALLAS\nHow did you know that my wife was an Epistemologist. \n\nMAKAYLA\nI've read her papers. Read her book. Watched her give that ted talk. And wondered what kind of woman she was. And now - here I am - with her husband. \n\nDALLAS\nYeah. \n\nMAKAYLA\nYeah... You're not really like who I thought you would be. \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas nods and looks at the ground.\n\nMAKAYLA\nOur moms gone too. But we're still here and now we are here living with our uncle - in Branford.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nMakayla looks down at her equipment and then up at the trees.\n\nMAKAYLA\nWhere did you find it? \n\nDALLAS\nI'm not where.\n\nMAKAYLA\nNot sure?\n\nDALLAS\nI was in a bit of a daze.\n\nMAKAYLA\nWhat kind of daze? \n\nDALLAS\nNot sure. \n\nMAKAYLA\nThat habitat you built. What is that about?\n\nDALLAS\nI think it is senstivie to UV light. \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nMakayla nods. \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nA gentle breeze blows through the sky. Asher begins to pace around and bob his head a bit back and forth. Suddenly, he stops in his tracks and proceeds to walk slowly into the house. \n\nMakayla looks back and him and continues to fiddle with the Oscillator.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas and Makayla sit for a while on the long old picnic table outside his house. In the distance the creature begins to cry and then it fades. Makayla turns to looks down at her trailcam in the distance. \n\nMAKAYLA\nWe should go - we need to document this... Dallas. We can't tell anyone, not until we document this. The sound it makes. We should try to record that.\n\nDALLAS\nI've been.\n\nMAKAYLA\nYou've been what?\n\nDALLAS\nI've been recording it's sound.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe breeze overwhelms them both in the distance they begin to hear the faint pulse of a dark deep hum. \n\nINT. DALLAS' ATTIC - CONTINUOUS (s14.1B)\n\nThe crew huddle over machinery in Dallas attic. Asher gets a bit weirded out and heads downstairs.\n\nINT. DALLAS' KITCHEN - CONTINUOUS (s14.2)\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe room grows quiet.  Asher, alone, busies himself trying to connect wires up to the makeshift computer on the counter. He stops as, looks down at the cables and then far off in the distance, then on the ground, then the tall grass. His finger traces something on his leg—the same pattern, over and over. \n\nOutside the window, the wind picks up.  From the distance - what looks like a faint red light appears for a second and pulses away. \n\nAsher begins to tap and tap and tap, and his head begins to shake and shake and shake. He crashes to the ground.\n\nEXT. DALLAS BACKYARD - OLD PICNIC TABLE - CONTINUOUS (s14.3)\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nA loud thump is heard from outside. Makayla runs into Dalla's kitchen.\n\nINT. DALLAS' KITCHEN - MOMENTS LATER (s14.4)\n\nMakayla holds Asher by the head as he shakes on the ground. Makayla begins to sway and hum to him gently. She puts her hand on his chest and he breathes. \n\nDALLAS\nIs he okay? \n\nMAKAYLA\nHe's fine... He's just doing Asher stuff. I think he's just processing. \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nMakayla takes a deep breath as Asher shakes violently and stops shaking violently. \n\nMAKAYLA\nSit up.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nMakayla makes Asher sit up and brings him a glass of water. As she is pouring it - she notices the creature sleeping peacefully below the heat lamp. \n\nMAKAYLA\nI find it interesting that your wife was an epistemologist - you know, they used to think that the sea was silent - but it's not. \n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks around at his kitchen island - which has turned part into a triage hospital station. A portable oscilloscope is wired up to the creature.  The device pulses in a rhythmic, golden jagged line — in sync with the creature's heartbeat.\n\nIn the distance they hear howls - and then silence again. \n\nThe creature begins to fade - Dallas turns the dial into another frequency range and waits until it is asleep. \n\nMAKAYLA\n(to Dallas)\nWhat does that do?\n\nDALLAS\n(whispering)\nIt changes the frequency I am broadcasting.\n\nMAKAYLA\nWhy are you broadcasting?\n\nDALLAS\nI'm trying to get a response.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe two look at the creature on the table. \n\nMAKAYLA\nIt looks like the creature is responding to it.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nMakayla looks at Dallas and then at the creature and pulls out a small prototype from her backpack. \n\nThe two look at each other for a moment.\n\nDALLAS\nWhat is that?\n\nMAKAYLA\nAn amplifier.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nShe turns to the creature and turns it on. The creature starts to wiggle.\n\nBehind the creature's smooth sine wave, a second signal appears—jagged, arrhythmic. It pulses in sharp, irregular bursts, riding underneath the creature's frequency like static beneath music.\n\nMAKAYLA\nThat's not coming from the creature. That's drawing from outside.\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe group looks at the creature and then at the oscilloscope and then at the sway of the tall grass outside. \n\nMAKAYLA\nDallas - I have to show you something.\n\n---\n\n\n### Scene 14B: The Field Journal\n\n*ACT II — The Creature | ID: the-field-journal | File: s14b.md*\n\n---\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n# SCENE 14B : #####\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\nSCENE 14B: THE FIELD JOURNAL\n\n\ns14B.1 — EXT. DALLAS BACKYARD — OLD PICNIC TABLE — CONTINUOUS\nMakayla and Dallas sit in silence. Asher, a few feet off, threads beads onto a long string — one bead for every listening post he and Makayla have staked out in the marsh. The quantity matters; we just don't know why yet.\n\nMakayla reaches into her backpack and pulls out a soft-covered field journal. The cover is warped from water, held together with a rubber band. She doesn't open it right away. She holds it in her lap.\n\nMAKAYLA\nMy mom's. \n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nShe sets it on the picnic table between them. Dallas looks at it but doesn't touch it.\n\nMAKAYLA\nYou can look.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas opens it. The first pages are careful — a woman's handwriting, pencil sketches of the marsh, dated entries. \nObservations. Frequencies. \n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA small drawing of a Golden creature in the margin — recognizable. Similar to the one in his kitchen.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas turns the page. The handwriting changes. Younger. Messier. Makayla's. Then Asher's geometric doodles. The sketches get more detailed. Different Golden creatures at different sizes.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas turns another page and stops.On the left side of the spread: a Golden creature, curled, peaceful. On the right side: the same body — same proportions, same ears, same frame — but wrong. Transparent fur. Black veins under the skin. Eyes, where there weren't eyes before. Red.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAn arrow between them. No words.\n\nDALLAS\n(quiet)\nWhat am I looking at?\n\nMAKAYLA\nThat's what I wanted to show you.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas stares at the page. His thumb traces the arrow.\n\nDALLAS  \nThey're the same.\n\nMAKAYLA\nThey're the same.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA beat.\n\nDALLAS\nOne turns into the other?\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nMakayla looks at Asher. He's stopped threading. He's listening, but not looking up.\n\nMAKAYLA\nDon't know for sure. \n\nDALLAS\nWhat's your guess?\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nMakayla doesn't answer right away. She picks at a splinter on the picnic table.\n\nMAKAYLA\nWhen they get hurt. They change.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas looks toward the kitchen window. Toward the creature inside.\n\nDALLAS\nThe one I found was injured.\n\nMAKAYLA\nI know.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA gust of wind moves through the tall grass at the edge of the property. Asher's head turns toward it. Just slightly.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas closes the journal carefully.\n\nDALLAS\nYour mom saw one? \n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nMakayla doesn't answer.\nThe wind picks up again. In the far distance, barely audible — not quite a howl, not quite a hum. Something in between.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher stops threading.\n\nASHER\n(quietly, to himself)\nThey're listening.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nMakayla and Dallas both turn to him. He doesn't elaborate. He goes back to his beads.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nMakayla picks up the journal and slides it back into her pack.\n\nMAKAYLA\nWe should go inside. Check on it.\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nThey stand. Dallas glances back at the tall grass one more time before following her in.\n\n---\n\n\n### Scene 14C: The Almost Discovery\n\n*ACT II — The Creature | ID: the-almost-discovery | File: s14c.md*\n\n---\n\n<!-- scene: 14C file: s14c.md nickname: the-almost-discovery -->\n\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\nINT. DALLAS HOUSE – LATE AFTERNOON (s14c.1)\n\nLate-day light leaks through the kitchen blinds. The creature is hidden beneath a towel inside the makeshift enclosure. A SOFT, IRREGULAR HUM bleeds faintly into the room.\n\nMakayla stands rigid at the counter, tightening a cable connection.Asher sits cross‑legged on the floor, threading beads. His fingers pause.\n\nA KNOCK at the door.\n\nAll three freeze.\n\nAnother knock—cheerful.\n\nDOMINIC (O.S.)\nDallas? You home? I think you might have our step ladder.\n\nMakayla and Dallas exchange a look. Asher begins tapping his fingers faster.\n\nINT. DALLAS HOUSE – FRONT ENTRY – CONTINUOUS (s14c.2)\n\nDallas opens the door. Dominic stands there, winded.\n\nDOMINIC  \nThere he is! Hey—sorry to bug you. The storm knocked something loose on our gutter.\n\nDallas forces a smile.\n\nDALLAS  \nWeather’s been strange.\n\nDOMINIC  \nTell me about it—Pat’s already texting doom.\n\nThey share a short laugh. The HUM beneath the house deepens—to almost imperceptible.\n\nDominic tilts his head.\n\nDOMINIC  \nYou hear that?\n\nDALLAS  \nHear what?\n\nDominic listens another beat. Shrugs.\n\nDOMINIC  \nProbably my sinuses. Allergies. Or ghosts.  \n\n(then)  \nMind if I set the ladder by your fence?\n\nDALLAS  \nSure.\n\n---\n\nINT. DALLAS KITCHEN – CONTINUOUS (s14c.3)\n\nDominic steps inside. The HUM vibrates a glass of water on the counter—just enough to ripple.\n\nMakayla slides between Dominic and the enclosure casually.\n\nMAKAYLA  \nHey Dom.\n\nDOMINIC  \nOh—hey kiddo.\n\nHe eyes the equipment scattered around.\n\nDOMINIC  \nWow. Place looks like NASA threw up.\n\nDALLAS  \nWork stuff.\n\nDOMINIC  \nYou educators—always overprepared.\n\nAsher’s bead string slips from his fingers and CLATTERS to the floor.\n\nDOMINIC  \nHey buddy.\n\nAsher doesn’t respond.\n\nDominic steps once more toward the counter—toward the towel.\n\nMakayla moves **immediately**.\n\nMAKAYLA  \nSo—uh—weren’t you fixing the porch light too?\n\nDOMINIC  \nYeah—\n\nThe creature STIRS beneath the towel. A muted WHIMPER—felt more than heard.\n\nThe oscillators flicker GOLD for half a second.\n\nDominic freezes.\n\nDOMINIC  \nOkay. That—\n\nMakayla reaches out and SLAMS a power switch. Darkness. Silence.\n\nA beat.\n\nDOMINIC  \n…Storm’s coming quick.\n\nMakayla smiles too fast.\n\nMAKAYLA  \nWe should all stay inside tonight.\n\nDominic nods slowly. Something unsettled—but unspoken.\n\nDOMINIC  \nYeah.  \n(then, lighter)  \nAlright—ladder can wait. Dinner smells like it’s burning anyway.\n\nHe turns to leave.\n\nAt the door, Dominic pauses.\n\nDOMINIC  \nDallas?\n\nDALLAS  \nYeah?\n\nDOMINIC  \nIf you ever need help—  \n(gestures vaguely)  \n—with whatever this is… just ask.\n\nDallas nods.\n\nDominic leaves.\n\nSilence.\n\nAsher finally exhales.\n\nASHER  \n(quiet)\nThat was close.\n\nMakayla doesn’t answer. She stares at the towel—at the faint GOLDEN GLOW bleeding through.\n\n---\n\n\n### Scene 15A: The Failed Test\n\n*ACT II — The Creature | ID: the-failed-test | File: s15a.md*\n\n---\n\n<!-- scene: 15A file: s15a.md nickname: the-failed-test -->\n\n\n\n---\n\n\n### Scene 15B: Makayla's Tracking Box\n\n*ACT II — The Creature | ID: the-tracking-box | File: s15b.md*\n\n---\n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n# Scene 15: Makayla's Tracking Box\n\n<!-- s15b -->\n<!-- FILMING ON DAY 4 -->\nEXT. NEIGHBORHOODS - EVENING (s15.1)\nThe crew walk towards the neighborhood and begin the long process of making their journey down golden hour filled woodland area - as they approach a big field open field. At the end of the field are some tall trees. Dallas stops and peers around. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nAs they cut through the reeds, Makayla and Asher stop every so often to press small devices down into the mud at the base of the stalks. Each one blinks a slow, faint amber as it powers on. \n\nDallas watches a scatter of them pulse in the dusk.\n\nDALLAS\nFireflies?\n\nMAKAYLA\nListening posts. We've been seeding the whole marsh — every spot the hum has ever touched. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nAsher trails a step behind. Each time one of the nodes blinks to life, he threads a single bead onto the string around his neck. One bead, one node. He never miscounts. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nThe crew walk into the field and find a small wooden chest on the ground, hidden beneath a field of tall grass. \n\nEXT. MAKAYLA'S SPECIAL WOODED SPOT - CONTINUOUS (s15.2)\nAs they approach the structure, they can see that it is a small wooden structure hidden by fallen trees and branches. \n\nInside the structure there is a wooden box. Makayla opens it. Inside there are various trail cameras and recording equipment. On the bottom of the box, Makayla pulls out various cables and wires connected to a  small crystal. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nMakayla walks over and turns the device on. It lights up. \n\nMAKAYLA\nBatteries will die soon.\n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nDallas looks confused at the wiring. \n\nMAKAYLA\nDon't worry Mr. Dallas - soon you'll hear all about my brother's inventions - they are going to change the world... He just needs to rest a bit. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nDallas looks at one of the inventions on the ground. \n\nMAKAYLA\nDo you believe that things happen for a reason?\n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nDallas reamins still, not ma
