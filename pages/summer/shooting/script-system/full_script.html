  <script>
    const markdown = "# Creatures in the Tall Grass Script — Full Script\n\n*Compiled on 6/11/2026, 11:58:53 AM*\n\n---\n\n\n## ACT I — Arrival & Discovery\n\n---\n\n\n### Scene 0A: Opening Montage\n\n*ACT I — Arrival & Discovery | ID: opening-montage | File: s00a.md*\n\n---\n\n<!-- scene: 0A file: s00a.md nickname: opening-montage -->\n\n## OPENING MONTAGE\r\n\r\nEXT. BRANFORD TRAIN STATION - EARLY MORNING (s00a.1)\r\n\r\nAn empty platform. The Long Island Sound visible beyond the station house — gray water, distant shoreline. A single train pulls away, its last car disappearing around the curve.\r\n\r\nDallas stands alone on the platform. Mid-30s, worn canvas jacket, a single suitcase beside him. Not lost. Displaced. He's been displaced a lot. He picks up the suitcase and walks toward the station exit without looking back.\r\n\r\nEXT. BRANFORD STREETS - CONTINUOUS (s00a.2)\r\n\r\nSalt air. Low houses with white trim and weathered fences. Dallas walks through the neighborhood, suitcase in hand. His eyes take in the scale of the place — smaller than he expected. Quieter.\r\n\r\nHe passes a street sign: Harbor View Lane.\r\n\r\nEXT. BRANFORD - MARSH FENCE - CONTINUOUS (s00a.3)\r\n\r\nWide shot. Dallas approaches the rental house from the far side of the property. The house is visible through a gap in the tall grass. He stops at the fence line. His eye catches on the tall reeds that mark the edge of the yard.\r\n\r\nSomething pulls his attention there. He doesn't know why yet.\r\n\r\n---\r\n\r\nINT. MARSH EDGE - CONTINUOUS (s00a.4)\r\n\r\nTight close-up. Fingers pressing a trail camera into the bark of a dead oak. The fingers are careful, deliberate. Practiced.\r\n\r\nPull back. ASHER, 14, kneels at the base of the tree. His eyes are focused on the camera placement. No wasted movement.\r\n\r\nA boom pole lies in the grass beside him. He picks it up and assembles it piece by piece. Each segment seats with a small click. His movements are methodical. He has done this a hundred times.\r\n\r\nINT. MARSH EDGE - LATER (s00a.5)\r\n\r\nAsher's hand traces a pattern through the soft ground. He is outlining a perimeter for a small hole. He takes a folding trowel from his pack — small, military-issue, designed for digging in tight spaces.\r\n\r\nHe begins to dig. The blade cuts into the marsh soil. Every few strokes he stops and watches the tree line.\r\n\r\n---\r\n\r\nEXT. BRANFORD STREETS - CONTINUOUS (s00a.6)\r\n\r\nWide shot. Dallas walks through the residential streets. A parked car. A mailbox with the address he's been looking for. The house is getting closer.\r\n\r\nHe is not thinking about the house yet.\r\n\r\nINT. MARSH EDGE - CONTINUOUS (s00a.7)\r\n\r\nClose-up. Asher's hands work a piece of equipment into the hole he has dug. It is small, circular, with a microphone array. An acoustic trap. He covers it with damp soil, then with a thin layer of leaf litter and moss, troweled so carefully that the ground looks undisturbed.\r\n\r\nHe sits back. His hands are still.\r\n\r\nA beat.\r\n\r\nHe stops. His hand hovers over the next piece of equipment. His head tilts.\r\n\r\nHe is listening to something.\r\n\r\n---\r\n\r\nINT. MARSH EDGE - CONTINUOUS (s00a.8)\r\n\r\nAsher has frozen. His finger is mid-trace on his other palm.\r\n\r\nA beat longer.\r\n\r\nNo words. No names. No explanation.\r\n\r\nHe has heard it before. His body remembers the sound without needing to hear it again.\r\n\r\nIt is back.\r\n\r\n---\r\n\r\nEXT. RENTAL HOUSE - BACK YARD - CONTINUOUS (s00a.9)\r\n\r\nWide shot. Dallas has arrived. He stands at the far edge of the property, looking at the front of the house. Taking in the scale, the condition, the fact of it.\r\n\r\nHe sets down his suitcase.\r\n\r\nHis eye drifts to the tall grass at the edge of the property. The reeds that border the marsh. The line where the yard ends.\r\n\r\nSomething in the movement of the grass. Or the stillness of it.\r\n\r\nHe watches for a moment without moving.\r\n\r\nThen he picks up his suitcase again and walks toward the front door.\r\n\r\nEND SCENE 0a\n\n---\n\n\n### Scene 0B: Property Manager\n\n*ACT I — Arrival & Discovery | ID: property-manager | File: s00b.md*\n\n---\n\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\nINT. RENTAL HOUSE - FRONT DOOR - DAY (s00b.1)\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe front door opens inward. A small foyer with scuffed hardwood. To the left, a living room where cheap furniture sits pushed against the walls in no particular order. A futon frame without a mattress leans in a corner. Empty beer cans on the floor by the baseboard.\r\n\r\nThe PROPERTY MANAGER, early 40s, stands in the doorway, holding a clipboard and keys. He is already talking before Dallas has fully stepped inside.\r\n\r\nPROPERTY MANAGER\r\nOkay Branford rental unit #72 let's see what you got. Right, so— front door sticks a little in the winter, not enough to replace it. Heat works. Water works. Hot water takes, I don’t know, twenty seconds upstairs, thirty seconds down? Pressure’s good. Pipes are old but they work.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas enters.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager nods, moving before Dallas has entered fully. \r\n\r\nPROPERTY MANAGER\r\nKitchen’s through here. Stove runs a little hot, refrigerator’s electric, older unit, holds temperature. Dishwasher works but I wouldn’t load it like a restaurant. Sink goes hot cold - cold hot - you know the deal. Previous tenant all of that in the corner I asked him to take it out before you came. I apologize for that.\r\n\r\nINT. RENTAL HOUSE - KITCHEN / BACK WINDOW - CONTINUOUS (s00b.2)\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThey enter the kitchen. Dallas stops at a window that faces the backyard. Through the glass, tall reeds and grass. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager notices Dallas looking.\r\n\r\nPROPERTY MANAGER\r\nBackyard’s small but there’s grass. You can see it from here, but there’s no direct access from the kitchen. You have to go around and down.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nHe points toward a narrow back stairway.\r\n\r\nPROPERTY MANAGERDown and around. \r\n\r\nEXT. BACKYARD\r\n\r\nPROPERTY MANAGER\r\nCareful on the steps. They get slick when it rains.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager and Dallas walk through the backyard up to the porch that doesn't connect to the kitchen. They look out to the distance for a beat. \r\n\r\nPROPERTY MANAGER\r\nBranford’s got a little bit of everything. Water, woods, old houses. New Haven’s close when you need it... There’s water beyond the brush. Tidal stuff, mostly. Salt marsh, drainage, edge of the river, depends who’s asking. Egrets, herons, osprey. Herons sound terrible at night, but that’s normal. We get a couple of big storms in the season and we might have one on the way - but I think we’ll be okay. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager flips through his clipboard.\r\n\r\nPROPERTY MANAGER\r\nRoof’s not new-new, but it’s not a problem. Electrical should be okay. Upstairs has the three main bedrooms — one is yours. Other tenants are out of town, back home, I think. Should be back in September or October. You’d like these guys. Post-docs at Yale. Quiet. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nA beat. The property manager lowers the clipboard slightly.\r\n\r\nINT. RENTAL HOUSE - UPSTAIRS HALLWAY - CONTINUOUS\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe hallway is narrow. Doors on either side. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager points as they pass.\r\n\r\nPROPERTY MANAGER\r\nBathroom there. Your room at the end. Other two are theirs. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas stops walking and looks at one door in particular.  \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager notices.\r\n\r\nPROPERTY MANAGEROh. Right. Attic.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nHe checks the clipboard.\r\n\r\nPROPERTY MANAGER\r\nNot finished currently. Storage, only. Landlord approves use. I don't think the other tenants use it much. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas moves toward the door and up the stairs.\r\n\r\nPROPERTY MANAGER\r\nOkay. Yeah. There it is.\r\n\r\nINT. RENTAL HOUSE - ATTIC - CONTINUOUS\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nLow wood joists. Bare plywood floor. A small window at one end throws gray light across the space. The ceiling is higher than expected. Quiet. \r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas steps into the center of the attic.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nThe property manager stays below.\r\n\r\nPROPERTY MANAGER\r\nI’m not sure if there’s insulation or — are you seeing anything up there? We can get you the landlord’s contact. I told him to let me know.\r\n\r\n<!-- scene: 0B file: s00b.md nickname: property-manager -->\n\n(action)\nDallas doesn’t answer.\n\n---\n\n\n### Scene 1: Arrival & Discovery\n\n*ACT I — Arrival & Discovery | ID: arrival | File: s01.md*\n\n---\n\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n<!-- nickname: arrival -->\r\n\r\n##s01 - Arrival \r\n<!-- FILMING ON \r\n6.7.26 -->\r\nEXT. DALLAS NEW HOUSE - DAY (s01.1)\r\n\r\nDallas stares at the Tall Grass outside his house as he unloads boxes from a big pile. Dallas scans the new backyard, there are some old rusty lawn furtniture and a picnic table that seems to be adjacent to a fence of grass \r\n\r\nDallas goes into the edge of his backyard a little bit. He stops. At the edge of the reeds is a jagged, dead patch of earth—a circle of brittle, colorless grass where nothing grows. In the center of it, a single wooden stake has been driven into the ground, but it’s been snapped off, the top half gone. \r\n\r\nAs Dallas examines the broken wood, he hears a distinct bicycle ring.\r\n\r\nASHER\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nAsher, 14, approaches on his bike. He stops at the edge of the driveway and watches Dallas for a while.\r\n\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nOne of the boxes draws his curiosity. He inches his bike closer and watches Dallas pull out a military grade Oscillator.\r\n\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nAsher stares at the device. His headphones are on. He doesn't move.\r\n\r\nDALLAS\r\nHello.\r\n\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nAsher doesn't answer. His eyes stay on the Oscillator. Asher stands silent, tracing a pattern on his palm. He doesn't look up.\r\n\r\nDALLAS\r\nIt works. \r\n\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nDallas hold his hands out with the Oscillator for Asher to see. Asher looks at the Oscillator a beat longer. Then he looks at the tall grass at the edge of the yard. Then back at the Oscillator.\r\n\r\n<!-- scene: 1 file: s01.md nickname: arrival -->\n\n(action)\nHe turns his bike around and pedals away.\r\n\r\nDallas looks down at a box of old equipment and stretches down to pick it up. \r\n\r\nEND S01\n\n---\n\n\n### Scene 2: Sierra's Box\n\n*ACT I — Arrival & Discovery | ID: dallas-night | File: s02.md*\n\n---\n\n<!-- scene: 2 file: s02.md nickname: dallas-night -->\n\n# Scene 2: Sierra's Box\r\n<!-- summary: Can't sleep. Golden flicker in the grass. He opens Sierra's box; the hum starts; the battery dies. -->\r\n\r\n<!-- Filming On  6.9.26 @ Jerry's House  -->\r\n\r\nINT. DALLAS KITCHEN - SUNSET (s02.1)\r\nDallas looks at his new surroundings. He peers through the window outside. As he does a faint hum is heard - he takes out the oscillator and marks down the frequency - and then the hum stops. He stares for a while.\r\n\r\nDallas hasiltly brings forth a frozen pizza. As Dallas eats, as the TV glares in the background - a weatherman on screen talks about the upcoming tropical storm season in Branford. \r\n\r\nA noise is heard off screen. \r\n\r\nEXT. DALLAS DRIVEWAY (s02.2)\r\nDallas goes outside and stares for a while at the edge of his property. After this he walks down the street and stares for a good while - almost at an invisible spector - and then - faintly - the hum merges. \r\n\r\nDallas slowly walks backwards towards his house and then stops when the humm grows louder. Dallas takes out his portable audio recorder. \r\n\r\nINT. DALLAS NEW HOUSE - ATTIC - NIGHT (s02.4)\r\nDallas walks in again and looks again at his new place. He looks at the windows, he looks at the doors, he looks at the cielings. He walks towards a group of large moving boxes scaterred in the center of the living room. \r\n\r\nDallas opens up the box labelled \"Field Notes - Branford\" to find sketches of butterflies and caterpillars and scattered drawings of curious insects. As he turns the pages, the butterflies seem to morph into creatures with wings.  Angels.  He flips through some of the pages, some containing sketches of the grass and a golden creature. And a bunch of math. Dallas closes it.\r\n\r\nDallas reaches again for the bottom of the box, covered in dust, sumberged by cables, Dallas finds a pair of retro, ruby-red headphones. Next to the headphones is a small casette player. On the back of the player, Dallas peels back a piece of duct tape to reveal a photo sticker. A photo of Dallas and a woman, both sporting heavy audio headsets, laughing as they capture noise in a field of grass. Dalla's thumb rushes over her face. \r\n\r\nDallas walks over to the ruby red casette player - he thumbs over the play button fails to do so. \r\n\r\nDallas gently closes the box of headphones and gear. He takes a deep breath and opens up another box laying adjacent. He carefully pulls out a heavy military-grade desktop audio recorder, another portable audio recorder, and a small portable Oscillator on his desk. \r\n\r\nINT. DALLAS BATHROOM - NIGHT (s02.5)\r\n<!-- ANOTHER DAY than june 9th -->\r\n\r\nDallas takes a shower - and as he zones out from the sounds of the hot water, a faint hum interrupts from the far outside. \r\n\r\nAs he takes a shower the audio tape of the ruby red cassette player fills the room. It is of a woman and her field notes and also her song.  As it plays and as Dallas continues to mourn in the shower, he begins to hear a faint hum interrupt from the far outside. \r\n\r\nDallas dries off, stops the tape, and peers through the steam of the bathroom window. The hum grows louder. \r\n\r\nINT. DALLAS DOWNSTAIRS - NIGHT (s02.6)\r\nDallas rushes downstairs as the hum grows louder. Dallas, recorder in hand, scrambles toward the window and brings to record. The needle spikes. \r\n\r\nDallas  begins to adjust the dial - and begins to hear a whimpering faint, pure, harmonic tone. The sound abrutly stops. And then it starts up again. The sound abrutly stops. And then starts up again. This time in a pulsing pattern. Dallas looks at his watch and begins to time it. One Second. Stop. One second - top. Five seconds. Three seconds. \r\n\r\nSuddenly hum sounds like it is moving away and its loudness begins to grow faint. Looking down at the his recording, Dallas notes a spike in the waveform on the low frequency range. \r\n\r\nThe battery dies on the recorder. Dallas smacks the back in fustration. Scrambling, he tears through a box of equipment for but none of them have batteries. \r\n\r\nFrustrated, Dallas abandones the equipment and heads for the door. \r\n\r\nEXT. DALLAS HOUSE - NIGHT (s02.7)\r\n\r\nDallas stands alone watching the tall grass sway agaisnt the salt breeze. Coyotes howl in the distance and the hum decreases in scale and size as the starry night disappears into the distance of the tall marsh grass. He sees a faint golden glow pulse once, twice, five times, three times. \r\n\r\nIn the distance a thunderstorm brews.\n\n---\n\n\n### Scene 2: Branford at Night Montages\n\n*ACT I — Arrival & Discovery | ID: branford-night-discovery | File: s02.3.md*\n\n---\n\n<!-- scene: 2 file: s02.3.md nickname: branford-night-discovery -->\n\n# Scene 2.3: Branford at Night Montages\r\n<!-- summary: Dallas walks around Branford at night with a recorder, discovering the weirdness of the neighborhood and tall grass. -->\r\n\r\n<!-- Filming On  6.7.26 @ Branford  -->\r\n\r\nEXT. BRANFORD AT NIGHT MONTAGES (s02.3)\r\n\r\nDallas walks around at night with a recorder in his hand. As he walks along the different coastal neighborhoods - as he stops by a particular puzzling patch of tall grass - he takes big deep breath and pulls out his recorder. He records the sounds of the ocean. \r\n\r\nOn the way home - he records the breeze of the tall grass.\n\n---\n\n\n### Scene 3: The Hum\n\n*ACT I — Arrival & Discovery | ID: the-hum | File: s03.md*\n\n---\n\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n<!-- nickname: Meet the Neighbors -->\r\n<!-- FILMING ON - DAY 9 = 6.20.26 -->\r\nEXT. DALLAS HOUSE - NEXT DAY MORNING (s03.1)\r\nDallas walks outside his house, towards the edge of the property. As he approaches the edge of his yard he watches the tall grass sway in the wind. He looks at the grass for a beat too long, as he nurses the audio recorder in his hand. As he does so, he becomes dazed.\r\n\r\nAs Dallas dazes onward, a man approaches him from the sidewalk near his house. \r\n\r\nDOMINIC AMARANTO, early 40s, wearing a bright salmon covered short sleeve button walks up to Dallas with vigor. \r\n\r\nDOMINIC\r\nNeighbor!\r\n\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDallas looks up at Dominic. \r\n\r\nDOMINIC\r\nMy beighbor, neighbor - you're my neighbor - I think we're neighbors - I saw the light on last night - my friends live here - how did they leave it? You a post doc at Yale? \r\n\r\nDALLAS\r\nQuinnipiac.\r\n\r\nDOMINIC\r\nOkay - names Dominic. \r\n\r\nDALLAS\r\nDallas. \r\n\r\nDOMINIC\r\nYou here on some university position? Last guy who was here was here for 3 years and then moved on to better things up in Guilford. How is the house? Do they furnish it?  They gave you a house nice man. \r\n\r\nDALLAS\r\nYeah. \r\n\r\nDOMINIC\r\nYou said your name was Dallas, Dallas? Dallas, what a name - where you from? \r\n\r\nDALLAS\r\nIndiana.\r\n\r\nDOMINIC\r\nIndyANNA - far from Branford. \r\n\r\nDALLAS\r\nYeah.\r\n\r\nDOMINIC\r\nWhat you know about Branford?\r\n\r\nDALLAS\r\nNot much. \r\n\r\nDOMINIC\r\nWell okay. What's your field?\r\n\r\nDALLAS\r\nBioacoustics. \r\n\r\nDOMINIC\r\nBio-acoustics. Yeah.Right on. Alright listen - I'm about to head to the town green right now - you up for a walk? My car is parked down in the center of town and I need to go get it... What's that in your hand?\r\n\r\nDALLAS\r\nAn oscillator. I was going to go into town to get some new batteries.  \r\n\r\nDOMINIC\r\nOkay perfect - we'll go together. \r\n\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDallas nods and Dominic leads the way as the two begin their trek towards Brandford town green. \r\n\r\nEXT. BRANFORD NEIGHBORHOOD - MOMENTS LATER (s03.2)\r\n\r\nDallas and Dominic begin to walk down the sidewalks towards town. \r\n\r\nDOMINIC\r\nYou don't have a car?\r\n\r\nDALLAS\r\nNo - no car.\r\n\r\nDOMINIC\r\nYeah. Me neither - well I do, but it's not mine and mainly for getting Mr. Mike around. \r\n\r\nEXT. TOWN BRANFORD MONTAGE (s03.3)\r\n\r\nDallas and Dominic through coastal sidewalks, neighborhoods, and natural marsh fences. As they approach one patch of tall marsh grass in particular, Dallas stops.\r\n\r\nDallas, checks if Dominic is looking and when he isn't - he takes records a bit with the audio recorder and points it's microphone toward the grass. \r\n\r\nDOMINIC\r\n(spotting Dallas)\r\nBe careful - I heard some coyotes up in that the other night when I was out walking. Some people say the noises are from owls - but I know its coyotes. \r\n\r\nEXT. TOWN CENTER - DAY (s03.4)\r\nDallas and Dominic walk toward a small hardware store. \r\n\r\nINT. HARDWARE STORE (s03.5)\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDominic waves to the unfriendly man at the counter and brings Dallas to the battery section. Dallas also buys some audio cassettes. \r\n\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDallas finds the correct batteries and grabs it off the shelf. The two exit the shop.\r\n\r\nEXT. BRANFORD GREEN (s03.6)\r\n\r\nDallas and Dominic walk past the town green. The building looks closed. Dominic stops dead. A neon orange ticket flutters under his windshield wiper.\r\n\r\nDOMINIC\r\nOh, this is great. Cool. \r\n\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDominic rips the ticket off and walks around to see if anyone is looking, he crumbles it up and puts it in his pocket. He exhales slow, shakes his head, and lets it go. \r\n\r\nDominic bends downs and grabs a key from the bottom of the car and starts it up. \r\n\r\nINT. DOMINIC'S CAR (s03.7)\r\n\r\nDominic opens the car and gestures Dallas to get in - non-chalantly the parking ticket in the glove box. \r\n\r\nDOMINIC\r\nYou hungry?\r\n\r\nDALLAS\r\nYeah. \r\n\r\nDOMINIC\r\nGood -  my church is doing a picnic on the lawn series - we should go - I'm on cleanup duty and got to lock up when they are done. You want to come for the ride? \r\n\r\nDALLAS\r\nSure. \r\n\r\n<!-- scene: 3 file: s03.md nickname: the-hum -->\n\n(action)\nDominic drives towards the church lawn. \r\n\r\nDOMINIC\r\nNice - yeah - it's nice to be the new guy in town - good old Branford.\n\n---\n\n\n### Scene 4: The Fellowship\n\n*ACT I — Arrival & Discovery | ID: fellowship | File: s04.md*\n\n---\n\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n<!-- nickname: fellowship -->\r\nEXT. CHURCH FELLOWSHIP LAWN - LATE AFTERNOON (s04.1)\r\n\r\n<!-- FILMING ON\r\n7.5.26 -->\r\n\r\nDallas and Dominic arrive at CPC and find themselves in heat of a picnic. Children are running, friends down light summerwear as they play spike ball, and church goers find themselvees are on a long line for food. \r\n\r\nDallas looks around at all of the new faces but does not make great eye contact. Dominic takes a deep breath and approaches the long line. \r\n\r\nDominic carries a package of water and puts it under one of the fold up tables. As he does so, people look at Dallas and begin to greet him. \r\n\r\nDOMINIC\r\nLine is long today - they must got Nicas. Everyone's downing what they can before the storm. \r\n\r\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAs they wait in line, people begin to turn around and talk to them. One lady, MARY, 55 turns around and shakes Dallas' hand enthusiastically.\r\n\r\nMARY\r\nWell hey there sunshine - what's your name?\r\n\r\nDALLAS\r\nDallas\r\n\r\nMARY\r\nDallas... Dallas, Dominic where did you get this Califorina boy from? My name is Mary - do you like chicken primevera?\r\n\r\nDALLAS\r\nNever really had it.\r\n\r\nMARY\r\nWell you should, its great.... So you ready for some proper New England weather?\r\n\r\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAnother turns around and greets Dallas. An older gentleman PAUL WILDLY, 72, approaches. \r\n\r\nPAUL\r\nThey claim it'll be historic. Apparently, we haven't had a storm like this since 1971 when Nixon took the US off the gold standard. Paul, nice to meet you. \r\n\r\nDALLAS\r\nDallas. \r\n\r\nPAUL\r\nNow, where are you from?\r\n\r\nDALLAS\r\nIndiana\r\n\r\nPAUL\r\nOo - then you must know of William Henry Harrison - our 9th president, served as Indiana's governor back when it was just a terriority. \r\n\r\nMARY\r\nPaul, stop that. Honey - if you need I can make you some chicken primevera tonight. \r\n\r\nDOMINIC\r\nHe's okay, Ms. Mary thank you. \r\n\r\nDALLAS\r\nThank you. \r\n\r\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nDallas and Dominic sit in a circle of folded pull up chairs. \r\n\r\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAsher approaches from afar to the line. \r\n\r\nDOMINIC\r\nDallas, this is my little brother - Asher.\r\n\r\n<!-- scene: 4 file: s04.md nickname: fellowship -->\n\n(action)\nAsher doesn't make direct eye contact with Dallas but fakes a polite smile. He taps his headphones and looks toward the far end of the church lawn. Between the bushes and garden. \r\n\r\nHe leaves the line and walks over to a corner spot by the end of the church yard and huddles over a pile of brush.\r\n\r\nAsher takes some cables out of his backpack - and begins to assemble, what looks like an audio recorder on a boom pole. \r\n\r\nHe points the recorder in the direction of the bushes and holds it there. \r\n\r\nDallas takes a bite of his chicken but doesn't eat much. He's distracted by what Asher is pointing at in the distance.\n\n---\n\n\n### Scene 5: The Merlin App\n\n*ACT I — Arrival & Discovery | ID: marsh-walk-later | File: s05.md*\n\n---\n\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n# Scene 5: The Merlin App\r\n<!-- summary: Boardwalk through the reeds. They hear birds andSomething moving in the marsh. -->\r\n\r\n<!-- FILMING ON - DAY 4 = 6.13.26 -->\r\n\r\nEXT. MARSH TRAIL - LATER (s05.1)\r\nThe sun is dipping. Dallas and Dominic walk back home - along a wooden boardwalk that cuts through the tall, golden-yellow reeds.\r\n\r\nDominic and Dallas walk quietly for a while. Dominic looks out to the tall grass.\r\n\r\nDOMINIC\r\nMy brother is always out here planting down cameras. Geotagging or something. I don't know. \r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nThe two hear a distant cry - that could be a bird. Dallas looks at Dominic.\r\n\r\nDOMINIC\r\n(to himself)\r\nYeah.\r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDominic pulls out his phone, tapping an app.\r\n\r\nDOMINIC\r\nHey check this - It listens to the chirps and tells you the species. Some nice sounds here - Egret, those little Piping Plovers, the mighty offspree, I love them - I love them all. it if you're working at Quinnipiac you should get this. \r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDominic struggles to get the app to work and begins to pace a bit. \r\n\r\nDOMINIC\r\nYeah - I like the birds - I like the sounds they make - I thought about how to write them down. And then I never thought much past it. I'm 'writing now - but something else - I don't got much time. ' one day I'll tell a story of these marlins.\r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nHe takes a slow, deep breath, collecting himself.\r\n\r\nDOMINIC\r\n(in anger)\r\nSometimes I wonder if this all is just make believe.\r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDallas looks onward empathically. \r\n\r\nDALLAS\r\nWhat do you mean?\r\n\r\nDOMINIC\r\nThis whole existence - being alive - its so overwhelming and then boom - you are gone. \r\n\r\nDALLAS\r\nYeah.\r\n\r\nDOMINIC\r\n(to himself)\r\nBoom - Gone. \r\n\r\n<!-- scene: 5 file: s05.md nickname: marsh-walk-later -->\n\n(action)\nDallas and Dominic walk slowly and Dallas looks out to the tall grass for a while.\n\n---\n\n\n### Scene 6: News Vans\n\n*ACT I — Arrival & Discovery | ID: news-vans | File: s06.md*\n\n---\n\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n# Scene 6: News Vans\r\n<!-- summary: News vans in the street. Pat on camera. Marks on Dominic's driveway. Dallas strays and stays. -->\r\n\r\n<!-- FILMING ON = DAY 9 = 6.20.26 -->\r\n\r\nEXT. BRANFORD NEIGHBORHOOD - CONTINUOUS (s06.1)\r\n\r\nDallas and Dominic reach back to their neighborhood. Outside, nestled between their house, three news vans are parked haphazardly. \r\n\r\nDominic parks the car and the two get out to see. \r\n\r\nPAT CLENDENEN, MID 50s, is outside their house in front of news cameras. \r\n\r\nPAT CLENDENEN\r\n(to camera)\r\nThanks Micky, Out here today in my hometown of Branford, CT. Pretty excited to be back home. So if you are in anywhere in costal connecticut, all the way up to Rhode Island today, some parts of southern mass all the way towards Boston. This is New England weather for you, always unpredictable - always on the bleeding edge....So in that spirit, today we'll see sun to clouds, breezy, warm with a late day shower possible. But the real attention - and the reason we are here - is to bring attention to a possible development along the shores.... We are staying on top of a trend through the rest of this week - as any shift could dramatically impose a threat - this costasl community. act the entire state. The european models are showing signings that we might be in for a big one and while we're all hoping the Nor'easter stays out at sea, the current models suggest a wild weekend for the shoreline. \r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic scoffs as they walk past.\r\n\r\nDOMINIC\r\nPat's been predicting the end of the world every Tuesday for ten years.\r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nThe camera cuts. Pat notices Dominic and waves at him from afar. \r\n\r\nPAT CLENDENEN\r\nDominic! See you Thursday! \r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic waves back at Pat. He looks at Dallas and shrugs. The two continue past the news vans.\r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nThe wind gusts, catching a news umbrella and nearly toppling it. The hum in Dallas's pocket recorder spikes for a split second.\r\n\r\nEXT. DOMINIC'S HOUSE (s06.2)\r\n\r\nThey arrive back at Dominic's. Two large plastic trash bins are sprawled across the driveway, trash strewn everywhere.\r\n\r\nDOMINIC\r\nLook at this. Those raccoons! \r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic takes a slow breath.\r\n\r\nDOMINIC\r\nI try to do the right thing and I keep getting kicked. \r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDominic kicks a stray milk carton. He looks at the garbage cans around his house, then at Dallas.\r\n\r\nDOMINIC\r\nListen, I got to get the furniture before life group tonight. I got to go check on Mike and bring in another fan from the basement. You good? \r\n\r\n<!-- scene: 6 file: s06.md nickname: news-vans -->\n\n(action)\nDallas notices a patch of grass at the edge of the drive that has gone dead and brittle, flattened into a rough circle. He gazes at it for a bit of time. \r\n\r\nDallas walks over and crouches by the dead patch. He plucks a brittle, colorless blade of grass, turns it over in his fingers, and slips it into his pocket. As he stands, the hum in his pocket recorder spikes for a second. \r\n\r\nDALLAS\r\n(hesitates)\r\nYeah\r\n\r\nDOMINIC\r\nDo you want to stay for a bit?\r\n\r\nDALLAS\r\nSure.\n\n---\n\n\n### Scene 7: The Coordinates\n\n*ACT I — Arrival & Discovery | ID: the-coordinates | File: s07.md*\n\n---\n\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n<!-- nickname: the-coordinates -->\r\n<!-- FILMING ON = Sun June 28 - Day 12 -->\r\n\r\nINT. JACE'S BASEMENT (s07.1)\r\nDallas looks around in amazement. The basement is covered with normal basement things - but as his eyes scan the room he notices that there are two beds, room, and clutter. Around the corner there is a workstation filled with old CRT machines and what not.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas looks at all of the different audio and acoustic devices scattered across the room. On the cieling there are tiny beeds hung from strings - tiny with different colors. \r\n\r\nDOMINIC\r\nThis was formerly our shared basement - but, now, my brother has occupied it. He just loves this basement... Here, help me grab the fan. \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas looks at all of the different audio and acoustic devices scattered across the room. Dallas walks over to one and sees the similar trail cam that he found on his property - but, this one is different. It has a small antenna attached to it. \r\n\r\nDominic taps Dallas on the shoulder, breaking him out of his gaze and together they slowly move the AC unit upstairs. \r\n\r\nINT. DOMINIC'S BASEMENT (s07.2)\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic helps Dallas shove a heavy oak table against the wall. As they move - Dominic knocks over a photo frame - and Dallas grabs it. On the ground is a small, framed photo of a woman and a young boy on Dominic's shoulders.\r\n\r\nDominic bends down to grab the photo for a bit. \r\n\r\nDOMINIC\r\nDo you have kids?\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic hands Dallas the photo. \r\n\r\nDALLAS\r\nNo. \r\n\r\nDOMINIC\r\n(looking at the photo)\r\nI had a family once. \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas falls mute. \r\n\r\nDOMINIC\r\nNo kid now, no wife now. Just my brother. And our uncle Mike.\r\n(beat)\r\nNot blood, maybe. But that's the house. My lot in life. I'll take it.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic reaches out for a handshake. \r\n\r\nDOMINIC\r\nIt has been nice hanging out with you Dallas - thanks for coming and helping today. \r\n\r\nDALLAS\r\nOh you're welcome. \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic scans the room and finds his gaze upon the corner. MR. MIKE (mid 70s) begins to wake up from his  rocking chair, staring fixedly at the floor. Mr. Mike scans the room and then outside and then takes a deep breath before he begins to violintely scratch the wood of the table using a jagged nail. \r\n\r\nDOMINIC \r\nMr. Mike! Mr. Mike, what are you doing?! \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike suddenly looks up, his eyes milky but sharp. He points a finger at the window.\r\n\r\nMR. MIKE\r\nIt's starting again.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic opens the door. Asher enters and kneels beside Mr. Mike.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike points to the window. \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher's eyes widen when he sees what Mr. Mike has scratched into the table. He already has his sticky note out; he copies the marks, taps the page twice, then folds the note and puts it in his pocket. \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic moves toward the kitchen and stumbles upon Dallas's heavy audio recorder.\r\n\r\nDOMINIC \r\nWhat is this? A boat anchor?\r\n\r\nDALLAS\r\nIt's a recorder. \r\n\r\nDOMINIC\r\nA recorder? You taping this conversation? I'm kidding, you could, la la la la laaaa. Dallas do you want to have some dinner with us? \r\n\r\nDALLAS\r\nUm, no - I should be going back. Thank you though.  \r\n\r\nDOMINIC\r\nYou sure? \r\n\r\nDALLAS\r\nYeah, I got some food back at home, so, I'll be okay.  \r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nMr. Mike in the distance begins to get agitated. He rocks slowly in his rocking chair and taps his fingers. \r\n\r\nMR. MIKE\r\nThe song's gone wrong.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher is still kneeling beside Mr. Mike, listening intently. Dominic looks over from the kitchen.\r\n\r\nDOMINIC\r\n(from the Kitchen)\r\nMr. Mike, calm down my friend - dinner will be ready soon. \r\n\r\nDOMINIC\r\nAsher, I showed Dallas your little basement dwelling.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher looks over to Dallas for a beat, then back at Mr. Mike.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas's eyes drift up to the strings of tiny colored beads hung across the ceiling — a hanging model of something, dozens of nodes on threads. Dominic follows his gaze.\r\n\r\nDOMINIC\r\nAsher's map. Every bead's a spot out in the grass he's tagged. He keeps the whole field up there — none of us can.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nAsher, meanwhile, ignores the conversation, eyes fixed on the distant bushes at the edge of the property. The leaves flutter, though there is no wind. His finger traces a ripple on his hand.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDominic begins to light the gas to start boiling the brussels but the lighter doesnt work. \r\nHe throws up his hands and steps outside to the patio to get it going. Dallas follows him out.\r\n\r\nEXT. DOMINIC'S PATIO (s07.3)\r\n\r\nDOMINIC\r\nThank you again Dallas.\r\n\r\n<!-- scene: 7 file: s07.md nickname: the-coordinates -->\n\n(action)\nDallas begins to walk across the street to his house.\n\n---\n\n\n### Scene 7B: Mr. Mike's Warning\n\n*ACT I — Arrival & Discovery | ID: mr-mikes-warning | File: s07b.md*\n\n---\n\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n<!-- FILMING ON = Sun June 28 - Day 12 -->\r\n\r\ns07B — INT. DOMINIC'S BASEMENT — CONTINUOUS\r\n(Slots in between Scene 7.2 and the end of Scene 7. After Mr. Mike has rambled about Javerias. Dominic is in the kitchen, out of frame. Dallas is alone with Mr. Mike.)\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stands near the table, holding the frame with the photo of Dominic's family. He sets it down gently.\r\nMr. Mike rocks in his chair. He has stopped muttering. His eyes are on Dallas now. Focused. Different.\r\n    \r\nMR. MIKE\r\nCome here.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas glances toward the kitchen. Dominic is out of earshot. He walks over.\r\n\r\nMR. MIKE\r\nCome closer I can't hear you. \r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas crouches beside the rocking chair. Mr. Mike reaches out and takes Dallas's wrist. His grip is stronger than it should be.\r\n\r\nMR. MIKE\r\nYou listen to me.   \r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas doesn't move.\r\n\r\nMR. MIKE\r\nJaverias told me this when I was seven. My father's age. I'm telling you now. You're going to need it.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nA beat. Mr. Mike's eyes are clear. No fog. No wandering.\r\n\r\nMR. MIKE\r\nIf you find one of the bright ones. Hurt. Bleeding. Anything.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nHe tightens his grip on Dallas's wrist.\r\n\r\nMR. MIKE\r\nYou leave it.\r\n\r\nDALLAS\r\n(quiet)\r\nWhat?\r\n\r\nMR. MIKE\r\nYou don't touch it. You don't take it. You don't try to help. You leave it. \r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nMr. Mike looks at him for a long moment. His lip trembles.\r\n\r\nMR. MIKE\r\nIf you touch the hurt one, you make the dark one. And then you become the dark one. \r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stares at him.\r\n\r\nMR. MIKE\r\nEvery time. Every single time.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nHe lets go of Dallas's wrist.\r\n\r\nMR. MIKE\r\nI touched one. When I was a boy. I didn't know. Javerias came the next week. Told me what I did.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nA pause. The rocker creaks once.\r\n\r\nMR. MIKE\r\nThe dark one is still out there.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stares out the window and on the floor. \r\n\r\nFrom the kitchen:\r\nDOMINIC (O.S.)\r\nDallas — you want water?\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nThe spell breaks. Mr. Mike blinks. His eyes cloud over again. He looks at Dallas like he's not sure who he is.\r\n\r\nMR. MIKE\r\n(confused, gentle)\r\nWho are you?\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas stands slowly. His hand goes to his own wrist — rubbing where Mr. Mike gripped it.\r\n\r\nDALLAS\r\n(calling back)\r\nNo, I'm okay.\r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nMr. Mike starts humming. \r\n\r\n<!-- scene: 7B file: s07b.md nickname: mr-mikes-warning -->\n\n(action)\nDallas looks at his wrist one more time, then at the rocking chair. Then at the window, toward the tall grass.\n\n---\n\n\n### Scene 8: The Trailcam\n\n*ACT I — Arrival & Discovery | ID: dallas-marsh-walk | File: s08.md*\n\n---\n\n<!-- scene: 8 file: s08.md nickname: dallas-marsh-walk -->\n\n# Scene 8: The Trailcam\r\n\r\n<!-- FILMING ON = \r\nDAY 3 - EVENING - 6.12.26 -->\r\n\r\nEXT. DALLAS HOUSE - MOMENTS LATER (s08.1)\r\n\r\nDallas grabs his portable Oscillator and heads toward the marsh, following a spike in the readings.\r\n\r\nEXT. BRANFORD ROCKS - EVENING (s08.2)\r\nThe Long Island Sound roars, the waves crashing violently against the Branford rocks. Dallas walks along the edge of his neighborhood.\r\n\r\nDallas steps off the boardwalk onto a narrow dirt path that runs behind the houses, where lawns thin into reeds and the creek bends toward the marsh.\r\n\r\nDallas holds his portable Oscillator out. The needle begins to flutter with increasing intensity. \r\n\r\nIn the far distance, a single coyote barks. Then another. A chain reaction of domestic fear starts in the neighborhood, followed by the high, thin yip of coyotes further inland.\r\n\r\nThe winds pick up. Dallas marches forward. \r\n\r\nEXT. EDGE OF THE MARSH (s08.3)\r\n\r\nDallas pauses at the edge. The Hum is louder here, a dense vibration that makes his vision vibrate.\r\n\r\nDallas walks into the marsh.\r\n\r\ns08.4 — EXT. INTO THE MARSH (s08.4)\r\n\r\nHe finds the spot. A makeshift wooden trap, but it's been... compromised. The grass in a wide ring around the wood is dead and brittle, flattened into a perfect circle.\r\n\r\nDallas finds the trailcam. The lens is cracked, but the \"Record\" light is still blinking a faint, dying red. \r\n\r\nSuddenly, a heavy thud hits the mud thirty feet away like something landing from a big height. \r\n\r\nThe Hum stops. Dallas freezes. He rips the trailcam from its mounting, his fingers fumbling with the nylon straps.\r\n\r\nA low, guttural chittering sound rises from the grass behind him.\r\n\r\nDallas walks faster. He scrambles back toward the boardwalk.\n\n---\n\n\n### Scene 8C: The Threshold\n\n*ACT I — Arrival & Discovery | ID: the-threshold | File: s08c.md*\n\n---\n\n<!-- scene: 8C file: s08c.md nickname: the-threshold -->\n\n# SCENE 8C: THE THRESHOLD\r\n\r\ns08c.1 — EXT. DALLAS HOUSE - PORCH - NIGHT\r\n\r\nDallas stands on the porch, holding the audio recorder in his hand like a weapon.\r\n\r\nThe sky is beginning to fade - and the sounds that he is hearing are getting more and more violent. \r\n\r\nDallas - on a\n\n---\n\n\n### Scene 8D: The Return\n\n*ACT I — Arrival & Discovery | ID: the-return | File: s08d.md*\n\n---\n\n<!-- scene: 8D file: s08d.md nickname: the-return -->\n\n# SCENE 8D: THE RETURN\r\n\r\ns08d.1 — EXT. EDGE OF THE MARSH - NIGHT\r\n\r\nDallas walks along the edge of the Long Island Sound. He takes a deep breath and looks at the coast for a while - as he does so - he hears a hum.\r\n\r\nThe needle on the Oscillator spikes back and forth. Dallas takes out his bag and reveals his wife's recorder that he has been avoiding. He puts in a new tape. \r\n\r\nDallas records the hum. \r\n\r\nINT. DALLAS HOUSE - NIGHT\r\n\r\nDallas plays back the recording. It's the sound of the marsh at night - birds, bugs, the waves - but underneath it all, there's the faint sound of the hum. \r\n\r\nHe goes into the computer and begins to put ear marks on all of the certain peaks. \r\n\r\nA ring at the door. \r\n\r\nDallas walks downstairs.\r\n\r\nThe phone rings. It is Dominc\r\n\r\nDOMINIC (voiceover)\r\nDallas, I am so sorry to call so late - we have a family emergency and need to run to the hospital. Keep an eye on the place for us.\r\n\r\nDALLAS\r\nSure, of course.\r\n\r\nDOMINIC\r\nThank you - I'll be back later. \r\n\r\nDallas heads back up and continues his work. \r\n\r\nDallas goes to sleep.\n\n---\n\n\n### Scene 9: The Injured One\n\n*ACT I — Arrival & Discovery | ID: dallas-night-work | File: s09.md*\n\n---\n\n<!-- scene: 9 file: s09.md nickname: dallas-night-work -->\n\n# Scene 9: The Injured One\r\n<!-- summary: Dallas, as he ventures deeper and deeper into the marsh - finds a bioluminest creature -->\r\n\r\n<!-- FILMING ON - DAY 3 = 6.12.26 -->\r\n\r\nEXT. DALLAS HOUSE - NEXT DAY\r\n\r\nDallas heads back toward the marsh, driven by last night's discovery.\r\n\r\nEXT. EDGE OF THE MARSH\r\n\r\nDallas enters an interesting field of tall bamboo like grass. \r\n\r\nDallas looks at his portable Oscillator - it is acting crazy. \r\n\r\nEXT. DEEP INSIDE THE TALL MARSH (s09.1)\r\n\r\nDallas stands slowly, scanning the reeds around him. Nothing much seems out there - just the gentle sway of grass.\r\n\r\nDallas pushes through a dense curtain of reeds. Dust motes dance in a whirlwind of color refracting the sunset into jagged prisms on his face. \r\n\r\nDallas steps deeper, following the fading glow. \r\n\r\nAll around him is light reeeds blowing in a whirlwind of light and color. \r\n\r\nAs Dallas' eyes adjust to this new brightness - the world around him slowly blurs. \r\n\r\nThere in the distance Dallas sees a gnarled tree that stands alone among the reeds.  \r\n\r\nDallas approaches the tall grass and the gnarly tree and as he does - he notices that inside of the gnarl, curled up, tucked away,  lives a small orb shaped creature - slightly bioluminest - and clearly injured. \r\n\r\nThe creature is a cloudlike - cottonball, powder-puff animal with feathers all around it's body. \r\n\r\nDallas reaches out. His hand trembles. He touches the creature's back. The creature flinches but doesn't move away. \r\n\r\nThe creature inch by inch begins to uncoil a tentacle from inside its body and wraps around Dallas' finger, and then hand.\r\n\r\nAs the creature connects Dallas closes his eyes and appears to be having a vision. \r\n\r\nHe opens his eyes and gazes longingly at the creature. It has the body a bit like a turtle - but the face of a dove - and the tentacle of an octopus. \r\n\r\nDallas hears his equipment beep louder and louder.\r\n\r\nThe creature reaches out its tiny octupus arm and gently wraps itself around Dalla's hand. Dallas picks it up and nestles it into his chest. \r\n\r\nSuddenly, the wind returns. A violent gust. Shadows in the distance start to fill the sky and hover over Dallas and the creature. Dallas in a daze, slowly grabs the creature and gently places it in his jacket and begins to walk without looking back.\n\n---\n\n\n### Scene 10: The Chase\n\n*ACT I — Arrival & Discovery | ID: shadows-in-wind | File: s10.md*\n\n---\n\n<!-- scene: 10 file: s10.md nickname: shadows-in-wind -->\n\n# Scene 10: The Chase\r\n<!-- nickname: Creature discovery -->\r\n<!-- FILMING ON \r\nDAY 3 6.12.26 -->\r\n\r\nEXT. TALL GRASS - MOMENTS LATER (s10.1)\r\n\r\nAs Dallas walks out of the tall grass, he gets the sense that something is following him.\r\n\r\nThe air changes and the hum faintly comes back. Then in the distant, more coyotes begin to howl. \r\n\r\nA heavy, crushing sound slices through the reeds—something massive rocketing toward him like an arrow. \r\n\r\nRed eye's begin to circulate around him - pulsing as they inch closer as if Dallas' vision is on a blurry carpret ride. \r\n\r\nDallas breaks into a sprint. He doesn't stop running until the marsh is far behind him.\r\n\r\nEXT. BRANFORD MONTAGE (s10.2)\r\n\r\nDallas walks briskly past the same neighborhood route he took before. \r\n\r\nEXT. DALLAS DRIVEWAY (s10.3)\r\n\r\nAt the edge of his driveway, he finally stops—gasping. The creature is motionless in his coat, but its neck glow pulses weak, fading amber.\n\n---\n\n\n### Scene 11: Kitchen Triage\n\n*ACT I — Arrival & Discovery | ID: kitchen-triage | File: s11.md*\n\n---\n\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n# Scene 11: Kitchen Triage\r\n<!-- nickname: kitchen-triage -->\r\n<!-- summary: Dallas at home with the creature. Kitchen triage—parchment, macro lens. The creature cries; the equipment flares gold. -->\r\n\r\n<!-- FILMING ON DAY 6 -- 6.16.26>\r\n\r\nINT. DALLAS KITCHEN - DUSK (s11.1)\r\nDallas rushes to bring the creature inside. He grabs an aluminion pan and lines it with parchment paper. The creature seems to be asleep. \r\n\r\nDallas hears a sound from the other room.\r\n\r\nINT. DALLAS ATTIC - MOMENTS LATER (s11.2)\r\nDallas finds himself alone with the creature trying to understand it as he observes its features with thick macro monoculars. \r\n\r\nAs Dallas peers closer, he notices that it has marks underneath its eye. As Dallas touches the marks the creature suddenly wakes up and lets out a cry.\r\n\r\nAs the creature cries - Dallas notices that all of the screens on his equipment transform a sudden burst of golden static. The hue gets so vibrant and bright that permant golden marks are left scattered across all of his equipment near the creature. \r\n\r\nThe creature lets out a final whimper and slowly falls back to sleep. Dallas - looks at the mark again, as its sparkles and then fades. \r\n\r\nINT. DALLAS WORKSHOP (s11.3)\r\n\r\nDallas enters the workshop and grabs a bunch of things. \r\n\r\nDallas begins to construct a livable habit that the creature could live in. He grabs spare objects around his workbench and constructs. \r\n\r\nHe peers over at the creature and notices that it is breathing heavily. He covers it with a blanket - and a makeshift box - as he notices that the light hurts it. \r\n\r\nDallas flicks the switch and the box turns into a redlight. \r\n\r\n\r\nINT. DALLAS DESK - NIGHT (s11.3)\r\n\r\nThe day has turned to night and Dallas is still tinkering with this habitat creation. From it - a bunch of wires are hooked up haphazardly to his makeshift computer. \r\n\r\nDallas is peered over his computer and begins to scan a program between different spectrums. \r\n\r\nDallas tries dialing different frequencies to broadcast, and nothing answers. He pulls the day's recordings up on his computer and watches the spectrogram scroll past. Buried under the marsh rumble, the same shape keeps repeating — a structured pulse, the creature's own call, the same figure over and over. He thinks of the frequencies penciled into Sierra's field journal, the same shapes on the page, and he starts trying to rebuild the call himself, note by note. \r\n\r\nHe listens to the recording. At first, nothing but the usual low-grade rumble of the marsh. Then—a pulse. \r\n\r\nIn the distance Dallas hears the hum again.\r\n\r\nDallas goes over and tends to the creature - but this time it is visually shaken. Dallas sits next to it on a chair and waits for it to calm down. \r\n\r\nDallas puts the creature in his new makeshift box. \r\n\r\nAs Dallas sits - his eyes get heavy - and he suddenly catches himself snoozing. He gets up - and sees Sierra's tape recorder on the desk. He stumbles over for a bit and presses play. A small little melody of Sierra playing piano and singing gently engulfs the air.  \r\n\r\nAs he does, he notices that the creatures' cry begins to cease - but as it does - so does the recording. \r\n\r\nHe replays the clip. But nothing, it is blank. Dallas plays it again, distraught.\r\n\r\nHis elbow brushes the stack of Sierra's folders. One slides open—a corner of a sketch visible. Something golden. He pushes it closed without looking. \r\n\r\nAs he is listening another burst hits the ongoing recording. Dallas looks up from his desk and peers outside. Another faint hum.  \r\n\r\nA doorbell is heard off screen breaking Dallas out of his trance.\r\n\r\nINT. DALLAS' HOUSE - HALLWAY - NIGHT (s11.4)\r\nDallas opens the door to find Dominic.\r\n\r\nDOMINIC\r\nHey - we're doing a lifegroup tomorrow night at our place - you should come. \r\n\r\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n(action)\nDallas peers toward the kitchen.\r\n\r\nDALLAS\r\nYeah, should be good. \r\n\r\nDOMINIC\r\nOkay... Hey - everything okay?\r\n\r\nDALLAS\r\nYeah - sorry - I'm just a little tired. \r\n\r\nDOMINIC\r\nAlright well rest well big guy. \r\n\r\n<!-- scene: 11 file: s11.md nickname: kitchen-triage -->\n\n(action)\nDominic leaves and walks into the next side door. Dallas watches him - and then watches the tall grass sway in the wind.\r\n\r\nDallas rushes to the workstation and finds that the creature sleeping peacefully.\n\n---\n\n\n## ACT II — The Creature\n\n---\n\n\n### Scene 12: The Burn Mark\n\n*ACT II — The Creature | ID: the-burn-mark | File: s12.md*\n\n---\n\n<!-- scene: 12 file: s12.md nickname: the-burn-mark -->\n\n<!-- nickname: ALONE WITH THE CREATURE  -->\r\n\r\n<!-- Filming on = Day 4 = 6.13.26 -->\r\n<!-- LOCATION: Jerry's Attic - Shoot somewhere where Dallas is also alone -->\r\n\r\nINT. DALLAS'S ATTIC - NEXT MORNING  (s12.1)\r\n\r\nMorning dawns and Dallas takes a deep breath as he awakes from a cot near the desk. \r\n\r\nHe stares at the wall for a while and then at his bed post and the journal with the picture of the woman next to it. \r\n\r\nHe hears a chirp and looks over at the creature.\r\n\r\nCUT TO:\r\nThe creature is sound asleep in the makeshift aquarium that Dallas built for it. \r\n\r\n\r\nDallas looks at his computer and begins to scan the records. \r\n\r\nOutside he hears a loud bang and someone yelling in the distance. \r\n\r\nDominic's car idles in the driveway. Dominic gets out and checks the pressure on one of its tires.\n\n---\n\n\n### Scene 13: The Confrontation\n\n*ACT II — The Creature | ID: entering-grass | File: s13.md*\n\n---\n\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n# Scene 13: The Confrontation\r\n\r\n<!-- FILMING ON \r\nDAY 5 = 6.14.26 -->\r\n\r\nEXT. DALLAS BACKYARD - NEXT MORNING (s13.1)\r\n\r\nDominic takes a deep breath and bends over to check the tire pressure.\r\n\r\nHe finds a patch of grass and touches it. \r\n\r\nAsher wanders toward the edge of Dallas's property, kneeling over when he gets to the edge. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher spots a trailcam that seems to be behind Dallas' backyard gate . It is blinking. He unties it and puts the SD card in his pocket. Meanwhile Dominc walks right up to Dallas' doorway and kocks.\r\n\r\nDallas emerges. \r\n\r\nAsher notices a trail leading from the edge of the grass toward Dallas. He grabs beads from his pocket and begins to dangle them nervously. \r\n\r\nCut to. \r\n\r\nEXT. DALLAS DOORWAY\r\nDallas walks outside and Dominic bangs his hand on the door. \r\n\r\nDallas answers. \r\n\r\nDOMINIC\r\nDallas! Gosh what a whirlwind. Listen, our church has a bible study tonight - you should come. That okay?\r\n\r\nDALLAS\r\nYeah that's fine. \r\n\r\nDOMINIC\r\nGood. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDominic looks back at Asher, who hasn't moved from the edge of the yard. His eyes are on the tall grass.\r\n\r\nDOMINIC\r\nAsher, come on - I got to run to the store. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher doesn't move. He keeps his eyes on the grass.\r\n\r\nDOMINIC\r\nAlright fine - stay. But you owe me one. Mr. Dallas, he's no trouble. I'll be back in twenty.\r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDominic drives away. \r\n\r\nEXT. DALLAS's HOUSE -  DOORWAY (s13.2)\r\nAsher stares at Dallas for a good while - and reads his eyes.\r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher turns and points at the dead, flattened patch of grass at the edge of \r\nthe tall grass. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDallas looks where he is pointing. His eyes widen. \r\n\r\nDALLAS\r\nI don't know. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher points to the trailcam. \r\n\r\nDALLAS\r\nIt looks like a trailcam. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nA whimper is heard from the kitchen. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher's head snaps toward the sound. He rushes past Dallas and runs to the kitchen.  He takes out his portable oscillator and sees that it is spiking as he points it to the cieling. \r\n\r\nAsher and Dallas stand silent looking at each other for a beat too long.\r\n\r\nAsher rushes out of the room, up the stares, towards the attic. \r\n\r\nINT. DALLAS ATTIC - MOMENTS LATER (s13.3)\r\n\r\nDallas and Asher hover around the table at the makeshift aquarium Dallas constructed.\r\n\r\nAsher takes his headphones off and grabs the ruby red headphones on the kitchen table. He puts them on and listens to the recording. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher pulls out his portable viewfinder and begins to inspect the creature further. \r\n\r\nDALLAS\r\nIt's been here since last night. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nThe pair look closer at the creature - it seems to breath through its back. \r\nAsher touches the creature gently - which causes the screen Oscillator around \r\nit to spark.\r\n\r\nDALLAS\r\nWe can't tell anyone about this.\r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher turns to Dallas and nods in agreement. \r\n\r\nEXT. DALLAS HOUSE - PICNIC BENCH (s13.4)\r\nDallas adjusts his position on the picnic bench and gently walks towards the \r\nedge of the tall grass. Asher watches him, silent.\r\n\r\nDALLAS\r\nI found it a couple of miles away. I am not sure exactly. I was out walking. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nAsher keeps watching. Dallas keeps talking, half to the kid, half to himself.\r\n\r\nDALLAS\r\nI was alone. I ventured off the trail. It looked like it was injured. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nA beat.\r\n\r\nDALLAS\r\nI thought I could fix it. \r\n\r\n<!-- scene: 13 file: s13.md nickname: entering-grass -->\n\n(action)\nDallas grabs a heat lamp and begins to examine the creature. Asher in the \r\ndistance stands off, afraid to look at the creature.\n\n---\n\n\n### Scene 14: The Connection\n\n*ACT II — The Creature | ID: creature-rescue | File: s14.md*\n\n---\n\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n# Scene 14: The Connection\r\n\r\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\r\nEXT. DALLAS BACKYARD - OLD PORCH TABLE (s14.1)\r\n\r\nDominic and Dallas look on the ground for a while as they sit outside the patio. \r\n\r\nAsher sits alone a few feet away—he begins to tap on his fingers, and then nods in approval. He takes some string from his pocket and begins to quietly thread various quanity of beads. \r\n\r\nDOMINIC\r\nWhat do you do when you are sad? \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks at the ground and then at Dominic.\r\n\r\nDALLAS\r\nI don't know.\r\n\r\nDOMINIC\r\nYour wife. What was she like?\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks at the sky and then at the ground and then at the dead patch of grass at the edge of the property. \r\n\r\nDALLAS\r\nShe studied how fish communicate underwater.\r\n\r\nDOMINIC\r\nSounds like a smart lady.\r\n\r\nDALLAS\r\nShe was.\r\n\r\nDOMINIC\r\nOur moms gone too. Me and Asher - and our uncle Mike. That's the house now. But we're still here. Branford. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas nods and looks at the ground.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDominic stands and claps Dallas on the shoulder.\r\n\r\nDOMINIC\r\nI got to get Mr. Mike his dinner going. Asher - don't wear Mr. Dallas out. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDominic walks back across the street. Asher stays, threading his beads.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nA gentle breeze blows through the sky. Asher begins to pace around and bob his head a bit back and forth. Suddenly, he stops in his tracks and proceeds to walk slowly into the house. \r\n\r\nDallas looks back at him and continues to fiddle with the Oscillator.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas sits for a while on the long old picnic table outside his house. In the distance the creature begins to cry and then it fades. Dallas looks down at the trailcam in the distance. \r\n\r\nDALLAS\r\n(to himself)\r\nWe can't tell anyone. Not until I document this. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nHe looks at the recorder in his hand. He has been recording its sound all along.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe breeze overwhelms him and in the distance he begins to hear the faint pulse of a dark deep hum. \r\n\r\nINT. DALLAS' ATTIC - CONTINUOUS (s14.1B)\r\n\r\nDallas and Asher huddle over machinery in Dallas attic. Asher gets a bit weirded out and heads downstairs.\r\n\r\nINT. DALLAS' KITCHEN - CONTINUOUS (s14.2)\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe room grows quiet.  Asher, alone, busies himself trying to connect wires up to the makeshift computer on the counter. He stops as, looks down at the cables and then far off in the distance, then on the ground, then the tall grass. His finger traces something on his leg—the same pattern, over and over. \r\n\r\nOutside the window, the wind picks up.  From the distance - what looks like a faint red light appears for a second and pulses away. \r\n\r\nAsher begins to tap and tap and tap, and his head begins to shake and shake and shake. He crashes to the ground.\r\n\r\nEXT. DALLAS BACKYARD - OLD PICNIC TABLE - CONTINUOUS (s14.3)\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nA loud thump is heard from inside. Dallas runs into his kitchen.\r\n\r\nINT. DALLAS' KITCHEN - MOMENTS LATER (s14.4)\r\n\r\nDallas holds Asher by the head as he shakes on the ground. Dallas begins to sway and hum to him - clumsy, unpracticed, but he does it. He puts his hand on the boy's chest and Asher breathes. \r\n\r\nDALLAS\r\n(under his breath)\r\nYou're okay. You're okay. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas takes a deep breath as Asher shakes violently and stops shaking violently. \r\n\r\nDALLAS\r\nSit up.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas makes Asher sit up and brings him a glass of water. As he is pouring it - Asher's eyes find the creature sleeping peacefully below the heat lamp. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nDallas looks around at his kitchen island - which has turned part into a triage hospital station. A portable oscilloscope is wired up to the creature.  The device pulses in a rhythmic, golden jagged line — in sync with the creature's heartbeat.\r\n\r\nIn the distance they hear howls - and then silence again. \r\n\r\nThe creature begins to fade - Dallas turns the dial into another frequency range and waits until it is asleep. Asher watches the dial, then watches Dallas. \r\n\r\nDALLAS\r\n(whispering)\r\nIt changes the frequency I am broadcasting. I'm trying to get a response.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe two look at the creature on the table. The creature seems to be responding to it.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nAsher looks at Dallas and then at the creature and pulls out a small prototype from his backpack. He holds it out.\r\n\r\nThe two look at each other for a moment.\r\n\r\nDALLAS\r\nWhat is that?\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nAsher turns to the creature and turns it on. An amplifier. The creature starts to wiggle.\r\n\r\nBehind the creature's smooth sine wave, a second signal appears—jagged, arrhythmic. It pulses in sharp, irregular bursts, riding underneath the creature's frequency like static beneath music.\r\n\r\nDALLAS\r\n(quiet)\r\nThat's not coming from the creature. That's drawing from outside.\r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nThe two look at the creature and then at the oscilloscope and then at the sway of the tall grass outside. \r\n\r\n<!-- scene: 14 file: s14.md nickname: creature-rescue -->\n\n(action)\nAsher tugs Dallas's sleeve. He points out the window, toward the marsh. He has something to show him.\n\n---\n\n\n### Scene 14B: The Field Journal\n\n*ACT II — The Creature | ID: the-field-journal | File: s14b.md*\n\n---\n\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n# SCENE 14B : #####\r\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\r\nSCENE 14B: THE FIELD JOURNAL\r\n\r\n\r\ns14B.1 — EXT. DALLAS BACKYARD — OLD PICNIC TABLE — CONTINUOUS\r\nDallas and Asher sit in silence. Asher, a few feet off, threads beads onto a long string — one bead for every listening post he has staked out in the marsh. The quantity matters; we just don't know why yet.\r\n\r\nDallas reaches into his bag and pulls out a soft-covered field journal. Sierra's. The cover is warped from water, held together with a rubber band. The one from her folders he keeps pushing closed. He doesn't open it right away. He holds it in his lap.\r\n\r\nDALLAS\r\n(quiet)\r\nHers. \r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nHe sets it on the picnic table. Asher looks at it but doesn't touch it.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas opens it. The first pages are careful — a woman's handwriting, pencil sketches of the marsh, dated entries. \r\nObservations. Frequencies. \r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA small drawing of a Golden creature in the margin — recognizable. Similar to the one in his kitchen.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas turns the page. The sketches get more detailed. Different Golden creatures at different sizes.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas turns another page and stops. On the left side of the spread: a Golden creature, curled and peaceful. On the right side: the same body, the same proportions, the same ears, the same frame, gone wrong. The fur is matted and colorless like dead grass. There are eyes where there were no eyes before, and they are red.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAn arrow between them. No words.\r\n\r\nDALLAS\r\n(quiet)\r\nWhat am I looking at?\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher has come around the table. He looks at the spread. He doesn't look surprised.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas stares at the page. His thumb traces the arrow.\r\n\r\nDALLAS  \r\nThey're the same.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher nods.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA beat.\r\n\r\nDALLAS\r\nOne turns into the other?\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher stops threading. He puts one finger on the peaceful creature. Then he drags it slowly across the arrow to the red-eyed one. Then he points at the kitchen window. Toward the creature inside.\r\n\r\nDALLAS\r\nWhen they get hurt. They change.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher goes still. That is the answer.\r\n\r\nDALLAS\r\nThe one I found was injured.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nA gust of wind moves through the tall grass at the edge of the property. Asher's head turns toward it. Just slightly.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas closes the journal carefully.\r\n\r\nDALLAS\r\nShe saw one. \r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nThe wind picks up again. In the far distance, barely audible — not quite a howl, not quite a hum. Something in between.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nAsher stops threading.\r\n\r\nASHER\r\n(quietly, to himself)\r\nThey're listening.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas turns to him. He doesn't elaborate. He goes back to his beads.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nDallas picks up the journal and slides it back into his bag.\r\n\r\nDALLAS\r\nWe should go inside. Check on it.\r\n\r\n<!-- scene: 14B file: s14b.md nickname: the-field-journal -->\n\n(action)\nThey stand. Dallas glances back at the tall grass one more time before going in.\n\n---\n\n\n### Scene 14C: The Almost Discovery\n\n*ACT II — The Creature | ID: the-almost-discovery | File: s14c.md*\n\n---\n\n<!-- scene: 14C file: s14c.md nickname: the-almost-discovery -->\n\n<!-- FILMING ON = DAY 4 = 6.13.26 -->\r\nINT. DALLAS HOUSE – LATE AFTERNOON (s14c.1)\r\n\r\nLate-day light leaks through the kitchen blinds. The creature is hidden beneath a towel inside the makeshift enclosure. A SOFT, IRREGULAR HUM bleeds faintly into the room.\r\n\r\nDallas stands rigid at the counter, tightening a cable connection.\r\n\r\nA KNOCK at the door.\r\n\r\nDallas freezes.\r\n\r\nAnother knock—cheerful.\r\n\r\nDOMINIC (O.S.)\r\nDallas? You home? I think you might have our step ladder.\r\n\r\nINT. DALLAS HOUSE – FRONT ENTRY – CONTINUOUS (s14c.2)\r\n\r\nDallas opens the door. Dominic stands there, winded.\r\n\r\nDOMINIC  \r\nThere he is! Hey—sorry to bug you. The storm knocked something loose on our gutter.\r\n\r\nDallas forces a smile.\r\n\r\nDALLAS  \r\nWeather’s been strange.\r\n\r\nDOMINIC  \r\nTell me about it—Pat’s already texting doom.\r\n\r\nThey share a short laugh. The HUM beneath the house deepens—to almost imperceptible.\r\n\r\nDominic tilts his head.\r\n\r\nDOMINIC  \r\nYou hear that?\r\n\r\nDALLAS  \r\nHear what?\r\n\r\nDominic listens another beat. Shrugs.\r\n\r\nDOMINIC  \r\nProbably my sinuses. Allergies. Or ghosts.  \r\n\r\n(then)  \r\nMind if I set the ladder by your fence?\r\n\r\nDALLAS  \r\nSure.\r\n\r\n---\r\n\r\nINT. DALLAS KITCHEN – CONTINUOUS (s14c.3)\r\n\r\nDominic steps inside. The HUM vibrates a glass of water on the counter—just enough to ripple.\r\n\r\nDallas slides between Dominic and the enclosure casually.\r\n\r\nDOMINIC  \r\nWow. Place looks like NASA threw up.\r\n\r\nDALLAS  \r\nWork stuff.\r\n\r\nDOMINIC  \r\nYou educators—always overprepared.\r\n\r\nDominic steps once more toward the counter—toward the towel.\r\n\r\nDallas moves **immediately**.\r\n\r\nDALLAS  \r\nSo—uh—weren’t you fixing the porch light too?\r\n\r\nDOMINIC  \r\nYeah—\r\n\r\nThe creature STIRS beneath the towel. A muted WHIMPER—felt more than heard.\r\n\r\nThe oscillators flicker GOLD for half a second.\r\n\r\nDominic freezes.\r\n\r\nDOMINIC  \r\nOkay. That—\r\n\r\nDallas reaches out and SLAMS a power switch. Darkness. Silence.\r\n\r\nA beat.\r\n\r\nDOMINIC  \r\n…Storm’s coming quick.\r\n\r\nDallas smiles too fast.\r\n\r\nDALLAS  \r\nWe should all stay inside tonight.\r\n\r\nDominic nods slowly. Something unsettled—but unspoken.\r\n\r\nDOMINIC  \r\nYeah.  \r\n(then, lighter)  \r\nAlright—ladder can wait. Dinner smells like it’s burning anyway.\r\n\r\nHe turns to leave.\r\n\r\nAt the door, Dominic pauses.\r\n\r\nDOMINIC  \r\nDallas?\r\n\r\nDALLAS  \r\nYeah?\r\n\r\nDOMINIC  \r\nIf you ever need help—  \r\n(gestures vaguely)  \r\n—with whatever this is… just ask.\r\n\r\nDallas nods.\r\n\r\nDominic leaves.\r\n\r\nSilence.\r\n\r\nDallas stares at the towel—at the faint GOLDEN GLOW bleeding through.\n\n---\n\n\n### Scene 15: Asher's Tracking Box\n\n*ACT II — The Creature | ID: the-tracking-box | File: s15.md*\n\n---\n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n# Scene 15: Asher's Tracking Box\n\n<!-- s15 -->\n<!-- FILMING ON DAY 4 -->\nEXT. NEIGHBORHOODS - EVENING (s15.1)\nDallas, Dominic and Asher walk towards the neighborhood and begin the long process of making their journey down golden hour filled woodland area - as they approach a big field open field. At the end of the field are some tall trees. Dallas stops and peers around. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAs they cut through the reeds, Asher stops every so often to press small devices down into the mud at the base of the stalks. Each one blinks a slow, faint amber as it powers on. \n\nDallas watches a scatter of them pulse in the dusk.\n\nDOMINIC\nListening posts. He's been seeding the whole marsh with them — for years now. Every spot that sound of his has ever touched. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher trails a step behind. Each time one of the nodes blinks to life, he threads a single bead onto the string around his neck. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nThe three walk into the field and find a small wooden chest on the ground, hidden beneath a field of tall grass. \n\nEXT. ASHER'S SPECIAL WOODED SPOT - CONTINUOUS (s15.2)\nAs they approach the structure, they can see that it is a small wooden structure hidden by fallen trees and branches. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nInside the structure there is a wooden box. Asher opens it. Inside there are various trail cameras and recording equipment. On the bottom of the box, Asher pulls out various cables and wires connected to a small portable oscillator. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher walks over and turns the device on. It lights up. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nDallas looks confused at the wiring. \n\nDOMINIC\nDon't worry Mr. Dallas - one day you'll hear all about my brother's inventions - they are going to change the world... \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nDallas looks at one of the inventions on the ground. \n\nDOMINIC\nDo you believe that things happen for a reason?\n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nDallas reamins still, not making eye contact. \n\nDOMINIC\nWell they do. I do. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher takes out a pocket tripod - and a pocket microphone - and begins to to record. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher lifts a small wooden box and holds it out to Dallas without a word. Dallas opens it and finds a spare oscillator inside, wrapped in cloth, the dial worn smooth from use. Dallas holds it, fascinated.\n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher walks over to a little portable device, also hidden by a bunch of branches. He turns it on with a bunch of 9V batteries and points to the two metal rods — contact transducers — coming out of the portable wooden device, and nudges Dallas to grip. \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nDallas grips - and has a wild trip.  As he does - a distant cry is heard in the distance. \n\nDallas wakes up. \n\n\nDOMINIC\nDallas. Dallas! You alright? \n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nAsher shrugs, slow. Dominic looks between the two of them, then out at the trees.\n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nIn the distance the howls are getting more ganrly. The three of them stand silent in fear.\n\n<!-- scene: 15 file: s15.md nickname: the-tracking-box -->\n\n(action)\nDallas begins to record a bit on his pocket recorder. still out of breath. \n\nDOMINIC\n(takes a deep breath and contemplates for a while)\nWe should go.\n\n---\n\n\n### Scene 16: Back Home\n\n*ACT II — The Creature | ID: the-escape | File: s16.md*\n\n---\n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n# Scene 16: Back Home\r\n\r\n<!-- GOING TO FILM ON and on Day 4 - Day 12 -->\r\n\r\nEXT. DALLAS BACKYARD (s16.1)\r\nDallas hastily makes his way out of the woods, back toward the field, carrying all of the equipment from the wooden box. \r\n\r\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nAs he walks, he begins to notice that the tall grass around him is acting universally
