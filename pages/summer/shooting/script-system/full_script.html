 restless. He walks in uneasy silence as the summer glow lights his pace. \r\n\r\n\r\nEXT. BRANFORD TOWN GREEN - DAY (s16.2)\r\n\r\nDallas walks through the backstreets of Branford with the creature covered in a towel drapped over the dog backpack. \r\n\r\nEXT. DALLAS'S HOUSE - DAY (s16.3)\r\n\r\nAs he approaches the driveway, he looks suspciously at the tall grass around his house. \r\n\r\nINT. DALLAS' KITCHEN\r\nDallas sets the covered backpack on the table. His spare handheld oscilloscope begins to beep. The distinct faint hum has followed him home.\r\n\r\nThe creature answers with a weak tone from inside the bag. Dallas steadies his breathing and checks the window.\r\n\r\nINT. DALLAS'S HOUSE - HALLWAY - DAY (s16.4)\r\n\r\nDominic pulls up in his car and honks the horn. He rolls down the window, calm.\r\n\r\nDOMINIC\r\n(easy)\r\nYou alright?\r\n\r\nDALLAS\r\nI'm fine.\r\n\r\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDominic's eyes drift to the backpack. Something about it doesn't sit right with him. He clocks it quietly—then lets it go.\r\n\r\nDOMINIC\r\nLife group tonight. You should come. Get out of this house for an hour.\r\n\r\nDALLAS\r\nMaybe.\r\n\r\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDominic gives the house one last look, then throws the car into drive.\n\n---\n\n\n### Scene 17: Resonance\n\n*ACT II — The Creature | ID: resonance | File: s17.md*\n\n---\n\n<!-- scene: 17 file: s17.md nickname: resonance -->\n\n<!-- nickname: resonance -->\r\n<!-- GOING TO FILM ON Day 4 -->\r\n\r\nINT. DALLS BASEMENT (s17.1)\r\n\r\nDallas looks at the creature by himself for a long time. \r\n\r\nDallas stares for a long time at the golden creature. The jagged red lines on his portable viewfinder match the erratic, panicked breathing of the tiny animal. \r\n\r\nThe creature is not doing so good - but seems to be glowing - and the distant hum perks up again. \r\n\r\nDallas walks over and then paces around the room; He taps various equipments and thinks and thinks. Dallas looks at the photo of Sierra taped to his receiver. \r\n\r\nDallas connects the creature's shoebox to his receiver with the alligator clips and tunes a soft tone into it. The creature seems to interact with the sound somehow. \r\n\r\nDallas gently turns the dial on his receiver and dials the volume up just enough to create a soft, resonant hum in the basement. \r\n\r\nThe creature's ears twitch. It stops its erratic movements. Slowly, it opens its mouth and emits a low, melodic tone, matching the frequency Dallas is broadcasting. As it sings, the golden glow in its neck grows stronger, pushing back the shadows in the room.\r\n\r\nDallas watches the glow rise and fall with the tone. He keeps the sound soft, and the creature settles. He's soothing it without yet understanding what he's found. He only knows that the creature calms when he plays it something close to its own call.\r\n\r\nA doorbell is heard off screen. \r\n\r\nINT. DALLAS NIGHTTIME (S17.2)\r\n\r\nDALLAS sleeps next to the the setup. He hears a beep beep and looks at the workshop. The creature is gone!. \r\n\r\nEXT. DALLAS BACKYARD - NIGHT (S17.3)\r\n\r\nDallas runs outside and looks around. But to no avail.\n\n---\n\n\n### Scene 17B: Normal Day\n\n*ACT II — The Creature | ID: normal-day | File: s17b.md*\n\n---\n\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n# SCENE 17B: NORMAL DAY\r\n\r\n<!-- nickname: normal-day -->\r\n<!-- GOING TO FILM ON Day 12 -->\r\n\r\nEXT. BRANFORD HARBOR - DAY (s17b.1)\r\n\r\nDominic walks the docks at the Branford town marina, a clipboard under his arm. The harbor is buzzing with the banal energy of pre-storm preparation—owners lashing extra lines, tying down tarps, hauling small craft up the ramp.\r\n\r\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nDominic moves down the row of slips, checking each boat, signing off on slip paperwork as he goes. Routine. Calm.\r\n\r\nBut beneath it all—beneath the slap of halyards against masts, the gulls, the chatter of the boatyard—Dominic hears the HUM. \r\n\r\nIt is distant. Ambient. It rides in low over the water, almost like the drone of a far-off outboard, but too rhythmic. He stops at the end of the dock and stares out across the chop, trying to isolate the sound. He shakes his head, actively gaslighting himself. Just the wind in the rigging.\r\n\r\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nA boat owner passing on the dock calls over.\r\n\r\nOWNER\r\nDom—you okay?\r\n\r\nDOMINIC\r\nYeah.\r\n\r\n(cross-cut)\r\n\r\nINT. DALLAS ATTIC - DAY (s17b.2)\r\n\r\nDallas is hunched over his makeshift receiver workstation, the heavy headphones clamped to his ears. The frequency is no longer ambient to him; it is clear, distinct, and terrifying. He frantically dials the knobs, trying to track the source, completely consumed.\r\n\r\n(cross-cut)\r\n\r\nEXT. BRANFORD HARBOR - DAY (s17b.3)\r\n\r\nDominic clips a signed form to a piling and moves to the next slip. He seems perfectly at ease, navigating the normalcy like a protective shield. He nods to the passing boat owner.\r\n\r\nDOMINIC\r\nBetter get her tied down good - supposed to blow this weekend!\r\n\r\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nHe watches the man go. His comfort isn't ignorance; it's a practiced discipline. He is choosing the routine.\r\n\r\n(cross-cut)\r\n\r\nINT. DOMINIC'S BASEMENT - DAY (s17b.4)\r\n\r\nMaps, meteorological data, and bead strings cover the floor. A red line connects the anomalous sounds across the town's geography, ending at the marsh.\r\n\r\n(cross-cut)\n\n---\n\n\n### Scene 17C: Mute Drive\n\n*ACT II — The Creature | ID: mute-drive | File: s17c.md*\n\n---\n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n# SCENE 17C: THE DRIVE\r\n\r\n<!-- nickname: mute-drive -->\r\n<!-- GOING TO FILM ON \r\n6.28.26 -->\r\n<!-- GOING TO FILM ON Day 12 -->\r\nINT. DOMINIC'S CAR - DAY (s17c.1)\r\n\r\nDominic is driving through downtown Branford. The Nor'easter winds are picking up, rattling the windows of the car. Outside, the town is engaged in banal, civic storm preparation. Shop owners are taping windows. Public works employees are laying sandbags near the post office. \r\n\r\nDominic talks to Dallas through the car's speakerphone as he drives.\r\n\r\nDOMINIC\r\nYou keep saying weather. This isn't weather. The whole town feels like it's holding its breath.\r\n\r\nDALLAS (V.O.)\r\nI know.\r\n\r\nDominic's eyes track a thick mat of dead leaves and bramble snarled high up the brick side of the Branford Town Hall, climbing where no vine should reach. The public works employees walk right past it, completely oblivious.\r\n\r\nDominic's eyes land on the brick wall of the Town Hall and the dead brush snarled up it where nothing should grow. The streetlights pulse in time with it, and the wind carries a rhythm that turns his stomach. \r\n\r\nDominic hits the brakes, pulling the car hard onto the shoulder of the road. \r\n\r\nHe puts the car in park and stares at the wall.\r\n\r\nDOMINIC\r\n(quietly)\r\nDallas. The streetlights are pulsing with it. The dead growth is climbing the building.\r\n\r\nDALLAS (V.O.)\r\nGet home. Lock the doors.\r\n\r\nDOMINIC\r\nNo. You keep telling me half of it and expecting me to stay out. I'm coming to you.\r\n\r\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n(action)\nDominic throws the car back into drive. It speeds off as the first heavy drops of unnatural rain hit the windshield.\n\n---\n\n\n### Scene 18: Life Group Arrives\n\n*ACT II — The Creature | ID: life-group-arrives | File: s18.md*\n\n---\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n<!-- nickname: life-group-arrives -->\r\n\r\n<!-- GOING TO FILM ON DAY 11 -->\r\n\r\nINT. DOMINIC'S KITCHEN / LIVING ROOM - NIGHT (s18.1)\r\n\r\nFamilies arrive in waves. The small kitchen and smaller living room fill. The crowd tries Dominic's toasted Brussels sprouts, passed around on paper plates.\r\n\r\nThe doorbell is heard.\r\n\r\nINT. DOMINIC'S HALLWAY (S18.2)\r\nDominic answers the door and sees Dallas. Dallas quietly pulls him to the corner.\r\n\r\nDALLAS\r\n(low)\r\nIt got out. Last night. I can't find it. \r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDominic's eyes go wide. A loud bang is heard from the basement. Dominic and Dallas turn toward it.\r\n\r\nThey hurry downstairs to find the creature has made it into the basement. Dallas grabs a box for it while Dominic shuts the door behind them.\r\n\r\nINT. DOMINIC's KITCHEN (S18.3)\r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDallas drifts through the kitchen. He opens drawers quietly. Finds sugar cubes meant for coffee. Pockets one without a word. He continues to look and finds a bunch of tupawear. He grabs a couple of them. \r\n\r\nDominic catches him slipping the sugar into his pocket. He wipes his hands on a dish towel.\r\n\r\nDOMINIC\r\nWhat are you doing Dallas. \r\n\r\nDALLAS\r\nNothing. Just... getting sugar.\r\n\r\nDOMINIC\r\nFor what?\r\n\r\nDALLAS\r\nI... found a stray cat outside. It's really sick. I'm nursing it downstairs. I was getting it some sugar water.\r\n\r\nDOMINIC\r\nA cat? Alright. Well, don't grow too attached - okay? What you doing with that Tupawear - you going to put the cat in that?\r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDallas nods quickly and slips away.\r\n\r\nDownstairs, the volume of the creature frequency pulses rhythmically through the floorboards.\r\n\r\nINT. DOMINIC's BASEMENT - CONTINUOUS (s18.4)\r\nDallas is sweating. He turns the dial up. Dallas walks over to the small creature and gently rubs its furry head. \r\n\r\nDALLAS\r\n(to himself, working)\r\nIf I keep broadcasting... maybe I can teach it. If it learns the frequency, it can go back to the marsh and stay clear of those things. \r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDallas clicks a \"Master\" switch on the device. A small, protective green light flickers on.\r\n\r\nDALLAS\r\nCome on. \r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe glowing creature in the shoebox mimics the tone, its golden light flaring brighter with each successful note. But the louder it sings, the harder the walls of the basement shake. \r\n\r\nINT. DOMINIC's LIVING ROOM - UPSTAIRS CONTINUOUS (s18.5)\r\nThe last family arrive late for life group: a young couple—JOSH and SARAH—with their newborn, JP. Dominic paces in the kitchen. Mr. Mike mutters in his chair, staring at the weather through the window. \r\n\r\nThe glass pane rattles violently. \r\n\r\nMR. MIKE\r\n(to himself)\r\nThey are listening to the song. They don't like the song.\r\n\r\nDOMINIC\r\nWe have brownies about to be ready.\r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDallas tries to shuffle past people who are hovering around a kitchen island grabbing popcorn and brownies. \r\n\r\nJOSH\r\nDominic, how's the family holding up?\r\n\r\nDOMINIC\r\nWe're getting by. Thanks.\r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDallas darts past the crowd and heads for the stairs.\r\n\r\nA lifegroup member JOSH, 36, Tall and blonde, talks to PAT CLENDENEN, 60s. \r\n\r\nJOSH\r\nHow is it going for you?\r\n\r\nPAT\r\nBusy week. It's tracking that it'll hit us some point later tonight. \r\n\r\nJOSH\r\nDo you think there will be flooding. \r\n\r\nPAT\r\nDefinitely. \r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe two eat carrots and dip. \r\n\r\nJOSH\r\nDominic, where's the host.\r\n\r\nDOMINIC\r\nHe's downstairs in the basement - not feeling so good.\r\n\r\nSARAH\r\nHe knows we're here?\r\n\r\nDOMINIC\r\nYeah - he should be up in a second.\r\n\r\nINT. DOMINIC'S BASEMENT - CONTIOUS (s18.6)\r\nDownstairs, the creature is not doing so good - but seems to be glowing - and the distant hum perks up again. \r\n\r\nDominic joins Dallas and sets some sugar cubes on the table. The creature is unresponsive.\r\n\r\nDOMINIC\r\nTell me what you need.\r\n\r\nDALLAS\r\nKeep them upstairs. Give me ten minutes.\r\n\r\nThe sound of the LifeGroup singing \"Great Is Thy Faithfulness\" is muffled by the heavy basement door. Upstairs, the heavy footsteps of Dominic and the first LifeGroup guests begin to echo through the ceiling.\r\n\r\n\r\nINT. DOMINIC'S LIVING ROOM - CONTINUOUS (s18.7)\r\n\r\nTYLER\r\nAlright crew, glad we are all here - gathered together. On this breezy summer night. \r\n\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe group giggle a bit as the wind picks up. The group in a circle all look at eacother. \r\n\r\nINT. DOMINIC'S BASEMENT - CONTINOUS (s18.8)\r\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe creature lets out a little whimper.\r\n\r\nDallas adjusts the dial again. The creature quiets. The lights stabilize.\r\n\r\nDominic closes the basement door and returns upstairs before anyone notices.\n\n---\n\n\n### Scene 19: The Hymn\n\n*ACT II — The Creature | ID: the-hymn | File: s19.md*\n\n---\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n<!-- nickname: the-hymn -->\r\n<!-- summary:  -->\r\n<!-- GOING TO FILM ON DAY 11 - 6.27.26 -->\r\nINT. DOMINIC'S BASEMENT - SAME TIME (s19.1)\r\n\r\nDallas shuffles through a pile of old equipment—mono cables, spare parts and arranges them all neatly on a desk.\r\n\r\n The creature doesn't look like it's doing much. It's breathing, slightly. Dallas struggles to find a bed for it. He settles on an old shoebox—pauses when he sees his wife's handwriting on one, sets that aside—and gently nestles the creature inside. Its little feet curl tightly. It breathes slowly.\r\n\r\nHe finds a way to poke a hole in something so it can drink. The creature, laying beside him in the makeshift shoebox, begins to glow. \r\n\r\nDominic watches from the staircase. The hum in the room rises, and the creature's glow strengthens with it.\r\n\r\nDOMINIC\r\nThat's not random.\r\n\r\nDALLAS\r\nNo. It's answering.\r\n\r\nINT. DOMINIC'S LIVING ROOM - LATER (s19.2)\r\nPeople at lifegroup mill and talk. Someone asks where Dallas is.\r\n\r\nDOMINIC\r\nWe found a little cat. Dallas is downstairs nursing it.\r\n\r\nA woman stands—early fifties, warm.\r\n\r\nWOMAN\r\nI'm a retired vet. I could take a look.\r\n\r\nDOMINIC\r\nI mean— no, that's okay. I think that cat's just sleeping. We could check after?\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nAn elderly woman nods. Everyone agrees. BLAKE, one of the young couples, leads the group. \r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nSARAH, the vet, notices a physical reaction to her cup of tea - and watches it ripple in a strange way. \r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDominic closes the windows and blinds.\r\n\r\nDOMINIC\r\nGetting rough out there.\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nTYLER, 32, a young man with a guitar, hands out music sheets.\r\n\r\nTYLER\r\nWould anyone like to say any words before we start?\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThey begin to sing a hymn. As the voices rise, the hum from the basement begins to rise with them.\r\n\r\nMR. MIKE barges through the basement door. Visualablly agitated. He’s gripping a worn, leather-bound Bible, but he isn’t looking at it. He’s looking at the windows.\r\n\r\nMR. MIKE\r\nIt’s happening again. The '71 wind. Do you hear it? The Red Eyes are in the eaves! They’re sniffing the house!\r\n\r\nTYLER\r\nHello Mr. Mike - thank you for joining us! We're just about to start the hymn.\r\n\r\nMR. MIKE\r\n(ignoring him, to Dallas)\r\nYou brought it in here. The golden one. You brought the target to the shore!\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas joins behind Mr. Mike and sits beside Dominic.\r\n\r\nTYLER\r\nOh - and some more friends. We hear there is a cat downstairs. How is it doing?\r\n\r\nDALLAS\r\nIt's doing good. \r\n\r\nTYLER\r\nAnd Dallas is it? Everyone this is Dallas - he is new in town.\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas smiles a bit and rests nervously on the couch.\r\nThe overhead lights dim and then turn back. \r\n\r\nTYLER\r\nYes, on this stormy day - we can still experience grace.\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThe outside window turns into a slow pulse that matches the rhythm of the room. Sarah's tea ripples in her cup, concentric rings expanding outward in perfect time.\r\n\r\nThe hum starts to upset people as it becomes unbearable.\r\n\r\nSubtle at first. Then undeniable. The floorboards vibrate. The lights pulse lower and lower. People look at each other.\r\n\r\nDallas and Dominic exchange a look across the circle. The hum has crept under the hymn now, a low pressure that sits on the chest and presses behind the eyes, matching the concentric ripples in Sarah's tea. Each time the group hits a high note it swells.\r\n\r\nSASHA\r\nWhat was that?\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThe group listen in silence.\r\n\r\nPAT CLENDENEN\r\nMust be the wind. The boys in the office just texted me that the pressure's dropping fast.\r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas stares at the basement door. During a silent moment of reflection, the hum starts again. Everyone is unsettled. What was that noise? The group settles on the weird weather—the storm, the patterns plaguing Branford. \r\n\r\nIn time, people leave. Hugs. Goodbyes. Dominic waves them out. He waits for the last person to leave. \r\n\r\nINT. DOMINIC'S DOORWAY - CONTIOUS (s19.3)\r\nPat Clendenen walks out and puts his hand out to shake Dominic and Dallas' hand. As he does so, his eye catches the tall grass at the edge of the lawn, thrashing hard against the wind.\r\n\r\nINT. DOMINIC'S HALLWAY- CONTIOUS (s19.4)\r\nDominic shuts the door. \r\n\r\nDOMINIC\r\nAlright, let's see this cat. \r\n\r\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDominic heads toward the basement. Dallas's stomach drops and he follows.\n\n---\n\n\n### Scene 20: The Secret is Out\n\n*ACT II — The Creature | ID: red-eyes | File: s20.md*\n\n---\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n# Scene 20: The Secret is Out\r\n\r\n<!-- GOING TO FILM ON DAY 11 - 6.27.26 -->\r\nINT. DOMINIC'S BASEMENT - CONTINUOUS (s20.1)\r\n\r\nDominic descends the basement stairs. He gazes in a daze upon all of the military-grade oscillators, tangles of thick coaxial wire, and Sierra's folder spread open. The shoebox under the heat lamp is empty. The small basement hopper window is busted open, rain blowing in from the outside.\r\n\r\nDallas frantically taps his receiver. The needle flickers back and forth between frequencies. \r\n\r\nDALLAS\r\nIt's gone. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nFrom the direction of the marsh—a cry emerges that sounds like the creature. \r\n\r\nDALLAS\r\n(quiet)\r\nIt went back.\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nBefore Dallas can move, DOMINIC appears at the top of the basement stairs holding Sierra's folder of anatomical creature sketches. His face is pale. He looks at Dallas like he doesn't know him.\r\n\r\nDOMINIC\r\nDallas... what is this? \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas makes eye contact with Dominic. Outside, the hum increases and Dallas' eyes fall toward the window. Out at the tall grass swaying in the dark. The Red-Eyes are pulsing at the edge of the property.\r\n\r\nDALLAS\r\nWe have to get out there and find it before the other things do. \r\n\r\nDOMINIC\r\nWhat other things?\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas looks at Dominic with a serious expression.\r\n\r\nDOMINIC\r\nDallas. \r\n\r\nDALLAS\r\nDominic, listen—\r\n\r\nDOMINIC\r\nI listen. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas picks up the crystal device and hands it to Dominic.\r\n\r\nDOMINIC\r\nI don't get it. What is this? \r\n\r\nDALLAS\r\nIt's to keep them at bay.\r\n\r\nDOMINIC\r\nKeep who at bay?\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas points to the window. Dominic looks. In the distance, a pair of red eyes looks back at him.\r\n\r\nSuddenly, the lights in the house flicker and within a moment, the room plunges into pitch black. \r\n\r\nDominic opens a utility drawer, grabs the flashlights, and hands one to Dallas.\r\n\r\nINT. LIVING ROOM (Continous) \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDominic looks defeated. Dallas takes the flashlight from him.\r\n\r\nDALLAS\r\nYou can stay here.\r\n\r\nDOMINIC\r\nNot anymore.\r\n\r\nEXT. DOMINIC'S BACKYARD - CONTINUOUS (s20.4)\r\n\r\nDallas and Dominic walk outside in the backyard and listen to the hum that is now almost at a deafening row. \r\n\r\nDOMINIC\r\nDo you think this will work?\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas nods. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas drops to his knees, ripping open his gear bag. He scrambles out a portable speaker, slamming it onto the porch railing, aiming it directly at the creeping darkness like a shotgun. \r\n\r\nDallas rips the wire with his teeth and bridges the oscillator into the circuit. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas's hands fly over the oscillator dial, chasing the creature's pitch. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas keys the broadcast. \r\n\r\nA sound like thick glass cracking under pressure pierces the air. A high-pitched, localized frequency beam hits the lawn. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nThe grass at the edge of the yard sways rhythmically,in a direction opposit of  the wind. \r\n\r\nDallas and Dominic watch stunned as the hum disapaates. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDominic looks back at the tree line.\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas nods, his jaw tight. He looks at Dominic. \r\n\r\nDOMINIC\r\nI think I am going to sit down, not feeling so good. \r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDominic sits down on the outside porch.\r\n\r\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas lifts the sparking portable speaker. He sweeps the invisible acoustic beam across the yard like a lighthouse beam. The a small glint of a red eye - is glimmering in the distance.  A wall of Red-Eye figures violently flinches, the brush of their bodies rustling as they peel back into the reeds, leaving a temporary, circular safe zone in the pouring rain. \r\n\r\nThe orbs gather dead leaves and reeds to themselves, swelling and taking the shape of tall, ragged figures, scarecrows of brush and grass with two red eyes burning in the middle of each.\r\n\r\nBut there are too many. Hundreds of red eyes begin to dot the tree line. The sheer numbers are overwhelming the small portable speaker.\r\n\r\nFrom out in the grass, the creature's cry rises again. Dominic comes up off the porch. He looks onward and sprints towards the darkness.\n\n---\n\n\n### Scene 21: The Burn Marks\n\n*ACT II — The Creature | ID: creature-missing | File: s21.md*\n\n---\n\n<!-- scene: 21 file: s21.md nickname: creature-missing -->\n\n# Scene 21: Into the Grass\r\n\r\n<!-- GOING TO FILM ON : Day 11 = Wednesday -->\r\n\r\nEXT. DALLAS'S BACKYARD - NIGHT (s21.2)\r\nDominic bursts through the backyard towards the street, towards the neighborhood, flashlight in hand. He makes his way to the field of no -man land - where they found the creatures. \r\n\r\nDallas - watching him sprint - grabs his tracker device and begins to chase after him. On the screen the creature is blinking. \r\n\r\nDominic runs straight for the tall grass at the edge of their house. \r\n\r\nEXT. TALL GRASS (S21.3)\r\nAs Dominic runs through the tall grass, distant howls flood the atmosphere. \r\nAt the porch, the open door swings in the wind. In the distance a pair of red eyes flares bright, dims, and disappears behind Dominic's flashlight.\n\n---\n\n\n## ACT III — The Return\n\n---\n\n\n### Scene 22: The Load-Out\n\n*ACT III — The Return | ID: marsh-confrontation | File: s22.md*\n\n---\n\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n# Scene 22: The Load-Out\r\n\r\n<!-- GOING TO FILM ON : Day 13 = Wednesday -->\r\n\r\nEXT. MARSH - EDGE (s22.1)\r\n\r\nThe crew gears up. Dallas shoulders his broadcast rig — the oscillator, the spare Asher gave him, a coil of cable — and keeps the handheld tracker. He moves fast and sure; he has the creature's call rebuilt and ready.\r\n\r\nDominic carries no tech. He steps to the front, jaw set. He can feel it out there in the dark, and there's no version of this where he lets his family walk in without him. He shoulders the backpack with the baby creature and goes first.\r\n\r\nThe plan is thin and Dallas knows it. Reach the center, push the creature's own call out through every recorder Asher planted across the marsh, and call its kind home to it.\r\n\r\nAsher stayed back at the house with Mr. Mike. The old man is shaking, agitated, hates every second of this, and someone has to keep him calm. The two of them go in now.\r\n\r\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n(action)\nDallas pats his bag and comes up empty. The portable speaker is still at Asher's lair.\r\n\r\nDALLAS\r\nThe speaker's back at the wigwam. Two minutes.\r\n\r\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n(action)\nHe breaks off from Dominic and runs into the trees.\r\n\r\nINT. ASHER'S LAIR - CONTINUOUS (s22.2)\r\n\r\nDallas ducks through the low opening of the wigwam, a wooden dome lashed together at the edge of the woods. Inside, Asher's maps and bead strings are still spread across the floor.\r\n\r\nHe goes straight to the gear bench. He seats the oscillator and thumbs the dial until the screen wakes with a thin green line. He grabs the small portable speaker and pushes it into his bag.\r\n\r\nDallas takes one last look at the maps on the floor, then ducks back out into the dark.\r\n\r\nEXT. MARSH - EDGE (s22.3)\r\n\r\nDallas jogs back to Dominic, cinching the last strap as he comes, already watching the tracker.\r\n\r\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n(action)\nDallas follows the tracker into the woods - and sees it beep beep - as he approaches the place where he found the creature.\n\n---\n\n\n### Scene 23: The Trench Run\n\n*ACT III — The Return | ID: predator-attack | File: s23.md*\n\n---\n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n# Scene 23: The Trench Run\r\n\r\nEXT. TALL GRASS - CONTINUOUS (s23.1)\r\nDallas enters the tall grass carrying the tracker, watching the green light. \r\n\r\nDallas stops for a moment in pain. He looks down at the little green light on the tracker, then presses a hand to his temple. The hum sits behind his eyes like a weight, and he stumbles and steadies himself.\r\n\r\nIn the distance the creature begins to cry along with \r\n\r\nSuddenly, Dominic appears and runs towards Dallas.\r\n\r\nDOMINIC\r\nDallas - I saw it. It was right there and then it was gone. Fix up your tracker - make it show where it went. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDominic begins to pace around.  A giant roar is heard off in the distance.\r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas and Dominic continue to make their way deeper in. Dallas drops to the ground.  \r\n\r\nDOMINIC\r\nYou okay?\r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas sets his jaw and stoically marches onward.  Dominic wipes the rain from his face and pushes forward. \r\n\r\nAs they cross the threshold, they plunge into sensory deprivation. \r\n\r\nThe tall grass towers over their heads, ten feet high and thick like jungle vines. The wind is howling, whipping the stalks in violent, unpredictable rhythms. \r\n\r\nIt is pitch black. The only light is the small, blinking green LED on Dallas’s chest rig. Dominic follows it.\r\n\r\nDallas catches up with Dominic who is out of breath in the pitch black. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThe green light on Dallas's tracker stutters and dies. The creature's signal is gone. He shakes the device and gets nothing back from it.\r\n\r\nDallas turns a slow circle. Every direction is the same wall of black grass bending in the wind. He has lost the way in and the way out.\r\n\r\nDALLAS\r\nThe signal's gone. I lost it.\r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThey push one way and double back, and the grass closes behind them and swallows the path. The two of them end up turned around in the dark, soaked and breathing hard.\r\n\r\nThen a red light blinks on far out in the grass, another opens beside it, and a dozen more spread through the black at different heights. The red eyes are flashing now.\r\n\r\nDOMINIC\r\nDallas, lets go back.\r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas moves forward. \r\n\r\nDALLAS\r\nThose things are after it. \r\n\r\nThe two move quickly in single file. Dallas is leading, sweeping the handheld speaker back and forth like a flashlight, watching the tracker. Behind him is Dominic, hunched low, clutching the backpack with the golden creature, breathing heavily, watching the tree line behind them, his boots sinking deep into the marsh mud. \r\n\r\nDALLAS\r\nStraight ahead. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThe air is thick, humid, and heavy. Dead leaves and brittle reeds are matted in tangles everywhere on the ground, dry and rustling as the wind moves through them. \r\n\r\nDALLAS\r\nThey're above us. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDominic looks up. Above the swaying tops of the grass, massive ragged shapes move through the dark, tangles of grass and brush the size of cars, drifting and turning. Hundreds of red eyes pierce the dark, hunting. \r\n\r\nSuddenly, a massive figure drops down into the grass fifty feet ahead of them. \r\n\r\nThe concussive force of its landing knocks Dominic to his knees. He clutches the backpack with the baby to his chest, shielding it. \r\n\r\nDOMINIC\r\nIt's right on us. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas freezes. The Red-Eye is directly in their path, thrashing through the reeds. Long arms of matted grass and bramble drag across the dirt in a wide arc. \r\n\r\nDOMINIC\r\n(panic rising)\r\nIt's patrolling. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThe figure creeps closer, forty feet away, then thirty. Its bramble arms drag toward Dominic's boot. \r\n\r\nEXT. MARSH - CONTINUOUS (s23.3)\r\n\r\nIt stops. Its massive red eyes scan the area. It senses something. The silence stretches. Dallas freezes, holding his breath, gripping the tracker. \r\n\r\nDallas's hand shoots out and claps over the blinking green LED on his chest rig. Darkness swallows them. The two of them drop low into the mud, pressed flat against the reeds, not breathing. \r\n\r\nThe Red-Eye drifts closer. Its bramble arms sweep the grass inches above their heads. Dry leaves spill down toward Dominic's hand. He holds completely still. \r\n\r\nThe figure hangs over them for one unbearable moment, then loses the thread. Its head swings away, and it turns and drifts off into the darkness, hunting something it can no longer find. \r\n\r\nDallas exhales slowly and uncovers the LED. \r\n\r\nDALLAS\r\n(whispering)\r\nKeep moving. The center is close. \r\n\r\nDominic groans, pulling his boot out of a foot of thick, sucking mud. He re-shoulders the backpack with the baby. Dallas grabs his arm, helping him up. \r\n\r\nDALLAS\r\nYou good?\r\n\r\nDOMINIC\r\n(gritting teeth)\r\nNever better. Just a light hike in the country. Let's go. \r\n\r\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThey push forward, deeper into the howling void.\n\n---\n\n\n### Scene 24: The Sanctuary & The Siege\n\n*ACT III — The Return | ID: the-perimeter | File: s24.md*\n\n---\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n# Scene 24: The Mother & The Swarm\r\n\r\nEXT. CENTER OF THE MARSH - LATER (s24.1)\r\n\r\nThe howling wind dies down.\r\n\r\nDominic breaches through a thick wall of reeds and stops. \r\n\r\nDallas breaks through behind him and collapses to his knees in the mud.\r\n\r\nThey are standing in a small clearing where the tall grass lies flattened in a rough circle, about fifty feet across. The storm rages overhead, but down here the air is calm and quiet.\r\n\r\nA faint gold light glows at the center of the clearing.\r\n\r\nA single creature waits there. She is much larger than the injured baby, covered in thick, iridescent golden fur. She looks ancient and worn. Low in her chest she carries a deep, resonant hum that vibrates the air around her.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nDominic swings the backpack around and kneels. He lifts the small creature out with both hands. Its neck-glow, weak and erratic the whole way in, flares bright gold as it hears the hum.\r\n\r\nDominic gently sets the baby down in the mud. The tiny being stumbles forward and lets out a high-pitched chirp.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nThe great creature turns her head. She sees the baby.\r\n\r\nShe rises onto her legs.\r\n\r\nThe baby chirps again, louder and frantic now, and scrambles across the flattened grass toward her.\r\n\r\nThe mother lowers her great head all the way to the ground and presses her brow against the baby. The baby burrows into the fur of her neck.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nDominic watches from his knees, frozen, close enough to feel the heat of them. His hand drifts to his mouth.\r\n\r\nDOMINIC\r\n(barely a whisper)\r\nThat's its mother.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nThe mother lifts her head and looks at the two men. At Dominic. Then at Dallas. She bows once, a single low note that rattles Dallas's ribs in the best possible way.\r\n\r\nFor one moment, everything is still.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nDallas looks down at the screen on his chest rig. The jagged red lines are spiking massively at the edge of the clearing.\r\n\r\nDALLAS\r\nThey followed us in.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nA heavy, crushing sound slams into the wall of grass at the edge of the clearing. The air shudders violently. The calm breaks.\r\n\r\nDozens of massive RED-EYE figures burst through the grass, tangles of dead leaves and bramble lurching upright, red eyes burning in each one. Dead leaves spill across the clearing floor.\r\n\r\nThe mother wheels around and roars. Her cry lands as a blast of golden light that throws the nearest figures back. She plants herself between the swarm and the baby.\r\n\r\nIt's a horrific clash. Golden light meets dry, lurching brush in violent, ozone-scented snaps. The Red-Eyes lurch in, rustling, swallowing the light as they come.\r\n\r\nDOMINIC\r\nWhat the heck even is that?\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nThe massive Red-Eyes converge on the mother, their bramble arms tearing into her golden light. She curls her whole body around the baby, shielding it, taking the assault on her own back.\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nDallas rips the small portable speaker from his bag and fires it at the nearest figure. A thin acoustic beam hits it. The figure flinches, sheds a sheet of dead leaves, then keeps coming. The little device whines, overheats, and dies in his hands.\r\n\r\nDOMINIC\r\nDallas - it's not enough!\r\n\r\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nDallas is already moving. He drops to his knees and sets the oscillator and the spare down in the mud, hands flying over the dials.\r\n\r\nDALLAS\r\nWe're done shouting at them. I'm sending its own call back out, through every recorder we ever planted.\n\n---\n\n\n### Scene 25: The Final Blast\n\n*ACT III — The Return | ID: the-last-dinner | File: s25.md*\n\n---\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n# Scene 25: The Answer\r\n\r\nEXT. CENTER OF THE MARSH - CONTINUOUS (s25.1)\r\n\r\nDallas presses both thumbs to the oscillator and pushes the creature's call out into the storm — the pulse he rebuilt over all those nights, fed through the spare and out across every recorder staked in the marsh.\r\n\r\nFor a moment the call rolls out over the grass, steady and clear under the howl of the wind.\r\n\r\nThe Red-Eyes keep coming. The figures pour over the flattened ring, dragging their bramble arms through the mud toward the mother and the baby. Dallas grits his teeth and holds the call. It pushes them back a step, and then no further.\r\n\r\nDALLAS\r\n(straining)\r\nCome on. Come on. One source was never going to be enough —\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe mother is failing. The Red-Eyes pile onto her, and her golden light dims under the weight of them.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThen, far out in the dark, one of the spherical recorders tears up off its stake.\r\n\r\nIt streams through the air toward the center of the ring, drawn as if something has reached out and pulled it. Another rips loose behind it. Then a dozen. Then the whole field.\r\n\r\nAcross hundreds of yards of marsh, every recorder the crew ever planted pulls up out of the reeds and flies inward, homing on the creature. The crew built these to hunt it. Now they watch them become its voice.\r\n\r\nDOMINIC\r\n(staring up)\r\nWhat is that... what are they doing...\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe recorders converge on the baby and the mother, a streaming halo of small machines, and as they gather they pour the call back out a thousandfold — the creature's own voice, answered and amplified from every direction at once.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe Red-Eye figures stop.\r\n\r\nThe red eyes flicker. The brush that holds their shape loses its grip, and the tangles of grass and bramble come apart in the wind. One by one the figures collapse into ordinary piles of dead leaves and reeds, scattering low across the mud. The red eyes go dark.\r\n\r\nThe wind drops. The marsh goes quiet.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nIn the calm, the mother lowers herself into the flattened grass with the baby still tucked against her. Her golden light is very faint now, guttering like a candle at the end of its wick.\r\n\r\nShe presses her brow to the baby one last time. Then her light thins and lifts off her, gold rising into the night air, and she goes out softly and scatters on the breeze.\r\n\r\nWhere she lay, only flattened grass remains.\r\n\r\nEXT. CENTER OF THE MARSH - CONTINUOUS (s25.3)\r\n\r\nDominic is the first to move, herding them toward the gap in the reeds. Dallas stops.\r\n\r\nOut across the ruined clearing, in the settling quiet, something small moves in the flattened grass.\r\n\r\nIt is the baby, alive, pulling itself up out of the spot where the mother lay, its neck-glow flickering faint gold. It takes a few unsteady steps away from them, toward the open dark, then stops.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nIt turns its head and looks back. Across the whole ruined clearing, it finds Dallas. Then Dominic.\r\n\r\nFor a long moment, none of them move. Dallas, hollowed out by grief, Dominic, who kept reaching for him with words, and the orphaned creature they carried this whole way look at each other across the silence.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe baby holds Dallas's eyes a beat longer. Something passes between them that feels like recognition, a thank you and a goodbye at once.\r\n\r\nThen its small body softens at the edges, gold light bleeding off it into the night air, and it dissolves, scattering into the ether like breath on a cold morning, until the grass where it stood is empty.\r\n\r\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nDominic lets out a massive, shuddering breath. Dallas keeps staring at the empty grass.\r\n\r\nDominic, quiet now, puts a hand on Dallas's shoulder and gently turns him toward home.\r\n\r\nDOMINIC\r\n(softly)\r\nCome on. Let's go home.\n\n---\n\n\n## ACT IV — Aftermath\n\n---\n\n\n### Scene 26: The Morning After\n\n*ACT IV — Aftermath | ID: final-echoes | File: s26.md*\n\n---\n\n<!-- scene: 26 file: s26.md nickname: final-echoes -->\n\n# Scene 26: The Morning After\r\n<!-- scene: 26 file: s26.md nickname: final-echoes -->\n\n(action)\nEXT. TALL GRASS (s26.1)\r\nThe crew walk back through the tall grass, through neighborhoods, back and slow. \r\n\r\nINT. DALLAS'S HOUSE (s26.2)\r\nDallas and Dominic make their way through the door, soaked and exhausted.\r\n\r\nDOMINIC\r\n(dry, quiet)\r\nStill got power.\r\n\r\nDOMINIC\r\nThanks for letting everyone crash here, Dallas.\n\n---\n\n\n### Scene 27: Aftermath\n\n*ACT IV — Aftermath | ID: aftermath | File: s27.md*\n\n---\n\n<!-- scene: 27 file: s27.md nickname: aftermath -->\n\n<!-- nickname: little aftermath -->\r\n\r\nEXT. BRANFORD - DAY (s27.1)\r\n\r\nThe town is back to normal. People move through their routines. The strange occurrences of the last few days are still on everyone's lips—muted, half-disbelieved.\r\n\r\nEXT. CENTER OF THE MARSH - DAY (s27.2)\r\nDallas walks alone into the flattened ring of grass from the night before. The storm is gone. He finds the gear they left behind in the flight — his oscillator and one of the spherical recorders, half-sunk in the mud, the screen cracked but still faintly glowing. He picks it up. The screen shows a saved file: one clean recording.\r\n\r\nHe presses play. The sound fills the quiet marsh— it is the tune from the golden furry creatures, captured clean. \r\n\r\nDallas holds play for a long moment. He looks at the photo of Sierra on his receiver. \r\n\r\nEXT. BRANFORD - OUTSIDE PIZZA PLACE - DAY (s27.3)\r\n\r\nPAT CLENDENEN, microphone in hand, stands by a windy flag by the PIZZA and POST OFFICE - place on 142 branford road. \r\n\r\nPAT CLENDENEN\r\nThe Nor'easter's last-second shift—call it an unlikely miracle. Either way, a good safety warning. This town's prepared now.\r\n\r\nEXT. CHURCH GROUNDS - DAY (s27.4)\r\n\r\nA church event. Picnic tables. Nica's catered lunch. DOMINIC and DALLAS greet each other. They don't talk much. They sit next to each other and eat. \r\n\r\nDallas holds a tray of Chicken Primevera. \r\n\r\nMR. MIKE sits at the end of the table, peacefully eating a piece of cornbread. He looks out toward the edge of the woods and smiles softly. \r\n\r\nMR. MIKE\r\n(to himself)\r\nQuiet now. The song is finally right. Javarice would have loved the quiet.\r\n\r\nINT. DALLAS'S WORKSHOP / HOUSE - DAY (s27.5)\r\n\r\nDallas at his kitchen table and grabs a battery as he walks to his workbench. He begins to fiddle with a recording mechniasm. And feed water to a tiny plant. He finally gets it working. He hits record. From outside, a low hum, different from before, bleeds into the room. He listens. He begins to sketch—notations, marks. An alphabet.\n\n---\n\n\n### Scene 28: Full Circle\n\n*ACT IV — Aftermath | ID: full-circle | File: s28.md*\n\n---\n\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n# Scene 28: Full Circle\r\n<!-- summary: Dallas and Asher pack up the lair. Dallas misreads one last spike and lets it go. Dallas finds his wife's specific hum out in the marsh. -->\r\n\r\nEXT. ASHER'S LAIR - DAY (s28.1)\r\n\r\nDallas walks up to the wooden structure in the woods. Asher is already there, but he isn't building—he is packing up. The trail cameras are being taken down. The massive array of wires is being rolled into neat coils. Out in the reeds the little amber nodes are going dark one by one as Asher gathers them in — and for each one he collects, he slips a single bead off the string around his neck.\r\n\r\nDallas pulls his portable oscillator out of his bag and powers it up one last time. \r\n\r\nThe screen flares to life. Suddenly, the clean, perfect, golden sine wave spikes violently into a jagged red pattern. \r\n\r\nDallas tenses up instantly. His hand hovers over the dial. The old instinct to control, to predict the danger, surges back. \r\n\r\nDALLAS\r\n(panicked)\r\nIt's a spike. They're coming back. Asher, we need to—\r\n\r\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n(action)\nAsher walks over. He looks at the screen. He doesn't look panicked. He points at the wind whipping through the high branches of the trees, then points back at the screen. \r\n\r\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n(action)\nDallas looks at the trees. He listens. The terrifying hum is gone. It is just the wind in the reeds. The storm is passing. He misread it. \r\n\r\nHe looks at Asher, who is perfectly calm. Asher nods once.\r\n\r\nDallas lets out a long, shuddering breath. He accepts the correction. The tension leaves his shoulders. He smiles, finally letting the interpretation go. \r\n\r\nHe reaches down and actively unplugs the machine. The screen goes dark. He zips his gear bag, and they walk out of the woods together.\r\n\r\nINT. DALLAS'S BEDROOM - NIGHT (s28.2)\r\n\r\nDallas goes to bed. The device sits on the nightstand. He hears echoes. Something beyond the shadows he saw before. He lies there. Listening. He goes and checks on the plant.\r\n\r\nEXT. DALLAS'S DRIVEWAY - MORNING (s28.3)\r\n\r\nDominic pulls up. He gets out. He and Dallas hug. They share a quiet morning beat. As Dominic heads off, Dallas's eyes catch something out in the tall grass. He's drawn toward it. Dallas looks toward the creek.\r\n\r\nEXT. CREEK BEND - DAY (s28.4)\r\n\r\nDallas walks alone with his wife's receiver in hand. The place where the lawn becomes reed. The same bend from before. Dallas stops. He lifts the receiver. He tunes the dial. The hum rises, falls. He adjusts again. The dial clicks into place. He stands there. Recording. The tall grass does not move - and neither does Dallas. \r\n\r\nIn the Tall Grass Dallas senses the creature - and plays the pure recording of their hum - and realizes that it matches the exact cadence of Sierra's song.\n\n---\n\n";
    const MARKDOWN_FILE_NAME = 'creatures_in_the_tall_grass_full_script.md';

    function downloadMarkdown() {
      const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = MARKDOWN_FILE_NAME;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function printMarkdownPdf() {
      const printable = window.open('', '_blank', 'noopener,noreferrer');
      if (!printable) return;
      const escaped = String(markdown)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const title = document.title.replace(/<\/?[^>]+>/g, '');
      printable.document.write([
        '<!doctype html>',
        '<html lang="en">',
        '<head>',
        '  <meta charset="UTF-8">',
        '  <meta name="viewport" content="width=device-width, initial-scale=1.0">',
        '  <title>' + title + ' - Markdown</title>',
        '  <style>',
        '    body { margin: 1in; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }',
        '    pre { white-space: pre-wrap; line-height: 1.35; font-size: 11pt; }',
        '  </style>',
        '</head>',
        '<body>',
        '  <pre>' + escaped + '</pre>',
        '</body>',
        '</html>',
      ].join('\n'));
      printable.document.close();
      printable.focus();
      printable.print();
      printable.onafterprint = () => printable.close();
    }
    const container = document.getElementById('scriptContent');
    marked.setOptions({ breaks: true });
    container.innerHTML = marked.parse(markdown);

    // Export dropdown: toggle on trigger click, close on outside click or menu action
    (function initExportDropdown() {
      var trigger = document.getElementById('scriptExportTrigger');
      var menu = document.getElementById('scriptExportMenu');
      if (!trigger || !menu) return;
      function open() {
        menu.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }
      function close() {
        menu.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      }
      trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        if (menu.classList.contains('is-open')) close(); else open();
      });
      menu.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() { close(); });
      });
      document.addEventListener('click', function() { close(); });
    })();

    // Format screenplay elements
    formatScreenplay(document.querySelector('.screenplay-container'));

    // Filmmaking-style page length & runtime (1 page ≈ 1 minute; ~250 words/page)
    // Count from raw markdown so we get the full script (DOM textContent can undercount)
    (function initScriptStatsAndProgress() {
      const WORDS_PER_PAGE = 250;
      const content = document.getElementById('scriptContent');
      const progressFill = document.getElementById('scriptProgressFill');
      const progressLabel = document.getElementById('scriptProgressLabel');
      const progressBar = document.querySelector('.script-progress-bar');

      if (!progressFill) return;

      const wordCount = (typeof markdown === 'string' ? markdown : (content && content.textContent) || '')
        .split(/\s+/)
        .filter(Boolean)
        .length;
      const MIN_PAGES = 90;
      const rawPages = Math.round((wordCount / WORDS_PER_PAGE) * 10) / 10;
      const estimatedPages = Math.max(MIN_PAGES, rawPages);
      const estimatedMinutes = Math.max(MIN_PAGES, Math.round(estimatedPages));

      function updateProgress() {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        if (scrollHeight <= 0) {
          progressFill.style.height = '0%';
          progressLabel.textContent = '0 / ' + estimatedMinutes;
          if (progressBar) progressBar.setAttribute('aria-valuenow', 0);
          return;
        }
        const pct = Math.min(1, Math.max(0, scrollTop / scrollHeight));
        const currentMinute = Math.min(estimatedMinutes, Math.floor(pct * estimatedMinutes));
        progressFill.style.height = (pct * 100) + '%';
        progressLabel.textContent = currentMinute + ' / ' + estimatedMinutes;
        if (progressBar) progressBar.setAttribute('aria-valuenow', Math.round(pct * 100));
      }

      updateProgress();
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
    })();

    // Scene nav: add ids to scene headings and wire dropdown to scroll
    (function initSceneNav() {
      const content = document.getElementById('scriptContent');
      const selectEl = document.getElementById('scriptSceneSelect');
      if (!content || !selectEl) return;

      const sceneHeadings = content.querySelectorAll('h3');
      const sceneHeadingRe = /^Scene \d+[A-Z]*:/i;
      sceneHeadings.forEach((h3, i) => {
        const text = (h3.textContent || '').trim();
        if (sceneHeadingRe.test(text)) {
          h3.id = 'scene-' + (i + 1);
        }
      });

      selectEl.addEventListener('change', function() {
        const value = this.value;
        if (!value) return;
        const el = document.getElementById(value);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        this.value = '';
      });
    })();

    // Wrap each scene in a scene-wrapper div for print isolation
    // Must be called AFTER initSceneNav so scene headings have IDs
    wrapScenes(document.getElementById('scriptContent'));

    // Status bar: current scene, who's in scene, production tags (updates on scroll)
    (function initStatusBar() {
      const content = document.getElementById('scriptContent');
      const sceneEl = document.getElementById('scriptStatusScene');
      const charsEl = document.getElementById('scriptStatusCharacters');
      const prodEl = document.getElementById('scriptStatusProduction');
      if (!content || !sceneEl) return;

      function getSceneHeadingsInOrder() {
        const h3s = content.querySelectorAll('h3[id^="scene-"]');
        return Array.from(h3s).sort((a, b) => {
          const nA = parseInt(a.id.replace('scene-', ''), 10);
          const nB = parseInt(b.id.replace('scene-', ''), 10);
          return nA - nB;
        });
      }

      function getSceneBlock(sceneH3, nextSceneH3) {
        const chars = new Set();
        let firstSlug = '';
        let node = sceneH3.nextSibling;
        while (node) {
          if (node === nextSceneH3) break;
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains('character-name')) {
              const name = (node.textContent || '').trim();
              if (name) chars.add(name);
            }
            if (!firstSlug && node.classList && node.classList.contains('scene-heading')) {
              firstSlug = (node.textContent || '').trim();
            }
          }
          node = node.nextSibling;
        }
        return { characters: Array.from(chars), production: firstSlug };
      }

      function updateStatusBar() {
        const sceneHeadings = getSceneHeadingsInOrder();
        if (sceneHeadings.length === 0) return;
        const viewportThreshold = 160;
        let current = sceneHeadings[0];
        for (let i = 0; i < sceneHeadings.length; i++) {
          const top = sceneHeadings[i].getBoundingClientRect().top;
          if (top <= viewportThreshold) current = sceneHeadings[i];
        }
        const title = (current.textContent || '').trim();
        const nextId = current.id.replace('scene-', '');
        const nextNum = parseInt(nextId, 10) + 1;
        const nextScene = document.getElementById('scene-' + nextNum);
        const block = getSceneBlock(current, nextScene || null);
        sceneEl.textContent = title || '—';
        charsEl.textContent = block.characters.length ? block.characters.join(', ') : '—';
        prodEl.textContent = block.production || '—';
      }

      updateStatusBar();
      window.addEventListener('scroll', updateStatusBar, { passive: true });
      window.addEventListener('resize', updateStatusBar);
    })();

    // Download individual scene as PDF
    function downloadScenePdf() {
      const select = document.getElementById('printSceneSelect');
      const sceneNum = parseInt(select.value, 10);
      if (!sceneNum || isNaN(sceneNum)) {
        alert('Please select a scene');
        return;
      }

      const sceneWrapper = document.querySelector('[data-scene-num="' + sceneNum + '"]');
      if (!sceneWrapper) {
        alert('Scene not found');
        return;
      }

      // Get scene title from h3
      const heading = sceneWrapper.querySelector('h3');
      const sceneTitle = heading ? heading.textContent.trim() : 'Scene ' + sceneNum;

      // Clone the scene for PDF generation (so we don't modify the original)
      const element = sceneWrapper.cloneNode(true);

      // Remove ID so it doesn't conflict
      element.removeAttribute('id');
      element.removeAttribute('data-scene-num');

      // PDF options
      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: 'Scene_' + String(sceneNum).padStart(2, '0') + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      // Generate PDF
      html2pdf().set(opt).from(element).save();

      // Close the modal
      document.getElementById('printSceneModal').close();
    }

    function looksLikeActionIntro(text) {
      if (!text || text.length < 15) return false;
      if (/^\(.+\)$/.test(text)) return false;
      if (/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(text)) return false;
      if (/^[A-Z][a-z]+,\s*(?:Mid\s*\d+s|\d+s|[A-Za-z\s]+),/.test(text) && /[a-z]/.test(text)) return true;
      if (/^[A-Z][a-z]+,\s*(?:Mid\s*\d+s|\d+s)\s*[,.]/.test(text)) return true;
      return false;
    }

    // Wrap each scene in a divider for print isolation
    function wrapScenes(container) {
      if (!container) return;
      // Create a static array copy so we don't have stale references as we modify DOM
      const sceneHeadings = Array.from(container.querySelectorAll('h3[id^="scene-"]'));

      sceneHeadings.forEach((heading, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'scene-wrapper';
        wrapper.setAttribute('data-scene-num', idx + 1);

        // Get the next heading reference (the boundary for this scene)
        const nextHeading = sceneHeadings[idx + 1];

        // Get the first sibling BEFORE we modify the DOM
        let node = heading.nextSibling;

        // Insert wrapper before heading
        heading.parentNode.insertBefore(wrapper, heading);

        // Move heading into wrapper
        wrapper.appendChild(heading);

        // Move all content nodes after heading (until next heading) into wrapper
        while (node && node !== nextHeading) {
          const next = node.nextSibling; // Save next before moving
          wrapper.appendChild(node);     // This changes node's parent
          node = next;                   // Move to the saved next
        }
      });
    }

    function formatScreenplay(container) {
      const content = container.querySelector('.screenplay-content');
      if (!content) return;

      normalizeParagraphBreaks(content);

      const paragraphs = content.querySelectorAll('p');
      let inDialogueBlock = false;
      
      paragraphs.forEach((p, index) => {
        const text = p.textContent.trim();
        const nextP = paragraphs[index + 1];
        const prevP = paragraphs[index - 1];
        
        // Skip if already formatted (but allow normalizeParagraphBreaks output)
        if (!text) return;
        if (p.classList.length > 0 && !p.classList.contains('line-split')) return;
        
        // Scene headings (INT. or EXT. at start of line)
        if (/^(INT\.|EXT\.)/i.test(text)) {
          p.className = 'scene-heading';
          
          // Check for scene ID at the end: (s01.1)
          const idMatch = text.match(/\((s\d+\.\d+)\)$/i);
          if (idMatch) {
            const id = idMatch[1].toLowerCase();
            const cleanText = text.replace(idMatch[0], '').trim();
            p.innerHTML = '<span class="scene-id">' + id + '</span>' + cleanText.toUpperCase();
          } else {
            p.textContent = text.toUpperCase();
          }
          
          inDialogueBlock = false;
          return;
        }
        
        // Transitions (right-aligned, uppercase)
        if (/^(FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text)) {
          p.className = 'transition';
          p.textContent = text.toUpperCase();
          inDialogueBlock = false;
          return;
        }

        // Action break: (action) on its own line — ends dialogue block, next line is action; line is hidden
        if (/^\(action\)$/i.test(text)) {
          p.className = 'action-break';
          p.textContent = '';
          inDialogueBlock = false;
          return;
        }
        
        // Parentheticals (text in parentheses, italic) - check before character names
        if (/^\(.+\)$/.test(text)) {
          p.className = 'parenthetical';
          inDialogueBlock = true;
          return;
        }

        // Action lines that introduce a character or describe action (e.g. "Dominic, early 40s, puts his hand...")
        // Never treat these as dialogue so they don't get wrapped with the previous speaker
        if (looksLikeActionIntro(text)) {
          p.className = 'action-line';
          inDialogueBlock = false;
          return;
        }
        
        // Character names (all caps, typically short, not scene headings)
        const isAllCaps = /^[A-Z][A-Z\s\.'-]+$/.test(text) && text === text.toUpperCase();
        const isReasonableLength = text.length > 2 && text.length < 35;
        const isNotSceneHeading = !/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(text);
        
        if (isAllCaps && isReasonableLength && isNotSceneHeading) {
          const nextText = nextP ? nextP.textContent.trim() : '';
          const looksLikeDialogue = nextText && (
            /^\(.+\)$/.test(nextText) ||
            (!/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(nextText) && 
             !/^[A-Z][A-Z\s\.'-]+$/.test(nextText))
          );
          
          if (looksLikeDialogue || !prevP || prevP.classList.contains('action-line') || prevP.classList.contains('scene-heading')) {
            p.className = 'character-name';
            p.setAttribute('data-character', text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
            inDialogueBlock = true;
            return;
          }
        }
        
        // Dialogue (follows character name / parenthetical / dialogue)
        const looksLikeNewBlock = /^(INT\.|EXT\.|FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text);
        const looksLikeCharacter = isAllCaps && isReasonableLength && isNotSceneHeading;
        if (!looksLikeNewBlock && !looksLikeActionIntro(text) && inDialogueBlock && prevP && (prevP.classList.contains('character-name') || prevP.classList.contains('parenthetical') || prevP.classList.contains('dialogue'))) {
          p.className = 'dialogue';
          inDialogueBlock = true;
          return;
        }
        
        // If we're in a dialogue block but this doesn't match, end the block
        if (looksLikeCharacter || looksLikeNewBlock) {
          inDialogueBlock = false;
        }
        
        // Default: action line
        p.className = 'action-line';
        inDialogueBlock = false;
      });

      // Add markers for last line in dialogue / parenthetical blocks (spacing)
      const ps = content.querySelectorAll('p');
      ps.forEach((p, i) => {
        if (!p.classList.contains('dialogue') && !p.classList.contains('parenthetical')) return;
        const next = ps[i + 1];
        if (!next || (!next.classList.contains('dialogue') && !next.classList.contains('parenthetical'))) {
          if (p.classList.contains('dialogue')) p.classList.add('dialogue-last');
          if (p.classList.contains('parenthetical')) p.classList.add('parenthetical-last');
        }
      });
    }

    // Split <p> blocks that contain <br> into separate <p>s per line.
    // This lets screenplay formatting work even if the markdown uses single newlines.
    function normalizeParagraphBreaks(content) {
      const paragraphs = Array.from(content.querySelectorAll('p'));
      paragraphs.forEach((p) => {
        if (!p.querySelector('br')) return;
        const parts = p.innerHTML
          .split(/<br\s*\/?\s*>/i)
          .map((s) => s.replace(/&nbsp;/g, ' ').trim())
          .filter(Boolean);
        if (parts.length <= 1) return;

        const frag = document.createDocumentFragment();
        parts.forEach((html) => {
          const np = document.createElement('p');
          np.innerHTML = html;
          frag.appendChild(np);
        });
        p.replaceWith(frag);
      });
    }
  </script>
