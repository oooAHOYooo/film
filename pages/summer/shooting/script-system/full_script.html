king eye contact. \n\nMAKAYLA\nWell they do... I mean - if i hit this button here - boom. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nMakayla points her device at a small nearby flower. She nods and takes out a pocket tripod - and a pocket microphone - and begins to to record. \n\nMAKAYLA\nMost people will never understand what happened today. Or what happens out here at all. Dominic might. \n\n<!-- scene: 15B file: s15b.md nickname: the-tracking-box -->\n\n(action)\nMakayla hands Dallas a small wooden box. Dallas opens it and finds a small translucent crystal inside—a crude pyramid-like stone. Dallas holds it, fascinated.\n\nMAKAYLA\nWhat do you think?\n\nDALLAS\nSeems like a quartz.\n\n---\n\n\n### Scene 15C: Dominic's Confession\n\n*ACT II — The Creature | ID: dominics-confession | File: s15c.md*\n\n---\n\n<!-- scene: 15C file: s15c.md nickname: dominics-confession -->\n\n<!-- GOING TO FILM ON Day 5 -->\n\n\n`\n<!-- scene: 15C file: s15c.md nickname: dominics-confession -->\n\n(action)\nMakayla walks over and puts the cystal on top of a little bay area device that is also hidden by a bunch of branches. Makayla grabs the crystal - puts it in the center - and turns it on via a bunch of 9V batteries. She points to the two metal rods that are coming out of the portable wooden device - and nudges Dallas to grip. \n\n<!-- scene: 15C file: s15c.md nickname: dominics-confession -->\n\n(action)\nDallas grips - and has a wild trip.  As he does - a distant cry is heard in the distance. \n\nDallas wakes up. \n\n\nMAKAYLAA\nSo, what do you think?\n\nDALLAS\nWhat is it?\n\nMAKAYLA\nWe don't know. But I wonder what would happen if we hook up the creature to it - and your oscillator. That night you found the creature - it let out a big BOOM.\n\n<!-- scene: 15C file: s15c.md nickname: dominics-confession -->\n\n(action)\nIn the distance the howls are getting more ganrly. Makayla and Dallas stand silent in fear.\n\n<!-- scene: 15C file: s15c.md nickname: dominics-confession -->\n\n(action)\nDallas begins to record a bit on his pocket recorder. \n\nMAKAYLA\n(takes a deep breath and contemplates for a while)\nWe should go.\n\n---\n\n\n### Scene 16: Back Home\n\n*ACT II — The Creature | ID: the-escape | File: s16.md*\n\n---\n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n# Scene 16: Back Home\n\n<!-- GOING TO FILM ON and on Day 4 - Day 12 -->\n\nEXT. DALLAS BACKYARD (s16.1)\nMakayla and Dallas hastily make their way out of the woods, back toward the field, carrying all of the equipment from the wooden box. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nAs the two walk, they begin to notice that the tall grass around them is acting universally restless. The two walk in uneasy silence as the summer glow lights their pace. \n\n\nEXT. BRANFORD TOWN GREEN - DAY (s16.2)\n\nThe two walk through the backstreets of Branford with the creature covered in a towel drapped over the dog backpack. \n\nEXT. DALLAS'S HOUSE - DAY (s16.3)\n\nAs they approach the driveway, the two look suspciously at the tall grass around Dallas's house. \n\nINT. DALLAS' KITCHEN\nThe crew find Asher in the kitchen, pacing back and forth. \n\nAsher begins to shake and falls to the ground. His eyes look directly at the sky and he begins to cry.\n\nASHER\n(in trance)\nLeave us alone. Leave us alone. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nAsher begins to cry and shake. Dallas and Makayla rush to his side.\n\nMAKAYLA\nAsher!\n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nAsher slowly wakes up. \n\nMAKAYLA\nBreathe. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDallas looks at the tall grass. His spare handheld oscilloscope begins to beep. The crew, little by little, hear the distinct faint hum following them.\n\nMAKAYLA\nBreathe. Breathe. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nAsher slowly lowers his breathing. A doorbell is heard off screen.\n\nINT. DALLAS'S HOUSE - HALLWAY - DAY (s16.4)\n\nBefore they can even touch the doorknob, Dominic pulls up in his car and honks the horn. He rolls down the window, calm.\n\nDOMINIC\n(easy)\nYou kids alright?\n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDallas and Makayla look at each other.\n\nMAKAYLA\nWe're fine. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDominic's eyes drift to the backpack. Something about it doesn't sit right with him. He clocks it quietly—then lets it go.\n\nDOMINIC\nGet in the car - leave Mr. Dallas alone. He's coming to life group tonight, he needs to get some rest and get ready. \n\nDALLAS\nIt's okay. \n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nMakayla hands Dallas the backpack and gently lets the creature in. She walks to the car with Asher.\n\n<!-- scene: 16 file: s16.md nickname: the-escape -->\n\n(action)\nDominic gives the house one last look, then throws the car into drive.\n\n---\n\n\n### Scene 17: Resonance\n\n*ACT II — The Creature | ID: resonance | File: s17.md*\n\n---\n\n<!-- scene: 17 file: s17.md nickname: resonance -->\n\n<!-- nickname: resonance -->\n<!-- GOING TO FILM ON Day 4 -->\n\nINT. DALLS BASEMENT (s17.1)\n\nDallas looks at the creature by himself for a long time. \n\nDallas stares for a long time at the golden creature. The jagged red lines on his portable viewfinder match the erratic, panicked breathing of the tiny animal. \n\nThe creature is not doing so good - but seems to be glowing - and the distant hum perks up again. \n\nDallas walks over and then paces around the room; He taps various equipments and thinks and thinks. Dallas looks at the photo of Sierra taped to his receiver. \n\nDallas grabs the crystal that Makayla left him and hooks it up to the alligator clips - seems like the creature is interacting with it somehow. \n\nDallas gently turns the dial on his receiver and dials the volume up just enough to create a soft, resonant hum in the basement. \n\nThe creature's ears twitch. It stops its erratic movements. Slowly, it opens its mouth and emits a low, melodic tone, matching the frequency Dallas is broadcasting. As it sings, the golden glow in its neck grows stronger, pushing back the shadows in the room.\n\nA doorbell is heard off screen. \n\nINT. DALLAS NIGHTTIME (S17.2)\n\nDALLAS sleeps next to the the setup. He hears a beep beep and looks at the workshop. The creature is gone!. \n\nEXT. DALLAS BACKYARD - NIGHT (S17.3)\n\nDallas runs outside and looks around. But to no avail.\n\n---\n\n\n### Scene 17B: Normal Day\n\n*ACT II — The Creature | ID: normal-day | File: s17b.md*\n\n---\n\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n# SCENE 17B: NORMAL DAY\n\n<!-- nickname: normal-day -->\n<!-- GOING TO FILM ON Day 12 -->\n\nEXT. BRANFORD HARBOR - DAY (s17b.1)\n\nDominic walks the docks at the Branford town marina, a clipboard under his arm. The harbor is buzzing with the banal energy of pre-storm preparation—owners lashing extra lines, tying down tarps, hauling small craft up the ramp.\n\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nDominic moves down the row of slips, checking each boat, signing off on slip paperwork as he goes. Routine. Calm.\n\nBut beneath it all—beneath the slap of halyards against masts, the gulls, the chatter of the boatyard—Dominic hears the HUM. \n\nIt is distant. Ambient. It rides in low over the water, almost like the drone of a far-off outboard, but too rhythmic. He stops at the end of the dock and stares out across the chop, trying to isolate the sound. He shakes his head, actively gaslighting himself. Just the wind in the rigging.\n\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nA boat owner passing on the dock calls over.\n\nOWNER\nDom—you okay?\n\nDOMINIC\nYeah.\n\n(cross-cut)\n\nINT. DALLAS ATTIC - DAY (s17b.2)\n\nDallas is hunched over his makeshift receiver workstation, the heavy headphones clamped to his ears. The frequency is no longer ambient to him; it is clear, distinct, and terrifying. He frantically dials the knobs, trying to track the source, completely consumed.\n\n(cross-cut)\n\nEXT. BRANFORD HARBOR - DAY (s17b.3)\n\nDominic clips a signed form to a piling and moves to the next slip. He seems perfectly at ease, navigating the normalcy like a protective shield. He nods to the passing boat owner.\n\nDOMINIC\nBetter get her tied down good - supposed to blow this weekend!\n\n<!-- scene: 17B file: s17b.md nickname: normal-day -->\n\n(action)\nHe watches the man go. His comfort isn't ignorance; it's a practiced discipline. He is choosing the routine.\n\n(cross-cut)\n\nINT. MAKAYLA'S LAIR - DAY (s17b.4)\n\nMakayla has maps, meteorological data, and Sierra’s old drawings spread across her floor. She is tracing patterns with a red marker, aggressively connecting the dots between the anomalous sounds and the town's geography.\n\n(cross-cut)\n\n---\n\n\n### Scene 17C: Mute Drive\n\n*ACT II — The Creature | ID: mute-drive | File: s17c.md*\n\n---\n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n# SCENE 17C: MUTE DRIVE\n\n<!-- nickname: mute-drive -->\n<!-- GOING TO FILM ON \n6.28.26 -->\n<!-- GOING TO FILM ON Day 12 -->\nINT. DOMINIC'S CAR - DAY (s17c.1)\n\nDominic is driving through downtown Branford. The Nor'easter winds are picking up, rattling the windows of the car. Outside, the town is engaged in banal, civic storm preparation. Shop owners are taping windows. Public works employees are laying sandbags near the post office. \n\nMakayla sits in the passenger seat. She is completely rigid, staring out the window. Asher is asleep in the back, his heavy noise-canceling headphones resting around his neck. \n\nDominic glances at Makayla, finally breaking the oppressive silence in the car. He is not maternal. He is quiet, even. An older brother who has been watching. \n\nDOMINIC\nI've been meaning to say something. I know it hasn't been easy since Mom passed. It’s a lot to carry. But the way you’ve stepped up to take care of Asher... that's not nothing, Makayla. You're keeping this family together. I just want you to know you don't have to carry it all by yourself. I'm here.\n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n(action)\nMakayla remains  mute.  Her eyes track a creeping, dark rot—a massive burn mark—which looks like it was snaking its way up the brick side of the Branford Town Hall. The public works employees walk right past it, completely oblivious.\n\nThe silence in the car is deafening. Dominic looks away from the road, studying Makayla's terrified, stoic profile. Then, Dominic looks at what Makayla is looking at. \n\nDominic's eyes land on the brick wall of the Town Hall. He sees the black veins of rot. He sees the streetlights pulse. He feels the unnatural rhythm of the wind. \n\nDominic hits the brakes, pulling the car hard onto the shoulder of the road. \n\nHe puts the car in park. He doesn't look at the town anymore. He looks directly at Makayla. \n\nDOMINIC\n(quietly, dropping the buffer)\nYou're not just taking care of him. You're protecting him from something. \n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n(action)\nMakayla finally turns her head to look at Dominic. The silence between them shifts.\n\nDOMINIC\nWhat is wrong, Makayla?\n\nMAKAYLA\nEverything.\n\nDOMINIC\nEverything?\n\nMAKAYLA\nI don't know. \n\nDOMINIC\nMakayla, what is it?\n\nMAKAYLA\nSomething they aren't ready for. \n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n(action)\nDominic stares at his sister. He doesn't ask for proof. He doesn't rationalize the pulsing lights or the rot on the bricks. He chooses to believe. \n\nDOMINIC\nThen we need to get home. And we need to lock the doors. \n\n<!-- scene: 17C file: s17c.md nickname: mute-drive -->\n\n(action)\nDominic throws the car back into drive. It speeds off as the first heavy drops of unnatural rain hit the windshield.\n\n---\n\n\n### Scene 18: Life Group Arrives\n\n*ACT II — The Creature | ID: life-group-arrives | File: s18.md*\n\n---\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n<!-- nickname: life-group-arrives -->\n\n<!-- GOING TO FILM ON DAY 11 -->\n\nINT. DOMINIC'S KITCHEN / LIVING ROOM - NIGHT (s18.1)\n\nFamilies arrive in waves. The small kitchen and smaller living room fill. The crowd tries Dominic's toasted Brussels sprouts, passed around on paper plates.\n\nThe doorbell is heard.\n\nINT. DOMINIC'S HALLWAY (S18.2)\nMakayla answers the door and sees Dallas. She quietly hushes him to the corner. \n\nMAKAYLA\nDallas, what happened? How is it doing?\n\nDOMINIC\nIt ran away. \n\nMAKAYLA\nIt what?!\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nSuddenly a loud bang is heard off screen. Makayla and Dallas turn to look. Mr Mike is heard off screen.\n\nMR. MIKE\nWhat the heck is that? Asher. \n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla and Dallas hush downstairs to find the creature has made it somehow in the basement. Makayla quickly rushes to grab a box for it. \n\nINT. DOMINIC's KITCHEN (S18.3)\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla drifts through the kitchen. She opens drawers quietly. Finds sugar cubes meant for coffee. Pockets one without a word. She continues to look and finds a bunch of tupawear. She grabs a couple of them. \n\nDominic catches her slipping the sugar into her pocket. He wipes his hands on a dish towel.\n\nDOMINIC\nWhat are you doing Makayla. \n\nMAKAYLA\nNothing. Just... getting sugar.\n\nDOMINIC\nFor what? Where's Dallas? \n\nMAKAYLA\nHe's downstairs. He... found a stray cat outside. It's really sick. He's nursing it. I was getting it some sugar water.\n\nDOMINIC\nA cat? Alright. Well, tell him not to grow too attached - okay? What you doing with that Tupawear - you going to put the cat in that?\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla nods quickly and slips away.\n\nDownstairs, the volume of the creature frequency pulses rhythmically through the floorboards.\n\nINT. DOMINIC's BASEMENT - CONTINUOUS (s18.4)\nDallas is sweating. He turns the dial up. Dallas walks over to the small creature and gently rubs its furry head. \n\nMAKAYLA \nIf we keep broadcasting... maybe we can teach it. If it learns the frequency, it can return to the marsh and you know - avoid those red-eye demon things. \n\nMAKAYLA\nWe could to teach it.\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla clicks a \"Master\" switch on the device. A small, protective green light flickers on.\n\nMAKAYLA\nCome on. \n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe glowing creature in the shoebox mimics the tone, its golden light flaring brighter with each successful note. But the louder it sings, the harder the walls of the basement shake. \n\nINT. DOMINIC's LIVING ROOM - UPSTAIRS CONTINUOUS (s18.5)\nThe last family arrive late for life group: a young couple—JOSH and SARAH—with their newborn, JP. Dominic paces in the kitchen. Mr. Mike mutters in his chair, staring at the weather through the window. \n\nThe glass pane rattles violently. \n\nMR. MIKE\n(to himself)\nThey are listening to the song. They don't like the song.\n\nDOMINIC\nWe have brownies about to be ready.\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla tries to shuffle past people who are hovering around a kitchen island grabbing popcorn and brownies. \n\nJOSH\nMakayla, how's the family holding up?\n\nMAKAYLA\nWe're getting by. Thanks.\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla darts past the crowd and heads for the stairs.\n\nA lifegroup member JOSH, 36, Tall and blonde, talks to PAT CLENDENEN, 60s. \n\nJOSH\nHow is it going for you?\n\nPAT\nBusy week. It's tracking that it'll hit us some point later tonight. \n\nJOSH\nDo you think there will be flooding. \n\nPAT\nDefinitely. \n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe two eat carrots and dip. \n\nJOSH\nDominic, where's the host.\n\nDOMINIC\nHe's downstairs in the basement - not feeling so good.\n\nSARAH\nHe knows we're here?\n\nDOMINIC\nYeah - he should be up in a second.\n\nMAKAYLA\nI'll go and check on him.\n\nINT. DOMINIC'S BASEMENT - CONTIOUS (s18.6)\nDownstairs, the creature is not doing so good - but seems to be glowing - and the distant hum perks up again. \n\nMakayla joins him and brings over some sugar cubes to thte table. The creature is unresponsive.\n\nThe sound of the LifeGroup singing \"Great Is Thy Faithfulness\" is muffled by the heavy basement door. Upstairs, the heavy footsteps of Dominic and the first LifeGroup guests begin to echo through the ceiling.\n\n\nINT. DOMINIC'S LIVING ROOM - CONTINUOUS (s18.7)\n\nTYLER\nAlright crew, glad we are all here - gathered together. On this breezy summer night. \n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe group giggle a bit as the wind picks up. The group in a circle all look at eacother. \n\nINT. DOMINIC'S BASEMENT - CONTINOUS (s18.8)\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nThe creature lays out a little whipmer. \n\nDallas adjusts the dial again. The creature quiets. The lights stabilize.\n\nMR. MIKE walks in behind him. He takes one look at the room and freaks out—like a dog afraid of thunder. He points at the basement door.\n\nMR. MIKE\nWhat is here? What is going on downstairs?!\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nDominic steps between Mr. Mike and the stairs. He guides him back by the elbow.\n\nMAKAYLA\nEasy. Easy. Nothing. \n\nMR. MIKE\nThere is something down here. DOMINIC DOMINIC\n\nMAKAYLA\nMr. Mike what is wrong?\n\n<!-- scene: 18 file: s18.md nickname: life-group-arrives -->\n\n(action)\nMakayla signals to Asher who drops a plate on purpose.  \n\nMR MIKE. \nWhat in the world?! Makayla - what is going on?!\n\n---\n\n\n### Scene 19: The Hymn\n\n*ACT II — The Creature | ID: the-hymn | File: s19.md*\n\n---\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n<!-- nickname: the-hymn -->\n<!-- summary:  -->\n<!-- GOING TO FILM ON DAY 11 - 6.27.26 -->\nINT. DOMINIC'S BASEMENT - SAME TIME (s19.1)\n\nDallas shuffles through a pile of old equipment—mono cables, spare parts and arranges them all neatly on a desk.\n\n The creature doesn't look like it's doing much. It's breathing, slightly. Dallas struggles to find a bed for it. He settles on an old shoebox—pauses when he sees his wife's handwriting on one, sets that aside—and gently nestles the creature inside. Its little feet curl tightly. It breathes slowly.\n\nHe finds a way to poke a hole in something so it can drink. The creature, laying beside him in the makeshift shoebox, begins to glow. \n\nMAKAYLA and ASHER watch from the staircase. Makayla comes down. She takes out the crystal from her pocket. It begins to glow. \n\nHer hair lifts. As she grips the crystal, she feels a warmth spread through her hand.  The creature seems to respond to her touch of the crystal. \n\nShe pulls her hand away. The creature's glow dims.\n\nINT. DOMINIC'S LIVING ROOM - LATER (s19.2)\nPeople at lifegroup mill and talk. Someone asks where Dallas is.\n\nDOMINIC\nWe found a little cat. Dallas is downstairs nursing it.\n\nA woman stands—early fifties, warm.\n\nWOMAN\nI'm a retired vet. I could take a look.\n\nDOMINIC\nI mean— no, that's okay. I think that cat's just sleeping. We could check after?\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nAn elderly woman nods. Everyone agrees. BLAKE, one of the young couples, leads the group. \n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nSARAH, the vet, notices a physical reaction to her cup of tea - and watches it ripple in a strange way. \n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDominic closes the windows and blinds.\n\nDOMINIC\nGetting rough out there.\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nTYLER, 32, a young man with a guitar, hands out music sheets.\n\nTYLER\nWould anyone like to say any words before we start?\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThey begin to sing a hymn. As the voices rise, the hum from the basement begins to rise with them.\n\nMR. MIKE barges through the basement door. Visualablly agitated. He’s gripping a worn, leather-bound Bible, but he isn’t looking at it. He’s looking at the windows.\n\nMR. MIKE\nIt’s happening again. The '71 wind. Do you hear it? The Red Eyes are in the eaves! They’re sniffing the house!\n\nTYLER\nHello Mr. Mike - thank you for joining us! We're just about to start the hymn.\n\nMR. MIKE\n(ignoring him, to Dallas)\nYou brought it in here. The golden one. You brought the target to the shore!\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas joins behind Mr. Mike and sits down, Makayla and Asher pile next to him.\n\nTYLER\nOh - and some more friends. We hear there is a cat downstairs. How is it doing?\n\nMAKAYLA\nIt's doing good. \n\nTYLER\nAnd Dallas is it? Everyone this is Dallas - he is new in town.\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas smiles a bit and rests nervously on the couch.\nThe overhead lights dim and then turn back. \n\nTYLER\nYes, on this stormy day - we can still experience grace.\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThe outside window turns into a slow pulse that matches the rhythm of the room. Sarah's tea ripples in her cup, concentric rings expanding outward in perfect time.\n\nThe hum starts to upset people as it becomes unbearable.\n\nSubtle at first. Then undeniable. The floorboards vibrate. The lights pulse lower and lower. People look at each other.\n\nDallas and Makayla exchange a look across the circle. Dallas adjusts his sleeve, trying to hide his arm, but he can see Makayla doing the same.\n\nUnder the skin of their forearms, the jagged lines are glowing. Not gold—but a sickly, rhythmic red that matches the concentric ripples in Sarah's tea. Each time the group hits a high note, the marks burn.\n\nSASHA\nWhat was that?\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nThe group listen in silence.\n\nPAT CLENDENEN\nMust be the wind. The boys in the office just texted me that the pressure's dropping fast.\n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDallas stares at the basement door. During a silent moment of reflection, the hum starts again. Everyone is unsettled. What was that noise? The group settles on the weird weather—the storm, the patterns plaguing Branford. \n\nIn time, people leave. Hugs. Goodbyes. Dominic waves them out. He waits for the last person to leave. \n\nINT. DOMINIC'S DOORWAY - CONTIOUS (s19.3)\nPat Clendenen walks out and puts his hand out to shake Dominic and Dallas' hand. As he does so, he notices from the corner of his eye the burn mark on the ground.\n\nINT. DOMINIC'S HALLWAY- CONTIOUS (s19.4)\nDominic shuts the door. \n\nDOMINIC\nAlright, let's see this cat. \n\n<!-- scene: 19 file: s19.md nickname: the-hymn -->\n\n(action)\nDominic heads toward the basement alone. Dallas's stomach drops. He and Makayla exchange a panicked look. Asher starts bouncing his leg.\n\n---\n\n\n### Scene 20: The Secret is Out\n\n*ACT II — The Creature | ID: red-eyes | File: s20.md*\n\n---\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n# Scene 20: The Secret is Out\n\n<!-- GOING TO FILM ON DAY 11 - 6.27.26 -->\nINT. DOMINIC'S BASEMENT - CONTINUOUS (s20.1)\n\nDominic descends the basement stairs. He gazes in a daze upon all of the military-grade oscillators, tangles of thick coaxial wire, and Sierra's folder spread open. The shoebox under the heat lamp is empty. The small basement hopper window is busted open, rain blowing in from the outside.\n\nDallas frantically taps his receiver. The needle flickers back and forth between frequencies. \n\nMAKAYLA\nDallas! Where is it?\n\nDALLAS\nIt's gone. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nFrom the direction of the marsh—a cry emerges that sounds like the creature. \n\nMAKAYLA\nIt went back.\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nBefore Dallas can move, DOMINIC appears at the top of the basement stairs holding Sierra's folder of anatomical creature sketches. His face is pale. He looks at Dallas like he doesn't know him.\n\nDOMINIC\nDallas... what is this? \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas makes eye contact with Dominic. Outside, the hum increases and Dallas' eyes fall toward the window. Out at the tall grass swaying in the dark. The Red-Eyes are pulsing at the edge of the property.\n\nMAKAYLA\nWe have to get out there and find it the other things do. \n\nDOMINIC\nWhat other things?\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla looks at Dominic with a serious expression.\n\nDOMINIC\nMakayla. \n\nMAKAYLA\nDominic, listen—\n\nDOMINIC\nI listen. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla points hard at the window. Asher walks over to Dominic and hands him the device with the cystral on it.\n\nDOMINIC\nI don't get it. What is this? \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nAsher turns on the device.\n\nASHER\nIt's to keep them at bay.\n\nDOMINIC\nKeep who at bay?\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nAsher points to the window. Dominic glances out the window. He slowly walks. In the distance as he looks a pair of red eyes glances back at him. \n\nSuddenly, the lights in the house flicker and within a moment, the room plunges into pitch black. \n\nMakayla reaches from her backpack and grabs a bunch of flashlights and starts to hand them out to everyone. \n\nINT. LIVING ROOM (Continous) \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDominic looks defeated. From the corner of the room Mr. Mike rocks back and forth in his chair. Asher rushes over to see him. \n\nASHER\nMr. Mike, are you okay?\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMr. Mike looks at ASHER with a blank expression. He points toward the window. \n\nMR. MIKE\nThey're going to come - just look outside - It's done - finished - Look outside. The marks. \n\nEXT. DOMINIC'S BACKYARD - CONTINUOUS (s20.4)\n\nDallas and Makayla walk outside in the backyard and listen to the hum that is now almost at a deafening row. \n\nMAKAYLA\nDo you think this will work?\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas nods. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla drops to her knees, ripping open Dallas's gear bag. She scrambles out a portable speaker, slamming it onto the porch railing, aiming it directly at the creeping darkness like a shotgun. \n\nDallas rips the wire with his teeth and bridges the crystal into the circut. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla's hands fly over the oscillator dial with  1-1-5-3. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla hits the trigger. \n\nA sound like thick glass cracking under pressure pierces the air. A high-pitched, localized frequency beam hits the lawn. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nThe grass at the edge of the yard sways rhythmically,in a direction opposit of  the wind. \n\nDallas and Makayla watch stunned as the hum disapaates. Dominic comes outside and is in a gaze. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla looks back at the tree line.\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDallas nods, his jaw tight. He looks at Dominic. \n\nDOMINIC\nI think I am going to sit down, not feeling so good. \n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nDominic sits down on the outside porch.\n\n<!-- scene: 20 file: s20.md nickname: red-eyes -->\n\n(action)\nMakayla lifts the sparking portable speaker. She sweeps the invisible acoustic beam across the yard like a lighthouse beam. The a small glint of a red eye - is glimmering in the distance.  A wall of Red-Eye shadows violently flinches, peeling back into the reeds and leaving a temporary, circular safe zone in the pouring rain. \n\nThe orbs turn into red orb and then grow into a shadow which takes shape into a humanoid darkness with red eyes.\n\nBut there are too many. Hundreds of red eyes begin to dot the tree line. The sheer numbers are overwhelming the small portable speaker.\n\nMakayla looks onward and sprints towards the darkness.\n\n---\n\n\n### Scene 21: The Burn Marks\n\n*ACT II — The Creature | ID: creature-missing | File: s21.md*\n\n---\n\n<!-- scene: 21 file: s21.md nickname: creature-missing -->\n\n# Scene 21: The Burn Marks\n\n<!-- GOING TO FILM ON : Day 11 = Wednesday -->\n\nEXT. DALLAS'S BACKYARD - NIGHT (s21.2)\nMakayla bursts through the backyard towards the street, towards the neighborhood, looking at her tracker device - she sees that the creature is blinking. She makes her way to the field of no -man land - where they found the creatures. \n\nDallas - watching her sprint - begins to chase after her.   Dominic - sitting down still in a daze, eventually stands up and follows her. \n\nMakayla runs straight for the tall grass at the edge of their house. \n\nEXT. TALL GRASS (S21.3)\nAs Makayla runs through the tall grass - distance howls begin to flod the atmosphere \nDallas and Asher stop at the edge of the porch. In the distance: a pair of eyes. Bright. Dim. Bright. Red. And then gone. \n\nThey look again. Closer. The eyes reappear. Swirling through the beating wind and the tall grass. They seem like they following Makayla's flashlight.\n\n---\n\n\n## ACT III — The Return\n\n---\n\n\n### Scene 22: The Load-Out\n\n*ACT III — The Return | ID: marsh-confrontation | File: s22.md*\n\n---\n\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n# Scene 22: The Load-Out\n\n<!-- GOING TO FILM ON : Day 13 = Wednesday -->\n\nEXT. MARSH - EDGE (s22.1)\n\nThe crew gears up light. Makayla straps on her chest rig — oscillator, crystal, the master-node trigger, light enough to wear. Dominic shoulders the backpack with the baby creature. Dallas takes the handheld tracker.\n\nThis is it. Every blinking node they ever planted is already out there in the dark, waiting — and the master node that wakes the whole field is staked at the center of the sanctuary. They don't have to carry it. They just have to reach it.\n\nAsher loops the long bead string over his neck and runs it once through his fingers, counting. He doesn't say anything. He just nods.\n\n<!-- scene: 22 file: s22.md nickname: marsh-confrontation -->\n\n(action)\nMakayla follows the tracker into the woods - and sees it beep beep - as she approaches the place where Dallas found the creature.\n\n---\n\n\n### Scene 23: The Trench Run\n\n*ACT III — The Return | ID: predator-attack | File: s23.md*\n\n---\n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n# Scene 23: The Trench Run\n\nEXT. TALL GRASS - CONTINUOUS (s23.1)\nDallas enters the tall grass carrying the tracker, watching the green light. \n\nDallas stops for a moment in pain. Dallas looks down at the little green light on the tracker, and then looks down at his hand - the black veins pulse under his skin, Dallas in pain, stumbles and grips his forearm.\n\nIn the distance the creature begins to cry along with \n\nSuddenly, Dominic appears and runs towards Dallas.\n\nDOMINIC\nDallas have you seen her? MAKAYLA! I can't find her? Fix up your tracker - make it show where Makayla is. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDominic begins to pace around.  A giant roar is heard off in the distance.\n\nDOMINIC\nMAKAYLA!  \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas and Dominic continue to make their way deeper in. Dallas drops to the ground.  \n\nDOMINIC\nYou okay?\n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas grips his arm tightly and stoticly marches onward.  Dominic wipes the rain from his face and pushes forward. \n\nAs they cross into the threshold, they plunged into  sensory deprivation. \n\nThe tall grass towers over their heads, ten feet high and thick like jungle vines. The wind is howling, whipping the stalks in violent, unpredictable rhythms. \n\nIt is pitch black. The only light is the small, blinking green LED on Makayla’s chest rig. Dallas and Dominic follow it.\n\nDallas catches up with Dominic and Makayla who are out of breath in the pitch black. \n\nDOMINIC\nMakayla, lets go back.\n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nMakayla moves forward. \n\nMAKAYLA\nI saw the creature but it vanished. Dallas, those things are after it. \n\nEverybody moves quickly in single file. Makayla is leading, sweeping the handheld speaker back and forth like a flashlight. Behind her is Dominic, hunched low, clutching the backpack with the golden creature. Dallas takes up the rear, breathing heavily, watching the tracker and the tree line behind them, his boots sinking deep into the marsh mud. \n\nMAKAYLA\nStraight ahead. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThe air is thick, humid. Heavy. The \"veins\" of black rot are everywhere on the ground, hissing as the air hits them. \n\nMAKAYLA\nThey're above us. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nDallas looks up. Above the swaying tops of the grass, massive, formless shadows drift lazily through the storm clouds like storm surges. They are hunting. Searching. Hundreds of glowing red eyes piercing the dark. \n\nSuddenly, a massive shadow drops down into the grass fifty feet ahead of them. \n\nThe concussive force of its landing knocks Dominic to his knees. He clutches the backpack with the baby to his chest, shielding it. \n\nDOMINIC\nIt's right on us. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nMakayla freezes. The Red-Eye is directly in their path, thrashing through the reeds. Its black, rotting tendrils search the dirt in a wide arc. \n\nMAKAYLA\n(panic rising)\nIt's patrolling. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThe shadow creeps closer. Forty feet. Thirty feet. The black rot spreads toward Dominic's boot. \n\nINT. DALLAS'S HOUSE - NIGHT (CONTINOUS CUT TO) (s23.2)\nAsher and Mr. Mike pace back and forth. Asher checks the dials on the machine - and nervously looks out the window. \n\nMR. MIKE\n(to himself)\nCome on, come on, come on...\n\nEXT. MARSH - CONTINUOUS (s23.3)\n\nIt stops. Its massive red eyes scan the area. It senses something. The silence stretches. Dallas freezes, holding his breath, gripping the tracker. \n\nAsher steps forward from behind Makayla. He closes his eyes and reaches his hand out toward the swaying grass. He taps his leg twice. He begins to hum. \n\nIt's a bizarre, off-key sound—but mathematically perfect to the exact frequency he heard the creature make earlier. \n\nThe Red-Eye snaps its head in the opposite direction. Off to the right. Following the echo of Asher's voice, which he mysteriously managed to throw fifty feet away. \n\nThe massive shadow turns and drifts off into the darkness, chasing the ghost sound. \n\nMakayla exhales slowly. \n\nMAKAYLA\nAsher... how did you do that?\n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nAsher just points forward into the dark. \n\nASHER\nWe have to keep moving. The center is close. \n\nDominic groans, pulling his boot out of a foot of thick, sucking mud. He re-shoulders the backpack with the baby. Dallas grabs his arm, helping him up. \n\nDALLAS\nYou good?\n\nDOMINIC\n(gritting teeth)\nNever better. Just a light hike in the country. Let's go. \n\n<!-- scene: 23 file: s23.md nickname: predator-attack -->\n\n(action)\nThey push forward, deeper into the howling void.\n\n---\n\n\n### Scene 24: The Sanctuary & The Siege\n\n*ACT III — The Return | ID: the-perimeter | File: s24.md*\n\n---\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n# Scene 24: The Sanctuary & The Siege\n\nEXT. CENTER OF THE MARSH - LATER (s24.1)\n\nThe howling wind suddenly dies down.\n\nMakayla breaches through a thick wall of reeds and stops. Dallas, Dominic, and Asher break through behind her and collapse to their knees in the mud.\n\nThey are standing in a perfect, geometric ring of flattened grass. Almost perfectly circular, about fifty feet across. The tall stalks around the edge are woven together tight like a wicker basket, forming an impenetrable wall.\n\nInside the ring it is completely calm. The storm raging directly above doesn't penetrate the space. It's eerily tranquil.\n\nAnd it is glowing.\n\nSitting in a circle in the center of the flattened grass are the GOLDEN ELDERS. About a foot taller than the injured creature, covered in thick, iridescent golden fur. They look ancient. Wise.\n\nThey are humming — a deep, resonant, multi-chord frequency that visibly vibrates the air, holding a faint shimmering golden dome over the sanctuary.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nAsher lifts the small creature out of the backpack. Its neck-glow, weak and erratic the whole way in, suddenly flares bright gold as it hears the song.\n\nAsher kneels and gently sets the baby down in the mud. The tiny being stumbles forward, letting out a high-pitched chirp.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nOne of the giant Elders turns its head. Larger than the rest. Its fur the deepest gold. It sees the baby.\n\nIt rises. The other Elders part for it.\n\nThe baby chirps again — louder, frantic now — and scrambles across the flattened grass toward it.\n\nThe largest Elder lowers its great head all the way to the ground and presses its brow against the baby. The baby burrows into the fur of its neck.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nMakayla watches, frozen. Her hand drifts to her mouth.\n\nMAKAYLA\n(barely a whisper)\nThat's its mother.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nThe mother Elder lifts her head and looks at the crew. At Asher. Then at Dallas. She bows once — a single, isolated acoustic note that rattles Dallas's ribs in the best possible way.\n\nFor one moment, everything is still.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nMakayla looks down at the screen on her chest rig. The jagged red lines are spiking massively at the edge of the circle.\n\nMAKAYLA\n(panic returning)\nThey followed us in.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nA heavy, crushing sound slams into the woven wall of grass at the edge of the ring. The air shudders violently. The peace breaks instantly.\n\nDozens of massive, corrupted RED-EYE shadows burst through the perimeter. Black rot spreads across the sanctuary floor like spilled oil.\n\nThe Elders rise, roaring — their cries land as acoustic blasts of golden light. From their backs a fine golden mist sprays upward, trying to weave the dome thicker.\n\nIt's a horrific clash of physics. Golden mist meets black shadow in violent, ozone-scented snaps. The Red-Eyes swarm like ghouls, devouring the light as they move.\n\nDOMINIC\nWhat the heck even is that?\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nThe massive Red-Eyes swarm the mother Elder, ripping into her acoustic field with jagged, corrupted static. She's pushed backward toward the center, curling her body around the baby.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nMakayla rips the small portable speaker from her bag and aims it at the nearest shadow. She fires. A thin acoustic beam hits it. The shadow flinches — peels back a few feet — then keeps coming. The little device whines, overheating in her hands.\n\nMAKAYLA\nIt's not enough. One won't ever be enough.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nShe looks down at the dying speaker. Then up — out past the woven wall, across the dark marsh. Out where, scattered through the reeds for hundreds of yards in every direction, dozens of tiny lights blink faintly in the rain.\n\nThe fireflies. Every node she and Asher ever planted.\n\nMAKAYLA\n(realizing)\nNot one. All of them.\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nShe grabs Asher by the shoulder and points at his chest — at the long string of beads around his neck.\n\nMAKAYLA\nAsher. The whole field. Every one you planted. Can you bring them up together?\n\n<!-- scene: 24 file: s24.md nickname: the-perimeter -->\n\n(action)\nAsher's fingers find the beads. He starts counting them — fast, sure, his lips moving. He's not panicking. He's reading a map only he can see.\n\nASHER\nThey have to sing at the same time. Or they cancel.\n\nDALLAS\nThen we give them one note to sing.\n\n---\n\n\n### Scene 25: The Final Blast\n\n*ACT III — The Return | ID: the-last-dinner | File: s25.md*\n\n---\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n# Scene 25: The Final Blast\n\nEXT. CENTER OF THE MARSH - CONTINUOUS (s25.1)\n\nThe golden dome of the Elders is failing. Red-Eyes rip through the barrier, canceling the light. Black rot spreads inward across the flattened grass.\n\nMakayla drops to her knees in the mud over a small node staked at the dead center of the ring — the master. She tears the copper leads free and twists them toward the translucent crystal in her palm.\n\nMAKAYLA\n(screaming over the chaos)\nDallas — I need the frequency! If they all fire off-pitch they'll tear each other apart!\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nDallas drops beside her, hands flying over the oscillator strapped to her chest.\n\nDALLAS\nThe mother. Match the mother.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nHe turns toward the largest Elder, curled around the baby, still singing her low protective note under the chaos. Dallas closes his eyes and listens — and dials toward it.\n\nThe needle climbs. 114.8. 115.0. 115.2.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nMakayla twists the cold copper around the crystal. Her fingers slip in the rain.\n\nMAKAYLA\nIt won't catch — the humidity's killing the connection —\n\nASHER\nThey're breaking through!\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe mother Elder groans, a deep sub-bass sound, as a massive Red-Eye slams into her. Her golden fur dims. The shadow begins to erase her frequency completely.\n\nThe baby shrieks.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nMakayla bites down hard on the connection, crimping the wire against the crystal with her teeth. The little master screen flares green. The connection holds.\n\nAsher kneels beside her and lays his palm flat on the node. He begins to hum — bizarre, off-key, but mathematically perfect to the mother's note. His other hand traces the beads, one by one.\n\nOut in the dark, the first firefly answers. Then three. Then a dozen. A slow wave of tiny lights waking across the marsh, each picking up the pitch.\n\nDALLAS\nHold it — hold the note —\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nA shadow sweeps in low from the side, rotting tendrils raking across the mud toward Asher's exposed hands on the master node.\n\nDOMINIC\nAsher — DOWN!\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nDominic throws himself entirely over Asher and the node, taking the sweep of the shadow across his own back. The black rot hisses against his jacket. He screams in agonizing pain — but he doesn't move. He stays curled over the boy and the connection, anchoring them both with his body.\n\nDOMINIC\n(gritting teeth, to Asher)\nKeep singing. I got you. Keep singing.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nAsher keeps humming. The wave of fireflies builds across the entire marsh — hundreds now, all holding the same rising pitch, a vast distributed chord swelling from every direction at once.\n\nMakayla looks at Dallas. Dallas looks at the needle. It clicks into place.\n\n**115.3.**\n\nDALLAS\nNow.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nMakayla slams her palm down on the master.\n\nEvery firefly in the marsh ignites at once.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nIt is not a beam. It is the whole world singing. Hundreds of points of golden light flare to full brilliance across hundreds of yards of reeds, and the single note they hold together becomes a massive, concussive wall of sound that rolls inward from every edge of the marsh toward the center.\n\nThe shockwave throws Dallas, Makayla, and Asher off their feet into the mud.\n\nThe wall of Red-Eyes recoils, letting out a horrific gnashing shriek as the frequency literally burns them. The black rot peels off the ground and ignites into thin grey smoke.\n\nThe sonic force ripples outward, flattening the tall grass for hundreds of yards. The massive shadows are vaporized — gone — harmless smoke scattering on the wind.\n\nSilence.\n\nTotal silence.\n\nThe wind stops.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nDallas slowly sits up, ears ringing. He looks at his wrist. The black, rotting veins under his skin are gone. He looks at Makayla — she's staring at her own clean forearm. He looks at Dominic, face-down in the mud, panting. Alive. The shockwave purged the contagion from the earth and from their blood.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nAnd then, one by one, the fireflies lift out of the reeds.\n\nHundreds of them, rising off their stakes, drifting up into the calm air. They don't scatter. They gather — pulled toward the center of the ring, toward the baby and the mother — until the whole swarm hangs over the sanctuary in a slow, breathing cloud of golden light.\n\nThe baby creature chirps once. The swarm answers, pulsing brighter.\n\n<!-- scene: 25 file: s25.md nickname: the-last-dinner -->\n\n(action)\nThe Golden Elders rise to their feet. The mother lowers her head to the crew one last time. She doesn't roar. She turns, gathers the baby against her, and leads her clan deeper into the remaining marsh.\n\nThe swarm of fireflies follows them — a river of light pouring off into the dark, until the marsh is quiet and ordinary again.\n\nMakayla lets out a massive, shuddering breath.\n\n---\n\n\n## ACT IV — Aftermath\n\n---\n\n\n### Scene 26: The Morning After\n\n*ACT IV — Aftermath | ID: final-echoes | File: s26.md*\n\n---\n\n<!-- scene: 26 file: s26.md nickname: final-echoes -->\n\n# Scene 26: The Morning After\n<!-- scene: 26 file: s26.md nickname: final-echoes -->\n\n(action)\nEXT. TALL GRASS (s26.1)\nThe crew walk back through the tall grass, through neighborhoods, back and slow. \n\nINT. DOMINICS HOUSE (s26.2)\nThe crew huddle around Dallas' house and all sleep on the floor as Mr Mike watches a movie on TV. \n\nDominic makes his way through the door.\n\nDOMINIC\n(dry, quiet)\nLook at all these sleeping beauties. \n\n<!-- scene: 26 file: s26.md nickname: final-echoes -->\n\n(action)\nMR. Mike walks in behind Dominic and walks right over to Dallas - out for a good old fashion handshake. \n\nMR. MIKE\nDallas, wheres Dallas. Dallas my boy - you were spared from the storm. \n\nDALLASHow are you Mike. \n\nMR. MIKE\nThings are better - things are better than what they were. Yes. \n\nDOMINIC\nThanks for letting everyone crash here Dallas. Makayla, lets go.\n\n---\n\n\n### Scene 27: Aftermath\n\n*ACT IV — Aftermath | ID: aftermath | File: s27.md*\n\n---\n\n<!-- scene: 27 file: s27.md nickname: aftermath -->\n\n<!-- nickname: little aftermath -->\n\nEXT. BRANFORD - DAY (s27.1)\n\nThe town is back to normal. People move through their routines. The strange occurrences of the last few days are still on everyone's lips—muted, half-disbelieved.\n\nEXT. CENTER OF THE MARSH - DAY (s27.2)\nDallas walks alone into the flattened ring of grass from the night before. The storm is gone. He finds the gear they left at the center — the small master node still staked in the mud, the oscillator on its side, screen cracked, but the node still blinking. He picks it up. The screen shows a saved file: one clean recording.\n\nHe presses play. The sound fills the quiet marsh— it is the tune from the golden furry creatures, captured clean. \n\nDallas holds play for a long moment. He looks at the photo of Sierra on his receiver. \n\nEXT. BRANFORD - OUTSIDE PIZZA PLACE - DAY (s27.3)\n\nPAT CLENDENEN, microphone in hand, stands by a windy flag by the PIZZA and POST OFFICE - place on 142 branford road. \n\nPAT CLENDENEN\nThe Nor'easter's last-second shift—call it an unlikely miracle. Either way, a good safety warning. This town's prepared now.\n\nEXT. CHURCH GROUNDS - DAY (s27.4)\n\nA church event. Picnic tables. Nica's catered lunch. DOMINIC and DALLAS greet each other. They don't talk much. They sit next to each other and eat. \n\nDallas holds a tray of Chicken Primevera. \n\nMR. MIKE sits at the end of the table, peacefully eating a piece of cornbread. He looks out toward the edge of the woods and smiles softly. \n\nMR. MIKE\n(to himself)\nQuiet now. The numbers are finally right. Javarice would have loved the quiet.\n\nINT. DALLAS'S WORKSHOP / HOUSE - DAY (s27.5)\n\nDallas at his kitchen table and grabs a battery as he walks to his workbench. He begins to fiddle with a recording mechniasm. And feed water to a tiny plant. He finally gets it working. He hits record. From outside, a low hum, different from before, bleeds into the room. He listens. He begins to sketch—notations, marks. An alphabet.\n\n---\n\n\n### Scene 28: Full Circle\n\n*ACT IV — Aftermath | ID: full-circle | File: s28.md*\n\n---\n\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n# Scene 28: Full Circle\n<!-- summary: Makayla sets up her new Lair in the woods to listen to the creatures. Dallas finds his wife's specific hum out in the marsh. -->\n\nEXT. MAKAYLA'S LAIR - DAY (s28.1)\n\nMakayla walks up to the wooden structure in the woods. Asher is already there, but they aren't building—they are packing up. The trail cameras are being taken down. The massive array of wires is being rolled into neat coils. Out in the reeds the little amber nodes are going dark one by one as Asher gathers them in — and for each one he collects, he slips a single bead off the string around his neck.\n\nMakayla pulls the small, translucent crystal out of her pocket. She connects it to her portable oscillator one last time. \n\nThe screen flares to life. Suddenly, the clean, perfect, golden sine wave spikes violently into a jagged red pattern. \n\nMakayla tenses up instantly. Her hand hovers over the dial. The old instinct to control, to predict the danger, surges back. \n\nMAKAYLA\n(panicked)\nIt's a spike. They're coming back. Asher, we need to—\n\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n(action)\nAsher walks over. He looks at the screen. He doesn't look panicked. He points at the wind whipping through the high branches of the trees, then points back at the screen. \n\nASHER\nIt's just the wind in the reeds. The storm is passing. \n\n<!-- scene: 28 file: s28.md nickname: full-circle -->\n\n(action)\nMakayla looks at the trees. She listens. The terrifying hum is gone. It is just normal, earthly weather. She misread it. \n\nShe looks at Asher, who is perfectly calm. \n\nMakayla lets out a long, shuddering breath. She accepts the correction. The tension leaves her shoulders. She smiles, finally letting the interpretation go. \n\nShe reaches down and actively unplugs the machine. The screen goes dark. She drops the crystal into her pocket, zips her gear bag, and they walk out of the woods together.\n\nINT. DALLAS'S BEDROOM - NIGHT (s28.2)\n\nDallas goes to bed. The device sits on the nightstand. He hears echoes. Something beyond the shadows he saw before. He lies there. Listening. He goes and checks on the plant.\n\nEXT. DALLAS'S DRIVEWAY - MORNING (s28.3)\n\nDominic pulls up. He gets out. He and Dallas hug. They share a quiet morning beat. As Dominic heads off, Dallas's eyes catch something out in the tall grass. He's drawn toward it. Dallas looks toward the creek.\n\nEXT. CREEK BEND - DAY (s28.4)\n\nDallas walks alone with his wife's receiver in hand. The place where the lawn becomes reed. The same bend from before. Dallas stops. He lifts the receiver. He tunes the dial. The hum rises, falls. He adjusts again. The dial clicks into place. He stands there. Recording. The tall grass does not move - and neither does Dallas. \n\nIn the Tall Grass Dallas senses the creature - and plays the pure recording of their hum - and realizes that it matches the exact cadence of Sierra's song.\n\n---\n\n";
    const MARKDOWN_FILE_NAME = 'creatures_in_the_tall_grass_full_script.md';

    function downloadMarkdown() {
      const blob = new Blob([markdown], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = MARKDOWN_FILE_NAME;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function printMarkdownPdf() {
      const printable = window.open('', '_blank', 'noopener,noreferrer');
      if (!printable) return;
      const escaped = String(markdown)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      const title = document.title.replace(/<\/?[^>]+>/g, '');
      printable.document.write([
        '<!doctype html>',
        '<html lang="en">',
        '<head>',
        '  <meta charset="UTF-8">',
        '  <meta name="viewport" content="width=device-width, initial-scale=1.0">',
        '  <title>' + title + ' - Markdown</title>',
        '  <style>',
        '    body { margin: 1in; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }',
        '    pre { white-space: pre-wrap; line-height: 1.35; font-size: 11pt; }',
        '  </style>',
        '</head>',
        '<body>',
        '  <pre>' + escaped + '</pre>',
        '</body>',
        '</html>',
      ].join('\n'));
      printable.document.close();
      printable.focus();
      printable.print();
      printable.onafterprint = () => printable.close();
    }
    const container = document.getElementById('scriptContent');
    marked.setOptions({ breaks: true });
    container.innerHTML = marked.parse(markdown);

    // Export dropdown: toggle on trigger click, close on outside click or menu action
    (function initExportDropdown() {
      var trigger = document.getElementById('scriptExportTrigger');
      var menu = document.getElementById('scriptExportMenu');
      if (!trigger || !menu) return;
      function open() {
        menu.classList.add('is-open');
        trigger.setAttribute('aria-expanded', 'true');
      }
      function close() {
        menu.classList.remove('is-open');
        trigger.setAttribute('aria-expanded', 'false');
      }
      trigger.addEventListener('click', function(e) {
        e.stopPropagation();
        if (menu.classList.contains('is-open')) close(); else open();
      });
      menu.querySelectorAll('button').forEach(function(btn) {
        btn.addEventListener('click', function() { close(); });
      });
      document.addEventListener('click', function() { close(); });
    })();

    // Format screenplay elements
    formatScreenplay(document.querySelector('.screenplay-container'));

    // Filmmaking-style page length & runtime (1 page ≈ 1 minute; ~250 words/page)
    // Count from raw markdown so we get the full script (DOM textContent can undercount)
    (function initScriptStatsAndProgress() {
      const WORDS_PER_PAGE = 250;
      const content = document.getElementById('scriptContent');
      const progressFill = document.getElementById('scriptProgressFill');
      const progressLabel = document.getElementById('scriptProgressLabel');
      const progressBar = document.querySelector('.script-progress-bar');

      if (!progressFill) return;

      const wordCount = (typeof markdown === 'string' ? markdown : (content && content.textContent) || '')
        .split(/\s+/)
        .filter(Boolean)
        .length;
      const MIN_PAGES = 90;
      const rawPages = Math.round((wordCount / WORDS_PER_PAGE) * 10) / 10;
      const estimatedPages = Math.max(MIN_PAGES, rawPages);
      const estimatedMinutes = Math.max(MIN_PAGES, Math.round(estimatedPages));

      function updateProgress() {
        const docEl = document.documentElement;
        const scrollTop = docEl.scrollTop || document.body.scrollTop;
        const scrollHeight = docEl.scrollHeight - docEl.clientHeight;
        if (scrollHeight <= 0) {
          progressFill.style.height = '0%';
          progressLabel.textContent = '0 / ' + estimatedMinutes;
          if (progressBar) progressBar.setAttribute('aria-valuenow', 0);
          return;
        }
        const pct = Math.min(1, Math.max(0, scrollTop / scrollHeight));
        const currentMinute = Math.min(estimatedMinutes, Math.floor(pct * estimatedMinutes));
        progressFill.style.height = (pct * 100) + '%';
        progressLabel.textContent = currentMinute + ' / ' + estimatedMinutes;
        if (progressBar) progressBar.setAttribute('aria-valuenow', Math.round(pct * 100));
      }

      updateProgress();
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
    })();

    // Scene nav: add ids to scene headings and wire dropdown to scroll
    (function initSceneNav() {
      const content = document.getElementById('scriptContent');
      const selectEl = document.getElementById('scriptSceneSelect');
      if (!content || !selectEl) return;

      const sceneHeadings = content.querySelectorAll('h3');
      const sceneHeadingRe = /^Scene \d+[A-Z]*:/i;
      sceneHeadings.forEach((h3, i) => {
        const text = (h3.textContent || '').trim();
        if (sceneHeadingRe.test(text)) {
          h3.id = 'scene-' + (i + 1);
        }
      });

      selectEl.addEventListener('change', function() {
        const value = this.value;
        if (!value) return;
        const el = document.getElementById(value);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        this.value = '';
      });
    })();

    // Wrap each scene in a scene-wrapper div for print isolation
    // Must be called AFTER initSceneNav so scene headings have IDs
    wrapScenes(document.getElementById('scriptContent'));

    // Status bar: current scene, who's in scene, production tags (updates on scroll)
    (function initStatusBar() {
      const content = document.getElementById('scriptContent');
      const sceneEl = document.getElementById('scriptStatusScene');
      const charsEl = document.getElementById('scriptStatusCharacters');
      const prodEl = document.getElementById('scriptStatusProduction');
      if (!content || !sceneEl) return;

      function getSceneHeadingsInOrder() {
        const h3s = content.querySelectorAll('h3[id^="scene-"]');
        return Array.from(h3s).sort((a, b) => {
          const nA = parseInt(a.id.replace('scene-', ''), 10);
          const nB = parseInt(b.id.replace('scene-', ''), 10);
          return nA - nB;
        });
      }

      function getSceneBlock(sceneH3, nextSceneH3) {
        const chars = new Set();
        let firstSlug = '';
        let node = sceneH3.nextSibling;
        while (node) {
          if (node === nextSceneH3) break;
          if (node.nodeType === 1) {
            if (node.classList && node.classList.contains('character-name')) {
              const name = (node.textContent || '').trim();
              if (name) chars.add(name);
            }
            if (!firstSlug && node.classList && node.classList.contains('scene-heading')) {
              firstSlug = (node.textContent || '').trim();
            }
          }
          node = node.nextSibling;
        }
        return { characters: Array.from(chars), production: firstSlug };
      }

      function updateStatusBar() {
        const sceneHeadings = getSceneHeadingsInOrder();
        if (sceneHeadings.length === 0) return;
        const viewportThreshold = 160;
        let current = sceneHeadings[0];
        for (let i = 0; i < sceneHeadings.length; i++) {
          const top = sceneHeadings[i].getBoundingClientRect().top;
          if (top <= viewportThreshold) current = sceneHeadings[i];
        }
        const title = (current.textContent || '').trim();
        const nextId = current.id.replace('scene-', '');
        const nextNum = parseInt(nextId, 10) + 1;
        const nextScene = document.getElementById('scene-' + nextNum);
        const block = getSceneBlock(current, nextScene || null);
        sceneEl.textContent = title || '—';
        charsEl.textContent = block.characters.length ? block.characters.join(', ') : '—';
        prodEl.textContent = block.production || '—';
      }

      updateStatusBar();
      window.addEventListener('scroll', updateStatusBar, { passive: true });
      window.addEventListener('resize', updateStatusBar);
    })();

    // Download individual scene as PDF
    function downloadScenePdf() {
      const select = document.getElementById('printSceneSelect');
      const sceneNum = parseInt(select.value, 10);
      if (!sceneNum || isNaN(sceneNum)) {
        alert('Please select a scene');
        return;
      }

      const sceneWrapper = document.querySelector('[data-scene-num="' + sceneNum + '"]');
      if (!sceneWrapper) {
        alert('Scene not found');
        return;
      }

      // Get scene title from h3
      const heading = sceneWrapper.querySelector('h3');
      const sceneTitle = heading ? heading.textContent.trim() : 'Scene ' + sceneNum;

      // Clone the scene for PDF generation (so we don't modify the original)
      const element = sceneWrapper.cloneNode(true);

      // Remove ID so it doesn't conflict
      element.removeAttribute('id');
      element.removeAttribute('data-scene-num');

      // PDF options
      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: 'Scene_' + String(sceneNum).padStart(2, '0') + '.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      // Generate PDF
      html2pdf().set(opt).from(element).save();

      // Close the modal
      document.getElementById('printSceneModal').close();
    }

    function looksLikeActionIntro(text) {
      if (!text || text.length < 15) return false;
      if (/^\(.+\)$/.test(text)) return false;
      if (/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(text)) return false;
      if (/^[A-Z][a-z]+,\s*(?:Mid\s*\d+s|\d+s|[A-Za-z\s]+),/.test(text) && /[a-z]/.test(text)) return true;
      if (/^[A-Z][a-z]+,\s*(?:Mid\s*\d+s|\d+s)\s*[,.]/.test(text)) return true;
      return false;
    }

    // Wrap each scene in a divider for print isolation
    function wrapScenes(container) {
      if (!container) return;
      // Create a static array copy so we don't have stale references as we modify DOM
      const sceneHeadings = Array.from(container.querySelectorAll('h3[id^="scene-"]'));

      sceneHeadings.forEach((heading, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'scene-wrapper';
        wrapper.setAttribute('data-scene-num', idx + 1);

        // Get the next heading reference (the boundary for this scene)
        const nextHeading = sceneHeadings[idx + 1];

        // Get the first sibling BEFORE we modify the DOM
        let node = heading.nextSibling;

        // Insert wrapper before heading
        heading.parentNode.insertBefore(wrapper, heading);

        // Move heading into wrapper
        wrapper.appendChild(heading);

        // Move all content nodes after heading (until next heading) into wrapper
        while (node && node !== nextHeading) {
          const next = node.nextSibling; // Save next before moving
          wrapper.appendChild(node);     // This changes node's parent
          node = next;                   // Move to the saved next
        }
      });
    }

    function formatScreenplay(container) {
      const content = container.querySelector('.screenplay-content');
      if (!content) return;

      normalizeParagraphBreaks(content);

      const paragraphs = content.querySelectorAll('p');
      let inDialogueBlock = false;
      
      paragraphs.forEach((p, index) => {
        const text = p.textContent.trim();
        const nextP = paragraphs[index + 1];
        const prevP = paragraphs[index - 1];
        
        // Skip if already formatted (but allow normalizeParagraphBreaks output)
        if (!text) return;
        if (p.classList.length > 0 && !p.classList.contains('line-split')) return;
        
        // Scene headings (INT. or EXT. at start of line)
        if (/^(INT\.|EXT\.)/i.test(text)) {
          p.className = 'scene-heading';
          
          // Check for scene ID at the end: (s01.1)
          const idMatch = text.match(/\((s\d+\.\d+)\)$/i);
          if (idMatch) {
            const id = idMatch[1].toLowerCase();
            const cleanText = text.replace(idMatch[0], '').trim();
            p.innerHTML = '<span class="scene-id">' + id + '</span>' + cleanText.toUpperCase();
          } else {
            p.textContent = text.toUpperCase();
          }
          
          inDialogueBlock = false;
          return;
        }
        
        // Transitions (right-aligned, uppercase)
        if (/^(FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text)) {
          p.className = 'transition';
          p.textContent = text.toUpperCase();
          inDialogueBlock = false;
          return;
        }

        // Action break: (action) on its own line — ends dialogue block, next line is action; line is hidden
        if (/^\(action\)$/i.test(text)) {
          p.className = 'action-break';
          p.textContent = '';
          inDialogueBlock = false;
          return;
        }
        
        // Parentheticals (text in parentheses, italic) - check before character names
        if (/^\(.+\)$/.test(text)) {
          p.className = 'parenthetical';
          inDialogueBlock = true;
          return;
        }

        // Action lines that introduce a character or describe action (e.g. "Dominic, early 40s, puts his hand...")
        // Never treat these as dialogue so they don't get wrapped with the previous speaker
        if (looksLikeActionIntro(text)) {
          p.className = 'action-line';
          inDialogueBlock = false;
          return;
        }
        
        // Character names (all caps, typically short, not scene headings)
        const isAllCaps = /^[A-Z][A-Z\s\.'-]+$/.test(text) && text === text.toUpperCase();
        const isReasonableLength = text.length > 2 && text.length < 35;
        const isNotSceneHeading = !/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(text);
        
        if (isAllCaps && isReasonableLength && isNotSceneHeading) {
          const nextText = nextP ? nextP.textContent.trim() : '';
          const looksLikeDialogue = nextText && (
            /^\(.+\)$/.test(nextText) ||
            (!/^(INT\.|EXT\.|FADE|CUT|DISSOLVE)/i.test(nextText) && 
             !/^[A-Z][A-Z\s\.'-]+$/.test(nextText))
          );
          
          if (looksLikeDialogue || !prevP || prevP.classList.contains('action-line') || prevP.classList.contains('scene-heading')) {
            p.className = 'character-name';
            p.setAttribute('data-character', text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''));
            inDialogueBlock = true;
            return;
          }
        }
        
        // Dialogue (follows character name / parenthetical / dialogue)
        const looksLikeNewBlock = /^(INT\.|EXT\.|FADE IN|FADE OUT|CUT TO|DISSOLVE TO|SMASH CUT|MATCH CUT)/i.test(text);
        const looksLikeCharacter = isAllCaps && isReasonableLength && isNotSceneHeading;
        if (!looksLikeNewBlock && !looksLikeActionIntro(text) && inDialogueBlock && prevP && (prevP.classList.contains('character-name') || prevP.classList.contains('parenthetical') || prevP.classList.contains('dialogue'))) {
          p.className = 'dialogue';
          inDialogueBlock = true;
          return;
        }
        
        // If we're in a dialogue block but this doesn't match, end the block
        if (looksLikeCharacter || looksLikeNewBlock) {
          inDialogueBlock = false;
        }
        
        // Default: action line
        p.className = 'action-line';
        inDialogueBlock = false;
      });

      // Add markers for last line in dialogue / parenthetical blocks (spacing)
      const ps = content.querySelectorAll('p');
      ps.forEach((p, i) => {
        if (!p.classList.contains('dialogue') && !p.classList.contains('parenthetical')) return;
        const next = ps[i + 1];
        if (!next || (!next.classList.contains('dialogue') && !next.classList.contains('parenthetical'))) {
          if (p.classList.contains('dialogue')) p.classList.add('dialogue-last');
          if (p.classList.contains('parenthetical')) p.classList.add('parenthetical-last');
        }
      });
    }

    // Split <p> blocks that contain <br> into separate <p>s per line.
    // This lets screenplay formatting work even if the markdown uses single newlines.
    function normalizeParagraphBreaks(content) {
      const paragraphs = Array.from(content.querySelectorAll('p'));
      paragraphs.forEach((p) => {
        if (!p.querySelector('br')) return;
        const parts = p.innerHTML
          .split(/<br\s*\/?\s*>/i)
          .map((s) => s.replace(/&nbsp;/g, ' ').trim())
          .filter(Boolean);
        if (parts.length <= 1) return;

        const frag = document.createDocumentFragment();
        parts.forEach((html) => {
          const np = document.createElement('p');
          np.innerHTML = html;
          frag.appendChild(np);
        });
        p.replaceWith(frag);
      });
    }
  </script>
</body>
