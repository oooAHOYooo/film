    (function() {

      const CARDS_DATA = [{"n":1,"displayNum":"0A","id":"opening-montage","title":"Opening Montage","act":1,"actTitle":"Arrival & Discovery","summary":"An empty platform. The Long Island Sound visible beyond the station house — gray water, distant shoreline. A single train pulls away, its last car disappearing around the curve. Dallas stands displaced on the platform.…"},{"n":2,"displayNum":"0B","id":"property-manager","title":"Property Manager","act":1,"actTitle":"Arrival & Discovery","summary":"The front door opens inward. A small foyer with scuffed hardwood. To the left, a living room where cheap furniture sits pushed against the walls in no particular order. A futon frame without a mattress leans in a…"},{"n":3,"displayNum":"1","id":"arrival","title":"Arrival","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas stares at the Tall Grass outside his house as he unloads boxes from a big pile. Dallas scans the new backyard, there are some old rusty lawn furtniture and a picnic table that seems to be adjacent to a fence of…"},{"n":4,"displayNum":"2","id":"dallas-night","title":"Sierra's Box","act":1,"actTitle":"Arrival & Discovery","summary":"Can't sleep. Golden flicker in the grass. He opens Sierra's box; the hum starts; the battery dies."},{"n":5,"displayNum":"3","id":"the-hum","title":"Meet The Neighbors Completed: True","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas walks outside his house, towards the edge of the property. As he approaches the edge of his yard he watches the tall grass sway in the wind. He looks at the grass for a beat too long, as he nurses the audio…"},{"n":6,"displayNum":"4","id":"fellowship","title":"Fellowship","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas and Dominic arrive at CPC and find themselves in heat of a picnic. Children are running, friends down light summerwear as they play spike ball, and church goers find themselvees are on a long line for food.…"},{"n":7,"displayNum":"5","id":"marsh-walk-later","title":"The Merlin App","act":1,"actTitle":"Arrival & Discovery","summary":"Boardwalk through the reeds. They hear birds and something moving in the marsh."},{"n":8,"displayNum":"6","id":"news-vans","title":"News Vans","act":1,"actTitle":"Arrival & Discovery","summary":"News vans in the street. Pat on camera. Marks on Dominic's driveway. Dallas strays and stays."},{"n":9,"displayNum":"7","id":"the-coordinates","title":"The Coordinates","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas and Dominic walk back at sunset to a long stretch of land. On his way to the door, Dallas passes the open basement stairwell. The workbench light is still on below. From the top of the stairs he can see the…"},{"n":10,"displayNum":"8","id":"dallas-marsh-walk","title":"The Trailcam","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas is rearranging the workstation — coiling cables, repositioning the monitor, clamping a second antenna to the edge of the desk. The readings in front of him don't make sense: spikes with no source, patterns that…"},{"n":11,"displayNum":"9","id":"dallas-night-work","title":"The Injured One","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas enters the marsh at night with his bearing sketch and Sierra's recorder. He reads his oscillator through the reeds, deliberate and careful. Deep inside, a gnarled tree reveals an injured, bioluminescent creature curled inside the hollow."},{"n":12,"displayNum":"10","id":"shadows-in-wind","title":"Creature Discovery","act":1,"actTitle":"Arrival & Discovery","summary":"As Dallas walks out of the tall grass, he gets the sense that something is following him. The air changes and the hum faintly comes back. Then in the distant, more coyotes begin to howl. A heavy, crushing sound slices…"},{"n":13,"displayNum":"11","id":"kitchen-triage","title":"Kitchen Triage","act":1,"actTitle":"Arrival & Discovery","summary":"Dallas at home with the creature. Kitchen triage—parchment, macro lens. The creature cries; the equipment flares gold."},{"n":14,"displayNum":"12","id":"the-burn-mark","title":"Alone With The Creature","act":2,"actTitle":"The Creature","summary":"Dallas wakes in the chair at his desk. Not on the cot. He didn't mean to sleep there. The desk lamp is still on. Sierra's cassette recorder sits on the desk beside him — tape still loaded from the night before. He…"},{"n":15,"displayNum":"13","id":"entering-grass","title":"The Confrontation","act":2,"actTitle":"The Creature","summary":"Makayla wanders toward the edge of Dallas's property, kneeling over when she gets to the edge. Makayla points to a trailcam that seems to be behind Dallas' backyard gate. It is blinking - fast, wrong. The casing is…"},{"n":16,"displayNum":"14","id":"creature-rescue","title":"The Connection","act":2,"actTitle":"The Creature","summary":"Makayla and Dallas sit outside the patio. Neither of them says anything for a while."},{"n":17,"displayNum":"15","id":"the-tracking-box","title":"The Tracking Network","act":2,"actTitle":"The Creature","summary":"Dallas and Makayla walk toward the neighborhood, through a long stretch of golden-hour woodland, until an open field spreads before them. At the far end, a row of tall trees. Dallas stops and looks around. As they cut…"},{"n":18,"displayNum":"16","id":"the-escape","title":"Back Home","act":2,"actTitle":"The Creature","summary":"Dallas makes his way out of the woods, back toward the field, carrying Makayla's field kit — the oscillator, the coiled cables, the wooden recording box. As he walks, he notices that the tall grass around him is moving…"},{"n":19,"displayNum":"16B","id":"the-soother","title":"The Soother","act":2,"actTitle":"The Creature","summary":"[SCENE FILE MISSING: s16b.md]"},{"n":20,"displayNum":"17","id":"resonance","title":"Resonance","act":2,"actTitle":"The Creature","summary":"Dallas looks at the creature by himself for a long time. Dallas stares for a long time at the golden creature. The jagged red lines on his portable viewfinder match the erratic, panicked breathing of the tiny animal.…"},{"n":21,"displayNum":"17B","id":"normal-day","title":"Normal Day","act":2,"actTitle":"The Creature","summary":"Scene 17B — Normal Day"},{"n":22,"displayNum":"17C","id":"mute-drive","title":"Mute Drive","act":2,"actTitle":"The Creature","summary":"Dominic is driving through downtown Branford. The Nor'easter winds are picking up, rattling the windows of the car. Outside, the town is engaged in banal, civic storm preparation. Shop owners are taping windows. Public…"},{"n":23,"displayNum":"17D","id":"the-handoff","title":"The Handoff","act":2,"actTitle":"The Creature","summary":"Dallas stages the creature in Dominic's basement before Life Group; Makayla wedges the broken hopper window shut; Dallas heads home for the rig as the first guests arrive."},{"n":24,"displayNum":"18","id":"life-group","title":"Life Group","act":2,"actTitle":"The Creature","summary":"Life group carries on upstairs while Dallas fights to keep the creature calm below; the creature escapes through the hopper window and runs for the marsh; Makayla recognizes what's converging on it, shows Dominic their mother's notebook, and walks out mid-hymn; the party breaks and Dominic chases her down the street with Dallas behind him."},{"n":25,"displayNum":"19","id":"the-whole-truth","title":"The Whole Truth","act":3,"actTitle":"The Return","summary":"Dallas and Dominic catch Makayla in the first band of tall grass; in the rain she finally comes clean — the injured baby, the mother waiting at the center, the red things converging, and the blaster Dallas finished from their mother's unfinished work. Dominic stops asking to go home and starts asking how to help."},{"n":26,"displayNum":"20","id":"the-cry","title":"The Cry","act":3,"actTitle":"The Return","summary":"The creature's cry rolls over the field for the first time in the open — enormous, wounded, unmistakable. All conversation ends. Dallas checks the blaster once and locks it down, and the three of them run flat-out across the field toward the sound."},{"n":27,"displayNum":"21","id":"into-the-marsh","title":"Into The Marsh","act":3,"actTitle":"The Return","summary":"The chase across the field — Makayla leading by green LED, Dallas protective at Dominic's shoulder, the ground turning from grass to mud as the marsh takes over. Dominic realizes he is trusting them with his life, and does. They hit the treeline and Dallas takes the lead toward the blind."},{"n":28,"displayNum":"22","id":"the-blind-waypoint","title":"The Blind Waypoint","act":3,"actTitle":"The Return","summary":"Chasing Makayla, Dallas and Dominic reach the blind — Dominic sees his sister's life's work for the first time. Makayla is there for seconds: she clips the scuffed recorder to Dominic's jacket, shows them the feed, and is gone again. They follow her in."},{"n":29,"displayNum":"23","id":"predator-attack","title":"The Trench Run","act":3,"actTitle":"The Return","summary":"Dallas and Dominic push into the tall grass together. Ahead of them, glimpsed through the stalks, the small green LED on Makayla's chest rig — there, gone, there again. Dallas follows it, the field bag heavy on his…"},{"n":30,"displayNum":"24","id":"the-perimeter","title":"The Sanctuary & The Siege","act":3,"actTitle":"The Return","summary":"The howling wind dies down. Makayla breaches through a thick wall of reeds first, alone, tracker in hand, and stops dead — thirty seconds ahead of the men. She is standing in a small clearing where the tall grass lies…"},{"n":31,"displayNum":"25","id":"the-last-dinner","title":"The Final Blast","act":3,"actTitle":"The Return","summary":"Dallas presses both thumbs to the oscillator and pushes the creature's call out into the storm — the pulse he rebuilt over all those nights, fed through the spare and out across every recorder staked in the marsh. For a…"},{"n":32,"displayNum":"26","id":"final-echoes","title":"The Morning After","act":4,"actTitle":"Aftermath","summary":"The three of them — Dallas, Dominic, Makayla — walk back through the tall grass, through neighborhoods, back and slow. Dallas and Dominic make their way through the door, soaked and exhausted."},{"n":33,"displayNum":"27","id":"aftermath","title":"Little Aftermath","act":4,"actTitle":"Aftermath","summary":"The town is back to normal. People move through their routines. The strange occurrences of the last few days are still on everyone's lips—muted, half-disbelieved. Dallas walks alone into the flattened ring of grass from…"},{"n":34,"displayNum":"28","id":"full-circle","title":"Full Circle","act":4,"actTitle":"Aftermath","summary":"Dallas goes alone to Makayla's wooded blind to pack up. He misreads one last spike, then listens with his own ears and lets it go. Dallas finds his wife's specific hum out in the marsh."}];
      
      const grid = document.getElementById('plotCardsGrid');

      function toRoman(num) {
        const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
        let n = num, out = '';
        for (const [v, s] of map) {
          while (n >= v) { out += s; n -= v; }
        }
        return out;
      }

      function renderCards(cards) {
        if (!cards || !cards.length) {
          grid.innerHTML = '<p class="plot-cards-loading">No card data available.</p>';
          return;
        }
        
        let currentAct = null;
        cards.forEach(function(card) {
          if (card.act !== currentAct) {
            currentAct = card.act;
            const actLabel = document.createElement('div');
            actLabel.className = 'plot-cards-act-label';
            actLabel.setAttribute('aria-hidden', 'true');
            actLabel.textContent = 'ACT ' + toRoman(card.act) + ' — ' + (card.actTitle || '');
            grid.appendChild(actLabel);
          }
          const cardDiv = document.createElement('div');
          cardDiv.className = 'plot-card';
          cardDiv.innerHTML =
            '<span class="plot-card-number">' + card.n + '</span>' +
            '<h2 class="plot-card-title">' + escapeHtml(card.title) + '</h2>' +
            '<p class="plot-card-summary">' + escapeHtml(card.summary) + '</p>' +
            '<div class="plot-card-links" style="margin-top: auto; display: flex; gap: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 1rem; font-size: 0.8rem;">' +
              '<a href="full_script.html#scene-' + card.n + '" class="plot-card-link" style="text-decoration: none; font-weight: 600;">Full Script</a>' +
              '<a href="scene.html?id=' + encodeURIComponent(card.id) + '" class="plot-card-link" style="text-decoration: none; color: var(--muted); border-left: 1px solid var(--border); padding-left: 0.75rem;">Preview</a>' +
            '</div>';
          grid.appendChild(cardDiv);

        });
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Render immediately
      renderCards(CARDS_DATA);
    })();
  </script>
