tle":"The Creature","summary":"Dallas looks at the creature by himself for a long time. Dallas stares for a long time at the golden creature. The jagged red lines on his portable viewfinder match the erratic, panicked breathing of the tiny animal.…"},{"n":21,"displayNum":"17B","id":"normal-day","title":"Normal Day","act":2,"actTitle":"The Creature","summary":"Dominic walks the docks at the Branford town marina, a clipboard under his arm. The harbor is buzzing with the banal energy of pre-storm preparation—owners lashing extra lines, tying down tarps, hauling small craft up…"},{"n":22,"displayNum":"17C","id":"mute-drive","title":"Mute Drive","act":2,"actTitle":"The Creature","summary":"Dominic is driving through downtown Branford. The Nor'easter winds are picking up, rattling the windows of the car. Outside, the town is engaged in banal, civic storm preparation. Shop owners are taping windows. Public…"},{"n":23,"displayNum":"17D","id":"the-handoff","title":"The Handoff","act":2,"actTitle":"The Creature","summary":"Dallas stages the creature in Dominic's basement before Life Group; Makayla wedges the broken hopper window shut; Dallas heads home for the rig as the first guests arrive."},{"n":24,"displayNum":"18","id":"life-group","title":"Life Group","act":2,"actTitle":"The Creature","summary":"Life group carries on upstairs while Dallas fights to keep the creature calm below; the hymn and the broadcast tangle, the creature escapes through the hopper window, and Dallas walks into the storm — Dominic and Makayla follow."},{"n":25,"displayNum":"19","id":"the-marsh-rescue","title":"The Marsh Rescue","act":2,"actTitle":"The Creature","summary":"Dallas walks into the marsh in a trance following the creature's frequency; Dominic catches up; together they break the dark ones' circle with the oscillator and pull the creature out — Makayla meets them at the edge with the gear."},{"n":26,"displayNum":"22","id":"marsh-confrontation","title":"The Load-Out","act":3,"actTitle":"The Makayla's wooded blind to pack up. He misreads one last spike, then listens with his own ears and lets it go. Dallas finds his wife's specific hum out in the marsh."}];
      
      const grid = document.getElementById('plotCardsGrid');

      function toRoman(num) {
        const map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
        let n = num, out = '';
        for (const [v, s] of map) {
          while (n >= v) { out += s; n -= v; }
        }
        return out;
      }

      function renderCards(cards) {
        if (!cards || !cards.length) {
          grid.innerHTML = '<p class="plot-cards-loading">No card data available.</p>';
          return;
        }
        
        let currentAct = null;
        cards.forEach(function(card) {
          if (card.act !== currentAct) {
            currentAct = card.act;
            const actLabel = document.createElement('div');
            actLabel.className = 'plot-cards-act-label';
            actLabel.setAttribute('aria-hidden', 'true');
            actLabel.textContent = 'ACT ' + toRoman(card.act) + ' — ' + (card.actTitle || '');
            grid.appendChild(actLabel);
          }
          const cardDiv = document.createElement('div');
          cardDiv.className = 'plot-card';
          cardDiv.innerHTML =
            '<span class="plot-card-number">' + card.n + '</span>' +
            '<h2 class="plot-card-title">' + escapeHtml(card.title) + '</h2>' +
            '<p class="plot-card-summary">' + escapeHtml(card.summary) + '</p>' +
            '<div class="plot-card-links" style="margin-top: auto; display: flex; gap: 0.75rem; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 1rem; font-size: 0.8rem;">' +
              '<a href="full_script.html#scene-' + card.n + '" class="plot-card-link" style="text-decoration: none; font-weight: 600;">Full Script</a>' +
              '<a href="scene.html?id=' + encodeURIComponent(card.id) + '" class="plot-card-link" style="text-decoration: none; color: var(--muted); border-left: 1px solid var(--border); padding-left: 0.75rem;">Preview</a>' +
            '</div>';
          grid.appendChild(cardDiv);

        });
      }

      function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Render immediately
      renderCards(CARDS_DATA);
    })();
