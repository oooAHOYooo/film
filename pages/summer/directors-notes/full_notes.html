  <script>
    const markdown = "# Director's Notes — Creatures in the Tall Grass\n\n*Compiled on 6/9/2026, 11:57:12 PM*\n\n---\n\n## Script Additions\n\n# Script Additions\n\nNotes and ideas to add or change in the script. Use this as a running list; you can also add scene-specific additions in each scene’s director note.\n\n---\n\n# CHANGE LOG — Style pass + the climax becomes \"The Answer\" (call amplification, not a blast)\n*Applied 2026-06-09 23:57 EDT · SHOOTING version only (`pages/summer/shooting/`). **Supersedes the single-emitter climax logged below** — the weapon is no longer one destructive pulse; the recorder network returns, reframed as the creature's amplified voice. The Golden Elders are cut to a single mother. Leaf monsters replace the shadow-rot.*\n\n## Standing prose-style directive (all shooting-script writing from here on)\nProse is plain and declarative. Banned: the \"not X, but Y\" antithesis, the \"this isn't X, it's Y\" reframe, the \"not just X\" intensifier, dramatic sentence fragments, and the rule-of-three rhythm. State what happens and let the image carry it. Full pass done over s21–s25 (e.g. \"a pair of eyes. Bright. Dim. Bright. Red. And then gone.\" -> \"a pair of red eyes flares bright, dims, and disappears\"; \"Silence. Total silence. The wind stops.\" -> \"Everything goes silent. The wind stops\").\n\n## The Golden Elders are gone — one mother and her child\n| Scene | Change |\n|---|---|\n| **s24** (retitled **\"The Mother & The Swarm\"**, was \"The Sanctuary & The Siege\") | Removed the circle of GOLDEN ELDERS, the woven-grass sanctuary wall, and the humming golden dome. The center is now a small flattened clearing with **a single mother creature** glowing faint gold. The reunion is witnessed up close by Makayla; the mother bows to her, then to Dallas. |\n| **s25** | All Elder / ring / sanctuary references removed. |\n\n## The monsters are \"leaf monsters\" — dead grass and bramble, not shadow-rot\nThe Red-Eyes are recast as **car-sized tangles of dead leaves, grass, and bramble that lurch upright with red eyes burning inside**. The black-rot \"veins\" become matted dead leaves and brittle reeds (s23). When destroyed they **come apart into ordinary piles of leaves and reeds** (s25).\n\n## The weapon is the creature's own call, amplified by the whole recorder field\nThe destructive single-pulse emitter is dropped. New plan, stated in **s22**: reach the center, push the creature's own call out through every recorder they planted across the marsh, and call its kind home to it.\n- **s22** — Dallas carries a **broadcast rig** (oscillator, the spare Makayla gave him, a coil of cable) — \"he has the creature's call rebuilt and ready.\"\n- **s24** — Makayla's handheld speaker fires once and dies; Dallas commits: *\"We're done shouting at them. I'm sending its own call back out, through every recorder we ever planted.\"*\n- **s25** (retitled **\"The Answer\"**, was \"The Final Blast\") — one source is not enough; then **every recorder the crew ever planted tears off its stake and flies inward**, converging on the mother and baby and pouring the call back **a thousandfold**. *\"The crew built these to hunt it. Now they watch them become its voice.\"* The amplified call **un-makes the leaf monsters** — the brush loses its grip and collapses into dead leaves, the red eyes go dark, the wind drops.\n\n## Makayla gears up at her wigwam lair (new beat, s22)\nThe men gear at the marsh edge; then **Makayla realizes her rig is still at her lair** — \"My gear's back at the wigwam. Two minutes.\" New **INT. MAKAYLA'S LAIR (s22.2)**: she ducks into the wigwam (maps and Sierra's drawings still on the floor), straps on the chest rig, seats the oscillator, grabs the portable speaker, and runs back.\n\n## Getting lost in the grass (new beat, s23)\nAfter the three regroup in the pitch dark, **Dallas's tracker loses the creature's signal**; they double back, the grass swallows the path, and they end up turned around. Then **the red eyes flash on out in the grass** (one, then a dozen) — feeding into Makayla's \"I saw the creature but it vanished… those things are after it.\" Makayla leads from here.\n\n## The mother dies softly; Asher calms Mr. Mike by mirroring\n- **s25** — with the monsters gone, the **exhausted mother lowers herself with the baby tucked against her, her light guttering like a candle**, presses her brow to it one last time, and **scatters on the breeze**. She is not torn apart now; she gives out. Only flattened grass remains.\n- **s25.2 (house)** — at the peak Mr. Mike panics (\"they're in the eaves\"); **Asher steps in, sways and hums the way Makayla does for him, hand pressed to the boy's chest**, until the old man's breath finds the rhythm and he goes calm: *\"There. There they go.\"*\n- The **baby survives**, looks back at Dallas and Makayla, and **dissolves into the ether**. They saved the child and lost the mother; it leaves alone.\n\n## Recompiled\n- `node pages/summer/shooting/script-system/compile.js` — full_script.md/.html, plot cards, gallery (40 scenes).\n- `node pages/summer/directors-notes/compile.js` — full_notes.md/.html.\n\n---\n\n# CHANGE LOG — Climax reworked: Asher stays home · single emitter · the mother dies\n*Applied 2026-06-09 21:16 EDT · SHOOTING version only (`pages/summer/shooting/`). **Supersedes the Firefly-Network climax logged below** — the distributed-node weapon and Asher's in-marsh role are removed.*\n\n## Asher is pulled out of the marsh entirely — he stays home with Mr. Mike\nThe whole climax used to turn on Asher (voice-throw decoy in s23, reading the firefly map + humming the note in s24/s25). Per direction, **Asher never enters the marsh.** He stays at the house to care for **Mr. Mike, who is failing and agitated, and tries to calm him.** The three adults — Dallas, Makayla, Dominic — run the marsh.\n| Scene | Change |\n|---|---|\n| **s21.3** | Was the contradictory \"Dallas and Asher stop at the edge of the porch\" (Dallas was already chasing Makayla). Now **Asher** stops at the porch, looks back to the house/Mr. Mike, and **backs inside — \"He's not going out there. He's staying with the old man.\"** |\n| **s22 (Load-Out)** | Asher no longer gears up. New beat: **\"Asher isn't coming. He's staying with Mr. Mike… someone has to keep him calm.\"** Also reframes **Dominic as the protector** (\"there's no version of this where he lets his family walk in without him\") and **Dallas as decisive** (\"he knows exactly what this thing can do\"). |\n| **s23.2 (house cut)** | Strengthened: Asher kneels at Mr. Mike's chair, the old man **agitated and hating that they're out there**, Asher holding him steady — \"I've got you… Stay with me.\" |\n| **s23.3 (the patrolling Red-Eye)** | **Asher's voice-throw decoy removed.** Replaced with a **hide-and-pass**: Makayla kills the chest-rig LED, the three drop flat in the mud, the shadow sweeps over them and loses the thread. Asher's \"the center is close\" line reassigned to **Makayla**. |\n\n## Single device, not a node field — Dallas fires one concentrated pulse\nThe distributed firefly network is **dropped**. The weapon is now **one man-portable directional emitter** Dallas carries in.\n- **s22** — gear is now: Makayla's chest rig (oscillator/crystal/dial), **Dallas's directional emitter** (\"built to throw one overdriven pulse\") + handheld tracker, Dominic's backpack with the baby. \"One device. One shot.\"\n- **s24** — the small handheld speaker fires once and **dies**; instead of triggering a field, **Dallas swings the emitter off his back** — \"Then we use the big one. Once.\" (firefly-map / bead-counting / \"they have to sing\" beat all removed).\n- **s25** — Dallas **already knows the pitch** and dials straight to **115.3 — Mr. Mike's number**, finally paying off. He **aims and fires** a single concentrated lance of sound that vaporizes the swarm and purges the contagion (clean forearms). No field-wide ignition, no rising-firefly finale.\n\n## The mother dies; the baby survives and passes into the ether\n- **s24** — the reunion is now witnessed **up close by Makayla** (she's the one who lifts the baby out and sets it down; the mother bows to **Makayla**, not Asher). The mother **curls around the baby and takes the assault on her own back**; the other Elders are driven to the edges.\n- **s25** — in the swirl, the Red-Eyes **tear the mother down** as Makayla watches; the baby is knocked clear. After Dallas fires, **Dominic — the protector — is frozen in disbelief** (\"That's not possible…\") then snaps to and **gets everyone out (\"Go, go, GO\")**. In the smoke the **orphaned baby rises**, takes a few steps away, **looks back and locks eyes with Dallas and Makayla**, then **dissolves into the ether**. Bittersweet: they saved the baby but lost the mother; it leaves alone.\n- **Mr. Mike (s25.2 house intercut)** — as the marsh goes quiet, his agitation drains and he goes calm — *\"There. There they go.\"* He **survives** (confirmed downstream: he's alive and well at the s27.4 church picnic, *\"Quiet now. The numbers are finally right.\"*). Read as the storm passing out of him, not a death.\n\n## Continuity fix downstream (s27)\n- **s27.2 (aftermath)** — Dallas returning to the ring used to find \"the small **master node still staked** in the mud\" — leftover from the firefly version. Now he finds **the directional emitter they left behind in the flight** (oscillator screen cracked but still glowing, holding the one clean recording). Keeps the saved-recording payoff intact.\n\n## Recompiled\n- `node pages/summer/shooting/script-system/compile.js` — full_script.md/.html, plot cards, and gallery index all rebuilt (40 scenes).\n\n## Open items / watch-fors\n- **Dangling setup plants:** the earlier firefly-network seeds (**s07** Asher's bead-map line, **s14b** \"a bead for every listening post,\" **s15b** the dusk planting beat, **s28** node collection) no longer pay off as a weapon. They still read as worldbuilding (the kids geotag/seed the marsh; Asher's gift), but if you want a clean payoff-free script say the word and I'll trim them.\n- **Production plan + call sheets updated.** Reworked `production-edit.md` for **marsh-confrontation (s22)**, **predator-attack (s23)**, **the-perimeter (s24)**, **the-last-dinner (s25)** → single directional emitter as the hero weapon (no node field / master rig / eighty-pound speakers), the mother's death + baby-into-the-ether beat, hide-and-pass instead of the voice-throw, and house-interior intercut units for the Asher/Mr. Mike beats. **Cast corrected:** Asher off the two pure-marsh scenes (s22, s24); kept (with Mr. Mike) on the house-intercut scenes (s23, s25). Softened **the-tracking-box (s15b)** note (nodes are worldbuilding now, not the weapon). Re-synced `production-data.json` and regenerated all call sheets.\n---\n\n# CHANGE LOG — Dominic's inhaler removed + s23 line fixes\n*Applied 2026-06-09 14:51 EDT · SHOOTING version only (`pages/summer/shooting/`).*\n\n## Dominic loses the inhaler (calm, cool, Pedro-Pascal energy — not anxious/wheezing)\nRemoved every asthma/inhaler reference (8 across 5 scenes). The s09 \"powder-puff\" creature description is NOT an inhaler — left alone.\n| Scene | Was → Now |\n|---|---|\n| **s03** | parking ticket: \"takes out an inhaler… massive rip\" → **\"He exhales slow, shakes his head, and lets it go.\"** |\n| **s05** | \"grabs his Asmatha inhaler and takes a deep breath\" → **\"He takes a slow, deep breath, collecting himself.\"** |\n| **s06** | \"takes a deep breath and takes a hit of his inhaler\" → **\"Dominic takes a slow breath.\"** |\n| **s07** | \"takes a hit of his inhaler. And reaches out for a handshake\" → **\"Dominic reaches out for a handshake.\"** |\n| **s23** (search for Makayla) | \"begins to pace around and hits his inhaler\" → **\"begins to pace around.\"** (pacing + roar kept) |\n| **s23** (march) | \"takes another big hit of his inhaler\" → **\"wipes the rain from his face and pushes forward.\"** |\n| **s23** (after Asher's save) | \"re-shoulders the backpack… and hits his inhaler\" → **\"re-shoulders the backpack with the baby.\"** |\n\n## s23 line fixes\n- **\"I'm slipping.\" → \"It's right on us.\"** — the old line was written for sliding under a heavy speaker; with no heavy gear, Dominic is knocked to his knees shielding the baby, so the line now fits the Red-Eye closing in.\n- **Removed the redundant tracker beat** — Dallas already enters \"carrying the tracker, watching the green light,\" so the later \"begins to take out a little tracker\" (and a duplicate \"stops\") was deleted; reads continuously now.\n\n## Deliverable\n- Saved a fresh full-script snapshot: **`pages/summer/shooting/script-system/creatures_in_the_tall_grass_full_script__9_.md`** (new file, not an overwrite). `full_script.md` was also rebuilt from the edited scene sources to stay in sync; prior version preserved in git.\n\n---\n\n# CHANGE LOG — Firefly Network climax + continuity fixes\n*Applied 2026-06-09 13:41 EDT · SHOOTING version only (`pages/summer/shooting/`). Committed `900e399` on `main`.*\n\n## Continuity fixes (surgical)\n| Scene | Fix |\n|---|---|\n| **s20** | \"Cousin, listen—\" → **\"Dominic, listen—\"** (he's her brother, not cousin). |\n| **s18** | Dead-mother continuity error fixed. JOSH \"how's your mom doing?\" / \"She's doing better\" → **\"how's the family holding up?\"** / **\"We're getting by. Thanks.\"** (mother is deceased; kept same length). |\n| **s17c** | Repaired a broken speaker attribution — the garbled `DOMINIC / Makayla, what is / Something they aren't ready for.` is now **DOMINIC: \"Makayla, what is it?\"** → **MAKAYLA: \"Something they aren't ready for.\"** |\n| **s03 / s12 / s16 / s17c** | Car consistency: every **\"minivan\" → \"car\"** (incl. the s17c scene heading); **\"INT. DOMINIC's SISTER's CAR\" → \"INT. DOMINIC'S CAR\"** in s03. |\n\n## Climax rewrite — The Firefly Network (replaces the 80-lb speaker finale)\n- **s24 (The Sanctuary & The Siege)** and **s25 (The Final Blast)** fully rewritten. The two eighty-pound wooden speakers are gone. New mechanism: the baby reunites with its **mother Elder**; the Red-Eyes breach the ring; Makayla's **single portable speaker isn't enough**; she triggers the **distributed firefly node network** planted across the marsh, all firing one note (115.3) at once for a concussive purge. **Dominic shields Asher** with his body over the master node.\n- **Setup plants seeded earlier** so the climax pays off:\n  - **s05** — already foreshadowed it (\"the kids are always out here planting down cameras… geotagging\"); left as-is, now reads as deliberate.\n  - **s07** — the ceiling beads are reframed as **Asher's hanging node-map** (\"Every bead's a spot out in the grass we've tagged\").\n  - **s14b** — \"the quantity matters\" now ties **each bead to a planted listening post**.\n  - **s15b** — NEW dusk **planting beat**: Makayla & Asher stake blinking nodes, Dallas: \"Fireflies?\", Makayla: \"Listening posts,\" Asher threads a bead per node. *(The single most important plant.)*\n  - **s28** — the lair pack-up now shows them **collecting the nodes** / un-threading beads (closes the loop).\n- **s22 (The Load-Out) & s23 (The Trench Run)** — the crew moves **LIGHT** into the marsh. The weapon is the distributed node field that's *already in the ground*, and the master node is *already staked* at the sanctuary center — they go TO it, they don't haul it. The crew carries only: the baby (Dominic's backpack), the handheld tracker, Makayla's wearable chest rig (oscillator + crystal + master-node trigger), and the small handheld speaker. All the storm / mud / fear / Asher-throws-his-voice danger beats are intact — Dominic's strain is from being unfit and scared, not from carrying weight. *(Earlier draft hauled a \"master rig\" — that has been removed.)*\n\n## Production plan updated (shooting version)\n- `production-edit.md` `key-elements` / `production-notes` updated for **the-tracking-box (s15b)**, **marsh-confrontation (s22)**, **predator-attack (s23)**, **the-perimeter (s24)**, **the-last-dinner (s25)** — flagged \"REVISED — firefly-network climax (no eighty-pound speakers)\", master-rig hero prop, practical blinking nodes + Asher's bead string, and the VFX needs (golden dome, swarm ignition). Re-synced to `production-data.json` and regenerated the call sheets.\n\n## Open items / watch-fors\n- **Practical props to build:** blinking amber listening-post nodes (need a field's worth for the wide shots / VFX plates) + one hero master node staked at the ring center, Makayla's wearable chest rig (oscillator + crystal + trigger), the handheld tracker, the small handheld speaker, and Asher's bead string (continuity from s07 → s28). No heavy hauled gear.\n- **VFX scope grew** at the climax: hundreds of node lights firing in unison + a rising swarm, vs. the old single golden BOOM. Budget/plan accordingly.\n- **Done:** cleaned the marsh cast lists — removed the stale Mr. Mike/Pat roster from **s22 (marsh-confrontation)**, **s26b (wrap)**, and **s28 (full-circle)** → now Dallas/Makayla/Asher/Dominic. Left **s27 (aftermath)** intact, where Pat (weather wrap) and Mr. Mike (church) legitimately appear.\n- **Also fixed:** s27.2 climax continuity — Dallas now finds the small **master node still staked** in the mud (oscillator on its side, screen cracked, node still blinking with the clean recording), not the old \"speakers knocked face-down in the mud.\"\n\n---\n\n# CHANGE LOG — Janice & Howie removed, Dominic recast as sibling\n*Applied 2026-06-09 12:23 EDT · SHOOTING version only (`pages/summer/shooting/`). The original `script-system/` was not touched.*\n\n## What changed (the four directives)\n\n1. **DELETE Janice Amaranto** — removed entirely. Where her presence drove a beat, the beat folds into **Dominic** (who was already in most of those scenes).\n2. **DELETE Howie (the dog)** — removed entirely, no replacement. Where the dog was the *reason* a character acted, I used the next simplest motivation already present (Dallas walking/recording alone; Dominic just checking on the house; cut the animal-senses-danger beats).\n3. **Dominic replaces Janice** on her key beats (see per-scene below).\n4. **Family relationships** — Makayla & Asher are no longer Dominic's *niece/nephew*; they are his **sister and brother**. \"Uncle Dom\" / \"Uncle\" → \"Dom\". **Mr. Mike stays the uncle** of all three.\n\n**New family structure:** Dominic (oldest sibling, early 40s) · Makayla (22) · Asher (14) · Mr. Mike (their uncle, mid-70s, the one they care for).\n\n## Scenes affected (18 scene files)\n\n| Scene | What I changed |\n|---|---|\n| **s03** | Dominic's coyote line \"…when I was walking Howie\" → \"…when I was out walking.\" |\n| **s04** (Fellowship) | Cut Janice's entire entrance (her + the dog \"Howie\" greeting, the medication/sprouts nag, the \"watch the car\" exit). Dominic: \"my niece and nephew\" → **\"my sister and brother — Makayla and Asher.\"** |\n| **s06** | Dominic: \"before Janice has her women's group\" → \"before **life group** tonight.\" |\n| **s07** (The Coordinates) | \"my niece and nephew\" → \"my brother and sister.\" Dominic's confession: \"Just the niece and nephew. Janice and Mr. Mike.\" → **\"Just my brother and sister. And Mr. Mike.\"** Mr. Mike's \"Your sister. Makayla. Asher\" → **\"Dominic. Makayla. Asher.\"** \"In pops Janice with Makayla and Asher\" → \"In pop Makayla and Asher.\" Mr. Mike's \"…Janice is here…\" → \"…Makayla's here…\". **Janice's whole grocery sequence** (boat-anchor recorder bit + dinner invite) reassigned to **Dominic**. **Entire Howie adoption thread removed** (the dog handoff that set up Dallas dog-sitting). \"Janice from the Kitchen: calm down\" → Dominic. \"Janice: give it back\" → Dominic. Ending: Janice's smoke-break exit → **Dominic steps out to the patio**, Dallas follows him. |\n| **s07b** (Mr. Mike's Warning) | Slug note updated: removed \"Janice has gone outside for a smoke\" and \"Dallas is alone with Mr. Mike **and the dog**.\" |\n| **s08d** (The Return) | Removed \"Dominic is downstairs with Howie\" and the **dog-sitting phone call** (\"do you mind watching Howie?\"). Now Dominic just calls to say Asher's going to the hospital and asks Dallas to keep an eye on the place. Cut Howie sleeping/crying. |\n| **s11** (Kitchen Triage) | No narrative change — fixed the stale scene id `howie-walk-2` → `kitchen-triage` (it was mislabeled; title was already \"Kitchen Triage\"). |\n| **s13** (The Confrontation) | \"could you watch Howie again?\" → just the bible-study invite. Makayla: \"show you the spots that Howie likes\" → \"show you around.\" \"Okay Uncle.\" → **\"Okay Dom.\"** Found-the-creature exchange: \"I was walking Howie / How did Howie react?\" → \"I was out walking / Was anyone with you?\" → \"No — I was alone.\" |\n| **s14** (The Connection) | Cut \"Howie sleeps peacefully near Dallas' feet.\" \"Dallas looks at Howie\" → \"looks at the ground.\" \"living with her babybrother\" → **\"living with our uncle\"** (Mr. Mike). |\n| **s14c** (The Almost Discovery) | \"Janice said you might have our step ladder\" → \"I think you might have…\". Cut \"holding Howie's leash\" + the dog pulling/\"won't stop staring at your backyard\" beat. \"Hey Uncle Dom.\" → **\"Hey Dom.\"** \"Janice said you were fixing the porch light?\" → \"weren't you fixing…\". Cut \"Howie WHINES softly.\" |\n| **s15b** (Tracking Box) | \"Aunt Janice will never understand…\" → **\"Most people will never understand…\"** (kept \"Dominic might\"). |\n| **s16** (Back Home) | Rewrote the curb beat: **no Janice in the window, no Howie panic.** Dominic pulls up alone, calm welfare check (\"You kids alright?\"), **quietly clocks the backpack as off and lets it go**, tells them to get in / leave Dallas to rest for life group. |\n| **s17b** (Normal Day) | **Replaced the Costco cross-cut** (Dominic + Janice shopping) **with Dominic at Branford Harbor** — checking boats, si
